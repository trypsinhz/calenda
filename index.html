x=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\">\u003crect x=\"3\" y=\"5\" width=\"18\" height=\"16\" rx=\"3\"/>\u003cpath d=\"M8 3v4M16 3v4M3 10h18\"/>\u003c/svg>\n      ปฏิทิน\n    \u003c/button>\n    \u003cbutton class=\"nav\" data-open-line>\n      \u003csvg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"currentColor\">\u003cpath d=\"M12 3C6.5 3 2 6.6 2 11c0 3.9 3.5 7.2 8.3 7.9.3.1.8.2.9.5.1.3.1.7 0 1l-.1.9c0 .3-.2 1 .9.5s5.9-3.5 8.1-6C21.4 14.2 22 12.7 22 11c0-4.4-4.5-8-10-8z\"/>\u003c/svg>\n      LINE\n    \u003c/button>\n    \u003cdiv class=\"spacer\">\u003c/div>\n    \u003cdiv class=\"line-mini\" id=\"lineMini\">\u003c/div>\n  \u003c/aside>\n\n  \u003cmain class=\"content\">\n    \u003cdiv class=\"topbar\">\n      \u003cdiv>\n        \u003ch1 id=\"pageTitle\">แดชบอร์ด\u003c/h1>\n        \u003cp>\u003cspan id=\"todayText\">\u003c/span>\u003cspan class=\"sync\" id=\"syncBadge\" data-open-line style=\"cursor:pointer\" title=\"ตั้งค่าการเชื่อมต่อ Google Sheets\">\u003ci>\u003c/i>\u003cspan>\u003c/span>\u003c/span>\u003c/p>\n      \u003c/div>\n      \u003cdiv class=\"actions\">\n        \u003cbutton class=\"btn icon-btn\" id=\"themeBtn\" title=\"สลับธีม\">\n          \u003csvg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\">\u003cpath d=\"M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z\"/>\u003c/svg>\n        \u003c/button>\n        \u003cbutton class=\"btn\" data-open-line>\n          \u003csvg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"#06c755\">\u003cpath d=\"M12 3C6.5 3 2 6.6 2 11c0 3.9 3.5 7.2 8.3 7.9.3.1.8.2.9.5.1.3.1.7 0 1l-.1.9c0 .3-.2 1 .9.5s5.9-3.5 8.1-6C21.4 14.2 22 12.7 22 11c0-4.4-4.5-8-10-8z\"/>\u003c/svg>\n          ตั้งค่า LINE\n        \u003c/button>\n        \u003cbutton class=\"btn primary\" id=\"addBtn\">＋ เพิ่มรายการ\u003c/button>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv id=\"main\">\u003c/div>\n  \u003c/main>\n\u003c/div>\n\n\u003c!-- Add / Edit modal -->\n\u003cdiv class=\"overlay\" id=\"itemModal\">\n  \u003cform class=\"modal\" id=\"itemForm\" autocomplete=\"off\">\n    \u003cheader>\u003ch2 id=\"formTitle\">เพิ่มรายการ\u003c/h2>\u003cbutton type=\"button\" class=\"btn ghost icon-btn\" data-close>✕\u003c/button>\u003c/header>\n    \u003cdiv class=\"body\">\n      \u003cdiv class=\"field\">\u003clabel>ประเภท\u003c/label>\u003cdiv class=\"cat-pick\" id=\"catPick\">\u003c/div>\u003c/div>\n      \u003cdiv class=\"field\">\n        \u003clabel for=\"fTitle\">ชื่อรายการ *\u003c/label>\n        \u003cinput id=\"fTitle\" required placeholder=\"เช่น พ.ร.บ. รถเก๋ง, ถ่านรีโมทประตู\">\n      \u003c/div>\n      \u003cdiv class=\"field\">\n        \u003clabel for=\"fAsset\">อุปกรณ์ / ทะเบียน\u003c/label>\n        \u003cinput id=\"fAsset\" placeholder=\"เช่น กข 1234 กทม., รีโมทแอร์ห้องนอน\">\n      \u003c/div>\n      \u003cdiv class=\"grid2\">\n        \u003cdiv class=\"field\">\u003clabel for=\"fDue\">วันครบกำหนด * \u003cspan style=\"font-weight:400;color:var(--muted)\">(วว/ดด/ปปปป พ.ศ.)\u003c/span>\u003c/label>\u003cinput type=\"text\" id=\"fDue\" required inputmode=\"numeric\" placeholder=\"เช่น 04/10/2569\" maxlength=\"10\" autocomplete=\"off\">\u003c/div>\n        \u003cdiv class=\"field\">\n          \u003clabel for=\"fCycle\">รอบการต่ออายุ\u003c/label>\n          \u003cselect id=\"fCycle\">\n            \u003coption value=\"1\">ทุก 1 เดือน\u003c/option>\n            \u003coption value=\"3\">ทุก 3 เดือน\u003c/option>\n            \u003coption value=\"6\">ทุก 6 เดือน\u003c/option>\n            \u003coption value=\"12\" selected>ทุก 1 ปี\u003c/option>\n            \u003coption value=\"24\">ทุก 2 ปี\u003c/option>\n            \u003coption value=\"36\">ทุก 3 ปี\u003c/option>\n          \u003c/select>\n        \u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"field\">\n        \u003clabel>แจ้งเตือน LINE (ตั้งอัตโนมัติตามรอบ)\u003c/label>\n        \u003cdiv class=\"note\" id=\"fNotifyText\">\u003c/div>\n        \u003cdiv class=\"hint\">งานครั้งเดียว ให้เพิ่มเป็นงานในแท็บ 📅 Calenda แทน\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"field\">\n        \u003clabel>ผู้รับผิดชอบ \u003cspan style=\"font-weight:400;color:var(--muted)\">(คนที่ติ๊กจะเห็นรายการนี้ + ได้แจ้งเตือน)\u003c/span>\u003c/label>\n        \u003cdiv class=\"checks\" id=\"fTags\">\u003c/div>\n        \u003cdiv class=\"hint\" id=\"fOwnerNote\">\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"field\">\n        \u003clabel for=\"fNote\">หมายเหตุ\u003c/label>\n        \u003ctextarea id=\"fNote\" placeholder=\"เช่น บริษัทประกัน, เบอร์ติดต่อ, ขนาดถ่าน AA/CR2032\">\u003c/textarea>\n      \u003c/div>\n    \u003c/div>\n    \u003cfooter>\n      \u003cbutton type=\"button\" class=\"btn danger\" id=\"delBtn\" style=\"margin-right:auto\">ลบ\u003c/button>\n      \u003cbutton type=\"button\" class=\"btn\" data-close>ยกเลิก\u003c/button>\n      \u003cbutton type=\"submit\" class=\"btn primary\">บันทึก\u003c/button>\n    \u003c/footer>\n  \u003c/form>\n\u003c/div>\n\n\u003c!-- LINE settings modal -->\n\u003cdiv class=\"overlay\" id=\"lineModal\">\n  \u003cdiv class=\"modal\" style=\"max-width:880px\">\n    \u003cheader>\u003ch2>เชื่อมต่อ & แจ้งเตือน LINE\u003c/h2>\u003cbutton type=\"button\" class=\"btn ghost icon-btn\" data-close>✕\u003c/button>\u003c/header>\n    \u003cdiv class=\"body\">\n      \u003cdiv class=\"line-wrap\">\n        \u003cdiv style=\"display:grid;gap:14px;align-content:start\">\n          \u003cdiv class=\"sec-title\">① เชื่อมต่อ Google Apps Script\u003c/div>\n          \u003cdiv class=\"sub\" id=\"gasNote\" style=\"display:none\">✅ เปิดจาก Google Apps Script — เชื่อมต่อ Google Sheets อัตโนมัติ\u003c/div>\n          \u003cdiv id=\"apBox\" style=\"display:grid;gap:14px\">\n          \u003cdiv class=\"field\">\u003clabel for=\"apUrl\">Web App URL\u003c/label>\u003cinput id=\"apUrl\" placeholder=\"https://script.google.com/macros/s/.../exec\">\u003c/div>\n          \u003cdiv class=\"field\">\u003clabel for=\"apKey\">API Key\u003c/label>\u003cinput id=\"apKey\" type=\"password\" placeholder=\"Script Properties → API_KEY\">\u003c/div>\n          \u003cdiv style=\"display:flex;gap:8px;align-items:center;flex-wrap:wrap\">\n            \u003cbutton type=\"button\" class=\"btn sm\" id=\"apConnect\">เชื่อมต่อ\u003c/button>\n            \u003cbutton type=\"button\" class=\"btn sm\" id=\"apImport\" title=\"ส่งรายการที่เก็บในเบราว์เซอร์นี้ขึ้น Google Sheets\">⬆ อัปโหลดข้อมูลในเครื่องขึ้น Sheet\u003c/button>\n            \u003cbutton type=\"button\" class=\"btn sm ghost danger\" id=\"apDisconnect\">ยกเลิกการเชื่อมต่อ\u003c/button>\n          \u003c/div>\n          \u003cdiv class=\"sub\" id=\"apStatus\">\u003c/div>\n          \u003c/div>\n\n          \u003cdiv class=\"sec-title\">② การแจ้งเตือน\u003c/div>\n          \u003cdiv class=\"opt\">\u003cdiv>\u003cb>เปิดการแจ้งเตือนรายวัน\u003c/b>\u003cdiv class=\"sub\">ส่งเฉพาะวันที่ตรงกับ \"แจ้งเตือนล่วงหน้า\" ของแต่ละรายการ\u003c/div>\u003c/div>\n            \u003clabel class=\"switch\">\u003cinput type=\"checkbox\" id=\"lnEnabled\">\u003cspan>\u003c/span>\u003c/label>\u003c/div>\n          \u003cdiv class=\"grid2\">\n            \u003cdiv class=\"field\">\u003clabel for=\"lnHour\">เวลาส่ง\u003c/label>\u003cselect id=\"lnHour\">\u003c/select>\u003c/div>\n            \u003cdiv class=\"field\">\u003clabel for=\"lnLook\">คำสั่ง \"เช็ค\" แสดงล่วงหน้า\u003c/label>\n              \u003cselect id=\"lnLook\">\u003coption value=\"7\">7 วัน\u003c/option>\u003coption value=\"14\">14 วัน\u003c/option>\u003coption value=\"30\">30 วัน\u003c/option>\u003coption value=\"60\">60 วัน\u003c/option>\u003coption value=\"90\">90 วัน\u003c/option>\u003c/select>\u003c/div>\n          \u003c/div>\n          \u003cdiv class=\"opt\">\u003cspan>เตือนงานปฏิทินที่ค้างซ้ำทุกวัน \u003csmall style=\"color:var(--text2)\">(ต่ออายุที่เลยกำหนดเตือนทุกวันเสมอ)\u003c/small>\u003c/span>\u003clabel class=\"switch\">\u003cinput type=\"checkbox\" id=\"lnOverdue\">\u003cspan>\u003c/span>\u003c/label>\u003c/div>\n          \u003cdiv class=\"opt\">\u003cspan>วันที่ไม่มีรายการ ไม่ต้องส่ง (ประหยัดโควตา)\u003c/span>\u003clabel class=\"switch\">\u003cinput type=\"checkbox\" id=\"lnSkip\">\u003cspan>\u003c/span>\u003c/label>\u003c/div>\n          \u003cdiv class=\"field\">\n            \u003clabel>ผู้รับข้อความ\u003c/label>\n            \u003cdiv class=\"rcpt\" id=\"rcptList\">\u003c/div>\n            \u003cdiv class=\"hint\">แอดบอทเป็นเพื่อน หรือเชิญบอทเข้ากลุ่ม แล้วกด \"เชื่อมต่อ\" อีกครั้ง รายชื่อจะขึ้นที่นี่ · ส่งเข้ากลุ่มนับโควตาตามจำนวนสมาชิก\u003c/div>\n          \u003c/div>\n          \u003cdiv class=\"note\" id=\"quotaBox\">ยังไม่ได้เชื่อมต่อ\u003c/div>\n        \u003c/div>\n        \u003cdiv>\n          \u003cdiv style=\"font-size:13px;font-weight:600;margin-bottom:6px\">ข้อความที่จะส่งวันนี้\u003c/div>\n          \u003cdiv class=\"line-preview\">\n            \u003cdiv class=\"line-sender\">\u003cdiv class=\"av\">📅\u003c/div>Renewal Bot\u003c/div>\n            \u003cdiv id=\"linePreview\">\u003c/div>\n          \u003c/div>\n          \u003cdiv class=\"hint\" style=\"font-size:12px;color:var(--muted);margin-top:8px\">แตะรายการใน LINE เพื่อบันทึกว่า \"ต่ออายุแล้ว\" ได้เลย · พิมพ์ \u003cb>เช็ค\u003c/b> เพื่อดูสรุป (ไม่เสียโควตา)\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n    \u003cfooter>\n      \u003cbutton type=\"button\" class=\"btn\" id=\"lnTest\">ส่งสรุปทดสอบตอนนี้\u003c/button>\n      \u003cbutton type=\"button\" class=\"btn primary\" id=\"lnSave\">บันทึก\u003c/button>\n    \u003c/footer>\n  \u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"tip\" id=\"tip\">\u003c/div>\n\u003cdiv class=\"toast\" id=\"toast\">\u003c/div>\n\n\u003cscript>\nconst CATS = {\n  prb:     {name:'พ.ร.บ./ภาษีรถ', icon:'🚗'},\n  doc:     {name:'บัตร/เอกสาร', icon:'🪪'},\n  ins:     {name:'ประกันภัย',   icon:'🛡️'},\n  battery: {name:'เปลี่ยนถ่าน', icon:'🔋'},\n  service: {name:'บำรุงรักษา',  icon:'🔧'},\n  other:   {name:'อื่นๆ',       icon:'📌'},\n};\nconst STATUS = {\n  over:   {name:'เลยกำหนด',     cls:'st-over',   color:'var(--red)',    icon:'⛔'},\n  urgent: {name:'ภายใน 7 วัน',  cls:'st-urgent', color:'var(--orange)', icon:'⚠️'},\n  soon:   {name:'ภายใน 30 วัน', cls:'st-soon',   color:'var(--yellow)', icon:'⏳'},\n  ok:     {name:'ปกติ',         cls:'st-ok',     color:'var(--green)',  icon:'✅'},\n};\n// วันแจ้งเตือนตามรอบ — ต้องตรงกับ notifyDaysFor_() ใน Code.gs\nconst NOTIFY_BASE = [7,3,2,1,0];\nconst NOTIFY_EXTRA = {1:[], 3:[15], 6:[30,15], 12:[30,15], 24:[30,15], 36:[90,60,30,15]};\nfunction notifyDaysFor(cycle){ return (NOTIFY_EXTRA[cycle] || []).concat(NOTIFY_BASE); }\nfunction notifyLabel(cycle){\n  const ex = (NOTIFY_EXTRA[cycle] || []).map(n => n % 30 === 0 ? (n/30)+' เดือน' : n+' วัน');\n  return (ex.length ? ex.join(', ') + ', ' : '') + '7 วันก่อน · ตั้งแต่ 3 วันเตือนทุกวัน (3, 2, 1, วันครบ) · เลยกำหนดเตือนทุกวัน';\n}\nconst DAY = 86400000;\nconst $ = s => document.querySelector(s);\n\n// ---------- storage ----------\nconst store = {\n  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch{ return d; } },\n  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch{} }\n};\n\n// ---------- date helpers ----------\nfunction iso(d){ const z = new Date(d.getTime() - d.getTimezoneOffset()*60000); return z.toISOString().slice(0,10); }\nfunction today(){ const d = new Date(); d.setHours(0,0,0,0); return d; }\nfunction parse(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }\nfunction addDays(n){ return iso(new Date(today().getTime() + n*DAY)); }\nfunction addMonths(s, n){ const d = parse(s); const day = d.getDate(); d.setMonth(d.getMonth()+n); if(d.getDate()!==day) d.setDate(0); return iso(d); }\nfunction daysLeft(s){ return Math.round((parse(s) - today())/DAY); }\nfunction thDate(s, opt={day:'numeric',month:'short',year:'numeric'}){ return parse(s).toLocaleDateString('th-TH', opt); }\nfunction esc(s){ return String(s ?? '').replace(/[&\u003c>\"']/g, c => ({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c])); }\n\nfunction sample(){\n  return [\n    {id:1, cat:'prb',     title:'พ.ร.บ. รถเก๋ง',          asset:'กข 1234 กทม.',   due:addDays(5),   cycle:12, notify:[30,7,1], note:'ต่อที่ 7-11 ได้'},\n    {id:2, cat:'prb',     title:'ภาษีรถยนต์ประจำปี',      asset:'กข 1234 กทม.',   due:addDays(12),  cycle:12, notify:[30,7],   note:'ต้องต่อ พ.ร.บ. ก่อน'},\n    {id:3, cat:'ins',     title:'ประกันชั้น 1',            asset:'กข 1234 กทม.',   due:addDays(48),  cycle:12, notify:[30,15,7], note:''},\n    {id:4, cat:'battery', title:'ถ่านรีโมทประตูรั้ว',      asset:'CR2032',        due:addDays(-3),  cycle:6,  notify:[7,1],    note:''},\n    {id:5, cat:'battery', title:'ถ่านเครื่องตรวจจับควัน',   asset:'ห้องครัว (9V)',  due:addDays(25),  cycle:12, notify:[7],      note:''},\n    {id:6, cat:'prb',     title:'พ.ร.บ. มอเตอร์ไซค์',      asset:'1กค 567',       due:addDays(95),  cycle:12, notify:[30,7],   note:''},\n    {id:7, cat:'service', title:'เปลี่ยนไส้กรองน้ำ',       asset:'เครื่องกรองน้ำ', due:addDays(2),   cycle:3,  notify:[3,1],    note:''},\n    {id:8, cat:'other',   title:'ต่ออายุโดเมน',            asset:'example.co.th', due:addDays(160), cycle:12, notify:[30,7],   note:''},\n    {id:9, cat:'service', title:'ล้างแอร์',               asset:'ห้องนอน',        due:addDays(70),  cycle:6,  notify:[7],      note:''},\n  ];\n}\n\nconst LINE_DEFAULT = {enabled:true, hour:8, recipients:[], overdueDaily:true, skipEmpty:true, lookahead:30};\nfunction localItems(){ return (store.get('renew.items', null) || sample()).map(i => ({...i, id:String(i.id), cat: i.cat==='tax' ? 'prb' : i.cat})); }\n// ถ้าเชื่อม Sheets ไว้ อย่าโชว์ข้อมูลตัวอย่าง/ในเครื่องระหว่างรอโหลด (กันกดต่ออายุรายการปลอม)\n// เปิดจาก Apps Script Web App (HtmlService) → เรียก server ตรงผ่าน google.script.run ไม่ต้องใช้ URL/API Key\n// ถ้าถูกฝังในแท็บ Expire ของ Calenda (iframe srcdoc) จะใช้ google.script.run ของหน้าแม่\nconst EMBED = (() => { try { return window.parent !== window && !!window.parent.document; } catch { return false; } })();\nconst RUN_HOST = (() => {\n  if (window.google && google.script && google.script.run) return window;\n  try { const p = window.parent; if (p !== window && p.google && p.google.script && p.google.script.run) return p; } catch {}\n  return null;\n})();\nconst GAS = !!RUN_HOST;\nlet items = (GAS || (c => c.url && c.key)(store.get('renew.api', {}))) ? [] : localItems();\nlet line = {...LINE_DEFAULT, ...store.get('renew.line2', {})};\nlet recipients = [];\nlet users = [], me = null;   // ผู้ใช้ทุกคน (ไว้เลือกแท็ก) + ตัวเรา\nfunction parentAuth(){ try { return window.parent.AUTH || ''; } catch { return ''; } }\nfunction parentViewAll(){ try { return !!window.parent.viewAllExp; } catch { return false; } }\n// แอดมินเลือกดูเฉพาะบางคน (แถบ 👁 ในหน้าแม่)\nfunction parentOwnerOk(i){ try { return window.parent.ownerOk('exp', i.owner); } catch { return true; } }\nfunction parentLoaded(err){ try { window.parent.onExpireLoaded(err); } catch {} }\nlet allItems = null;\nfunction newId(){ return 'i' + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }\n\n// ---------- API (Google Apps Script) ----------\nconst api = {\n  cfg: store.get('renew.api', {url:'', key:''}),\n  get on(){ return GAS || !!(this.cfg.url && this.cfg.key); },\n  async call(action, data = {}){\n    setSync('busy');\n    try{\n      const j = GAS\n        ? await new Promise((res, rej) => RUN_HOST.google.script.run.withSuccessHandler(res).withFailureHandler(rej).dashboardApi(action, Object.assign({viewAll: parentViewAll()}, data), parentAuth()))\n        // text/plain = simple request ไม่มี CORS preflight (Apps Script ไม่รองรับ OPTIONS)\n        : await (await fetch(this.cfg.url, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},\n            body: JSON.stringify({action, apiKey:this.cfg.key, ...data})})).json();\n      if(!j.ok) throw new Error(j.error || 'error');\n      setSync('on'); return j;\n    }catch(err){ setSync('err', err.message); throw err; }\n  }\n};\nlet syncState = 'on';\nfunction setSync(state, msg){\n  syncState = state;\n  const b = $('#syncBadge'); if(!b) return;\n  b.className = 'sync ' + (api.on ? state : '');\n  b.lastElementChild.textContent = !api.on ? 'โหมดทดลอง (เก็บในเครื่อง)'\n    : state === 'busy' ? 'กำลังซิงก์…' : state === 'err' ? 'ซิงก์ไม่สำเร็จ' : 'Google Sheets';\n  b.title = msg || '';\n}\nlet loading = false, hasToken = false; // hasToken = ตั้ง LINE_TOKEN ใน Apps Script แล้ว\nasync function loadRemote(){\n  if(!api.on) return;\n  try{\n    const j = await api.call('list');\n    allItems = j.items; items = j.items.filter(parentOwnerOk); line = {...LINE_DEFAULT, ...j.settings}; recipients = j.recipients || []; hasToken = !!j.hasToken;\n    users = j.users || []; me = j.me || null;\n    // เตือนครั้งเดียวพอ ไม่ให้ทับ toast อื่นทุกครั้งที่โหลดใหม่\n    if(j.invalid && j.invalid.length && !loadRemote.warned && (loadRemote.warned = true)) toast(`⚠️ ข้ามแถวในชีต Items ที่วันที่ไม่ถูกต้อง ${j.invalid.length} แถว: ${j.invalid.slice(0,3).join(', ')}`);\n  }catch(err){ parentLoaded(err.message || String(err)); throw err; }\n  finally{\n    loading = false; render();\n  }\n  parentLoaded();\n}\n/** เขียนข้อมูล: อัปเดตหน้าจอทันที แล้วค่อยส่งขึ้น Sheet ถ้าพลาดจะโหลดข้อมูลจริงกลับมา */\nasync function persist(action, data){\n  save(); render();\n  if(!api.on) return;\n  try{\n    const j = await api.call(action, data);\n    // ได้ข้อมูลจริงกลับมา (เจ้าของ / แท็ก / สิทธิ์) → อัปเดตรายการในหน้า\n    if(j && j.item){ const it = items.find(i => i.id === j.item.id); if(it){ Object.assign(it, j.item); render(); } }\n  }\n  catch(err){ toast('บันทึกขึ้น Sheet ไม่สำเร็จ: ' + err.message); loadRemote().catch(()=>{}); }\n}\nlet ui = {view:'dash', cat:'all', status:'all', q:'', calMonth:(()=>{const d=today(); d.setDate(1); return d;})()};\nlet editingId = null;\n\nfunction save(){ if(!api.on) store.set('renew.items', items); }\n\nfunction stKey(d){ return d \u003c 0 ? 'over' : d \u003c= 7 ? 'urgent' : d \u003c= 30 ? 'soon' : 'ok'; }\nfunction dayLabel(d){ return d \u003c 0 ? `เลย ${-d} วัน` : d === 0 ? 'วันนี้!' : `อีก ${d} วัน`; }\nfunction cycleText(c){ return !c ? 'ครั้งเดียว' : c % 12 === 0 ? `ทุก ${c/12} ปี` : `ทุก ${c} เดือน`; }\nfunction counts(){\n  const c = {over:0, urgent:0, soon:0, ok:0};\n  items.forEach(i => c[stKey(daysLeft(i.due))]++);\n  return c;\n}\n\n// ---------- dashboard ----------\nfunction heroCard(){\n  const next = [...items].sort((a,b)=>a.due.localeCompare(b.due))[0];\n  if(!next) return `\u003cdiv class=\"card hero st-ok\">\u003cdiv class=\"eyebrow\">ครบกำหนดถัดไป\u003c/div>\u003cdiv class=\"empty\" style=\"margin-top:14px\">ยังไม่มีรายการ\u003c/div>\u003c/div>`;\n  const d = daysLeft(next.due), k = stKey(d), cat = CATS[next.cat];\n  const span = next.cycle ? next.cycle*30.4 : 365;\n  const frac = d \u003c 0 ? 1 : Math.max(.03, Math.min(1, 1 - d/span));\n  const R = 64, C = 2*Math.PI*R;\n  return `\u003cdiv class=\"card hero ${STATUS[k].cls}\">\n    \u003cdiv class=\"eyebrow\">${d \u003c 0 ? '⛔ เลยกำหนดแล้ว' : 'ครบกำหนดถัดไป'}\u003c/div>\n    \u003cdiv class=\"hero-body\">\n      \u003cdiv class=\"ring\">\n        \u003csvg width=\"150\" height=\"150\" viewBox=\"0 0 150 150\">\n          \u003ccircle cx=\"75\" cy=\"75\" r=\"${R}\" fill=\"none\" stroke=\"var(--surface-2)\" stroke-width=\"12\"/>\n          \u003ccircle cx=\"75\" cy=\"75\" r=\"${R}\" fill=\"none\" stroke=\"var(--st)\" stroke-width=\"12\" stroke-linecap=\"round\"\n            stroke-dasharray=\"${C*frac} ${C}\" style=\"filter:drop-shadow(0 0 5px var(--st))\"/>\n        \u003c/svg>\n        \u003cdiv class=\"c\">\u003cdiv>\u003cb class=\"num\">${Math.abs(d)}\u003c/b>\u003cspan>${d \u003c 0 ? 'วันที่เลยมา' : d === 0 ? 'วันนี้' : 'วันที่เหลือ'}\u003c/span>\u003c/div>\u003c/div>\n      \u003c/div>\n      \u003cdiv style=\"min-width:0\">\n        \u003ch2>${cat.icon} ${esc(next.title)}\u003c/h2>\n        \u003cdiv class=\"meta\">\n          ${next.asset ? `\u003cspan>📍 ${esc(next.asset)}\u003c/span>` : ''}\n          \u003cspan>🗓 ${thDate(next.due,{weekday:'long',day:'numeric',month:'long',year:'numeric'})}\u003c/span>\n          \u003cspan>🔁 ${cycleText(next.cycle)}\u003c/span>\n          ${next.note ? `\u003cspan>📝 ${esc(next.note)}\u003c/span>` : ''}\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"hero-foot\">\n      ${next.cycle ? `\u003cbutton class=\"btn primary sm\" data-renew=\"${esc(next.id)}\">✓ ต่ออายุแล้ว\u003c/button>` : ''}\n      \u003cbutton class=\"btn sm\" data-edit=\"${esc(next.id)}\">แก้ไข\u003c/button>\n    \u003c/div>\n  \u003c/div>`;\n}\n\nfunction kpiCards(){\n  const c = counts(), total = items.length || 1;\n  const defs = [\n    ['over',   'เลยกำหนด',     '\u003cpath d=\"M12 8v5M12 16h.01\"/>\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>'],\n    ['urgent', 'ภายใน 7 วัน',  '\u003cpath d=\"M12 7v5l3 2\"/>\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>'],\n    ['soon',   'ภายใน 30 วัน', '\u003crect x=\"3\" y=\"5\" width=\"18\" height=\"16\" rx=\"3\"/>\u003cpath d=\"M8 3v4M16 3v4M3 10h18\"/>'],\n    ['ok',     'ปกติ',         '\u003cpath d=\"m5 12 5 5 9-10\"/>'],\n  ];\n  return defs.map(([k,l,path]) => `\n    \u003cbutton class=\"card kpi ${STATUS[k].cls}\" data-goto-status=\"${k}\">\n      \u003cdiv class=\"top\">\n        \u003cdiv class=\"ic\">\u003csvg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\">${path}\u003c/svg>\u003c/div>\n        \u003cspan class=\"sub\">${Math.round(c[k]/total*100)}%\u003c/span>\n      \u003c/div>\n      \u003cdiv>\u003cdiv class=\"v num\">${c[k]}\u003c/div>\u003cdiv class=\"l\">${l}\u003c/div>\u003c/div>\n      \u003cdiv class=\"spark\">\u003ci style=\"width:${c[k]/total*100}%\">\u003c/i>\u003c/div>\n    \u003c/button>`).join('');\n}\n\n// รวมทุกรอบที่ตกอยู่ในช่วง [start, end) รวมรอบถัดๆ ไปของรายการที่ต่ออายุซ้ำ\n// ค่าเริ่มต้น: ตั้งแต่ต้นเดือนนี้ ไป 12 เดือน\nfunction occurrences(start, end){\n  const t = today();\n  start ||= iso(new Date(t.getFullYear(), t.getMonth(), 1));\n  end ||= iso(new Date(t.getFullYear(), t.getMonth()+12, 1));\n  const out = [];\n  items.forEach(i => {\n    // คำนวณจากวันตั้งต้นทุกครั้ง (due + k×cycle) กันวันที่เลื่อน เช่น 31 → 28 → 28\n    for(let k = 0, d = i.due; d \u003c end; d = addMonths(i.due, ++k * i.cycle)){\n      if(d >= start) out.push({...i, due:d});\n      if(!i.cycle) break;\n    }\n  });\n  return out;\n}\n\nfunction monthChart(){\n  const t = today(), occ = occurrences();\n  const months = Array.from({length:12}, (_,k) => {\n    const d = new Date(t.getFullYear(), t.getMonth()+k, 1);\n    const key = iso(d).slice(0,7);\n    return {d, key, list: occ.filter(o => o.due.startsWith(key)).sort((a,b)=>a.due.localeCompare(b.due))};\n  });\n  const max = Math.max(4, ...months.map(m=>m.list.length));\n  const W = 640, H = 230, L = 28, B = 26, T = 14, plotH = H - B - T, band = (W - L)/12, bw = Math.min(30, band*.55);\n  const y = v => T + plotH - v/max*plotH;\n  const step = max \u003c= 5 ? 1 : Math.ceil(max/4);\n  let grid = '';\n  for(let v=0; v\u003c=max; v+=step) grid += `\u003cline class=\"grid-l\" x1=\"${L}\" x2=\"${W}\" y1=\"${y(v)}\" y2=\"${y(v)}\" ${v?'stroke-dasharray=\"2 4\"':''}/>\u003ctext class=\"ax\" x=\"${L-8}\" y=\"${y(v)+4}\" text-anchor=\"end\">${v}\u003c/text>`;\n  const cols = months.map((m,k) => {\n    const n = m.list.length, x = L + band*k + (band-bw)/2, top = y(n), h = y(0) - top, r = Math.min(4, h);\n    const path = n ? `M${x},${y(0)} V${top+r} Q${x},${top} ${x+r},${top} H${x+bw-r} Q${x+bw},${top} ${x+bw},${top+r} V${y(0)} Z` : '';\n    const tip = `\u003cb>${m.d.toLocaleDateString('th-TH',{month:'long',year:'numeric'})} · ${n} รายการ\u003c/b>` +\n      (n ? m.list.map(o => `${CATS[o.cat].icon} ${esc(o.title)} — ${thDate(o.due,{day:'numeric',month:'short'})}`).join('\u003cbr>') : 'ไม่มีรายการ');\n    return `\u003cg class=\"col\" data-tip=\"${esc(tip)}\">\n      \u003crect class=\"hit\" x=\"${L+band*k}\" y=\"${T}\" width=\"${band}\" height=\"${plotH+B}\"/>\n      ${n ? `\u003cpath class=\"bar ${k===0?'now':''}\" d=\"${path}\"/>\u003ctext class=\"val\" x=\"${x+bw/2}\" y=\"${top-6}\" text-anchor=\"middle\">${n}\u003c/text>` : ''}\n      \u003ctext class=\"ax\" x=\"${x+bw/2}\" y=\"${H-6}\" text-anchor=\"middle\">${m.d.toLocaleDateString('th-TH',{month:'short'})}\u003c/text>\n    \u003c/g>`;\n  }).join('');\n  const total = occ.length;\n  return `\u003cdiv class=\"card chart\">\n    \u003cdiv class=\"card-head\">\n      \u003cdiv>\u003ch3>ภาระต่ออายุ 12 เดือนข้างหน้า\u003c/h3>\u003cdiv class=\"sub\">นับรวมทุกรอบของรายการที่ต่ออายุซ้ำ · รวม \u003cb class=\"num\">${total}\u003c/b> ครั้ง\u003c/div>\u003c/div>\n      \u003cdiv class=\"legend\">\u003cspan>\u003ci class=\"sw\" style=\"background:var(--accent)\">\u003c/i>เดือนนี้\u003c/span>\u003cspan>\u003ci class=\"sw\" style=\"background:var(--chart)\">\u003c/i>เดือนถัดไป\u003c/span>\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"scroll\">\u003csvg viewBox=\"0 0 ${W} ${H}\" role=\"img\" aria-label=\"จำนวนรายการครบกำหนดรายเดือน\">${grid}${cols}\u003c/svg>\u003c/div>\n  \u003c/div>`;\n}\n\nfunction donutCard(){\n  const c = counts(), total = items.length;\n  const R = 58, C = 2*Math.PI*R, GAP = total > 1 ? 3 : 0;\n  let off = 0, segs = '';\n  Object.keys(STATUS).forEach(k => {\n    if(!c[k]) return;\n    const len = c[k]/total*C;\n    segs += `\u003ccircle class=\"seg\" cx=\"75\" cy=\"75\" r=\"${R}\" fill=\"none\" stroke=\"${STATUS[k].color}\" stroke-width=\"20\"\n      stroke-dasharray=\"${Math.max(0,len-GAP)} ${C}\" stroke-dashoffset=\"${-off}\"\n      data-tip=\"${esc(`\u003cb>${STATUS[k].icon} ${STATUS[k].name}\u003c/b>${c[k]} รายการ (${Math.round(c[k]/total*100)}%)`)}\" data-goto-status=\"${k}\"/>`;\n    off += len;\n  });\n  return `\u003cdiv class=\"card\">\n    \u003cdiv class=\"card-head\">\u003cdiv>\u003ch3>สถานะทั้งหมด\u003c/h3>\u003cdiv class=\"sub\">คลิกเพื่อดูรายการ\u003c/div>\u003c/div>\u003c/div>\n    \u003cdiv class=\"donut-wrap\">\n      \u003cdiv class=\"donut\">\n        \u003csvg width=\"150\" height=\"150\" viewBox=\"0 0 150 150\" style=\"transform:rotate(-90deg)\">\n          \u003ccircle cx=\"75\" cy=\"75\" r=\"${R}\" fill=\"none\" stroke=\"var(--surface-2)\" stroke-width=\"20\"/>${segs}\n        \u003c/svg>\n        \u003cdiv class=\"c\">\u003cdiv>\u003cb class=\"num\">${total}\u003c/b>\u003cspan>รายการ\u003c/span>\u003c/div>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"dl\">\n        ${Object.entries(STATUS).map(([k,s]) => `\u003cdiv class=\"r\" data-goto-status=\"${k}\" style=\"cursor:pointer\">\n          \u003ci class=\"sw\" style=\"background:${s.color}\">\u003c/i>\u003cspan>${s.icon} ${s.name}\u003c/span>\u003cb class=\"num\">${c[k]}\u003c/b>\u003c/div>`).join('')}\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>`;\n}\n\nfunction timelineCard(){\n  const up = [...items].sort((a,b)=>a.due.localeCompare(b.due)).slice(0,6);\n  return `\u003cdiv class=\"card\">\n    \u003cdiv class=\"card-head\">\u003cdiv>\u003ch3>ไทม์ไลน์ใกล้ครบกำหนด\u003c/h3>\u003cdiv class=\"sub\">6 รายการแรก\u003c/div>\u003c/div>\n      \u003cbutton class=\"btn sm ghost\" data-view=\"list\">ดูทั้งหมด →\u003c/button>\u003c/div>\n    ${up.length ? `\u003cdiv class=\"tl\">${up.map(i => {\n      const d = daysLeft(i.due), k = stKey(d);\n      return `\u003cdiv class=\"tl-row ${STATUS[k].cls}\" data-edit=\"${esc(i.id)}\">\n        \u003cspan class=\"pin\">\u003c/span>\n        \u003cdiv style=\"min-width:0\">\u003cdiv class=\"t\">${CATS[i.cat].icon} ${esc(i.title)}\u003c/div>\n          \u003cdiv class=\"s\">${thDate(i.due)}${i.asset ? ' · ' + esc(i.asset) : ''}\u003c/div>\u003c/div>\n        \u003cspan class=\"pill\">${dayLabel(d)}\u003c/span>\n      \u003c/div>`; }).join('')}\u003c/div>` : '\u003cdiv class=\"empty\">ยังไม่มีรายการ\u003c/div>'}\n  \u003c/div>`;\n}\n\nfunction categoryCard(){\n  const rows = Object.entries(CATS).map(([k,v]) => ({k, v, n: items.filter(i=>i.cat===k).length}));\n  const max = Math.max(1, ...rows.map(r=>r.n));\n  return `\u003cdiv class=\"card\">\n    \u003cdiv class=\"card-head\">\u003cdiv>\u003ch3>แยกตามประเภท\u003c/h3>\u003cdiv class=\"sub\">จำนวนรายการที่ติดตาม\u003c/div>\u003c/div>\u003c/div>\n    \u003cdiv class=\"hbar\">${rows.map(r => `\u003cdiv class=\"r\" data-goto-cat=\"${r.k}\">\n      \u003cspan>${r.v.icon} ${r.v.name}\u003c/span>\u003cdiv class=\"track\">\u003ci style=\"width:${r.n/max*100}%\">\u003c/i>\u003c/div>\u003cb class=\"num\">${r.n}\u003c/b>\u003c/div>`).join('')}\u003c/div>\n  \u003c/div>`;\n}\n\nfunction lineCard(){\n  const n = notifyToday().length;\n  const sub = !api.on ? 'ยังไม่ได้เชื่อมต่อ · โหมดทดลอง'\n    : !hasToken ? 'ยังไม่ได้ตั้งค่า LINE · ตัวอย่างข้อความที่จะได้รับ'\n    : line.enabled ? `ส่งทุกวัน ${hourText(line.hour)} · วันนี้ ${n} รายการ · ผู้รับ ${line.recipients.length}`\n    : 'ปิดการแจ้งเตือนอยู่';\n  return `\u003cdiv class=\"card linecard\">\n    \u003cdiv class=\"card-head\">\n      \u003cdiv>\u003ch3>แจ้งเตือน LINE\u003c/h3>\u003cdiv class=\"sub\">${sub}\u003c/div>\u003c/div>\n      \u003cbutton class=\"btn sm\" data-open-line>ตั้งค่า\u003c/button>\n    \u003c/div>\n    \u003cdiv class=\"chat\">\u003cdiv class=\"line-sender\">\u003cdiv class=\"av\">📅\u003c/div>Renewal Bot\u003c/div>${flexPreview()}\u003c/div>\n  \u003c/div>`;\n}\n\nfunction renderDash(){\n  $('#main').innerHTML = `\n    \u003cdiv class=\"grid g-top\">${heroCard()}${kpiCards()}\u003c/div>\n    \u003cdiv class=\"grid g-mid\">${monthChart()}${donutCard()}\u003c/div>\n    \u003cdiv class=\"grid g-bot\">${timelineCard()}${categoryCard()}${lineCard()}\u003c/div>`;\n}\n\n// ---------- list ----------\nfunction toolbar(){\n  const all = [['all','ทั้งหมด','']].concat(Object.entries(CATS).map(([k,v]) => [k,v.name,v.icon]));\n  const stAll = [['all','ทุกสถานะ']].concat(Object.entries(STATUS).map(([k,v]) => [k, v.icon+' '+v.name]));\n  return `\u003cdiv class=\"toolbar\">\n      \u003cdiv class=\"search\">\n        \u003csvg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\">\u003ccircle cx=\"11\" cy=\"11\" r=\"7\"/>\u003cpath d=\"m20 20-3.5-3.5\"/>\u003c/svg>\n        \u003cinput id=\"q\" placeholder=\"ค้นหา ชื่อรายการ / ทะเบียนรถ / อุปกรณ์\" value=\"${esc(ui.q)}\">\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"chips\">${stAll.map(([k,n]) => `\u003cbutton class=\"chip ${ui.status===k?'active':''}\" data-status=\"${k}\">${n}\u003c/button>`).join('')}\u003c/div>\n    \u003cdiv class=\"chips\">${all.map(([k,n,ic]) => {\n      const cnt = k==='all' ? items.length : items.filter(i=>i.cat===k).length;\n      return `\u003cbutton class=\"chip ${ui.cat===k?'active':''}\" data-cat=\"${k}\">${ic} ${n} · ${cnt}\u003c/button>`; }).join('')}\u003c/div>`;\n}\n\nfunction filtered(){\n  const q = ui.q.trim().toLowerCase();\n  return items\n    .filter(i => ui.cat==='all' || i.cat===ui.cat)\n    .filter(i => ui.status==='all' || stKey(daysLeft(i.due))===ui.status)\n    .filter(i => !q || (i.title+' '+(i.asset||'')+' '+(i.note||'')).toLowerCase().includes(q))\n    .sort((a,b) => a.due.localeCompare(b.due));\n}\n\nfunction listHTML(){\n  const list = filtered();\n  if(!list.length) return `\u003cdiv class=\"empty\">ไม่พบรายการ\u003cbr>\u003cbr>\u003cbutton class=\"btn primary\" data-add>＋ เพิ่มรายการ\u003c/button>\u003c/div>`;\n  return `\u003cdiv class=\"list\">${list.map(i => {\n    const d = daysLeft(i.due), k = stKey(d), cat = CATS[i.cat] || CATS.other;\n    const span = i.cycle ? i.cycle*30.4 : 365;\n    const pct = Math.max(0, Math.min(100, 100 - (d/span)*100));\n    return `\u003carticle class=\"item ${STATUS[k].cls}\">\n      \u003cdiv class=\"ico\">${cat.icon}\u003c/div>\n      \u003cdiv style=\"min-width:0\">\n        \u003cdiv class=\"title\">${esc(i.title)} \u003cspan class=\"tag\">${cat.name}\u003c/span>${tagBadges(i)}\u003c/div>\n        \u003cdiv class=\"meta\">\n          ${i.asset ? `\u003cspan>📍 ${esc(i.asset)}\u003c/span>` : ''}\n          \u003cspan>🗓 ${thDate(i.due)}\u003c/span>\n          \u003cspan>🔁 ${cycleText(i.cycle)}\u003c/span>\n          \u003cspan>🔔 ${notifyDaysFor(i.cycle).map(n=>n===0?'วันครบ':n+' วัน').join(', ')} + เลยกำหนด\u003c/span>\n        \u003c/div>\n        ${i.note ? `\u003cdiv class=\"meta\" style=\"margin-top:4px\">📝 ${esc(i.note)}\u003c/div>` : ''}\n        \u003cdiv class=\"bar\">\u003ci style=\"width:${pct}%\">\u003c/i>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"right\">\n        \u003cspan class=\"pill\">${dayLabel(d)}\u003c/span>\n        \u003cdiv class=\"row-actions\">\n          ${i.cycle ? `\u003cbutton class=\"btn sm\" data-renew=\"${esc(i.id)}\" title=\"ต่ออายุแล้ว เลื่อนไปรอบถัดไป\">✓ ต่ออายุแล้ว\u003c/button>` : ''}\n          \u003cbutton class=\"btn sm ghost\" data-edit=\"${esc(i.id)}\">${i._edit === false ? 'ดู' : 'แก้ไข'}\u003c/button>\n        \u003c/div>\n      \u003c/div>\n    \u003c/article>`;\n  }).join('')}\u003c/div>`;\n}\n\nfunction renderList(){\n  $('#main').innerHTML = toolbar() + `\u003cdiv id=\"listBox\">${listHTML()}\u003c/div>`;\n  $('#q').addEventListener('input', e => { ui.q = e.target.value; $('#listBox').innerHTML = listHTML(); });\n}\n\n// ---------- calendar ----------\nfunction renderCal(){\n  const m = ui.calMonth, y = m.getFullYear(), mo = m.getMonth();\n  const first = 1 - new Date(y, mo, 1).getDay();\n  // ช่วงของตาราง 6 สัปดาห์ที่แสดงอยู่ → ดูเดือนไหนก็เห็นรอบที่คาดการณ์ไว้\n  const byDate = {};\n  occurrences(iso(new Date(y, mo, first)), iso(new Date(y, mo, first + 42)))\n    .forEach(i => (byDate[i.due] ||= []).push(i));\n  const t = iso(today());\n  let cells = '';\n  for(let k=0;k\u003c42;k++){\n    const d = new Date(y, mo, first + k);\n    const s = iso(d), evs = byDate[s] || [];\n    cells += `\u003cdiv class=\"cal-day ${d.getMonth()!==mo?'out':''} ${s===t?'today':''}\">\n      \u003cdiv class=\"d\">${d.getDate()}\u003c/div>\n      ${evs.map(i => `\u003cbutton class=\"ev ${STATUS[stKey(daysLeft(i.due))].cls}\" data-edit=\"${esc(i.id)}\" title=\"${esc(i.title)}\">${CATS[i.cat].icon} ${esc(i.title)}\u003c/button>`).join('')}\n    \u003c/div>`;\n  }\n  const dows = ['อา','จ','อ','พ','พฤ','ศ','ส'].map(x=>`\u003cdiv class=\"cal-dow\">${x}\u003c/div>`).join('');\n  $('#main').innerHTML = `\u003cdiv class=\"card\">\n    \u003cdiv class=\"cal-head\">\n      \u003cbutton class=\"btn sm\" data-cal=\"-1\">‹\u003c/button>\n      \u003ch3>${m.toLocaleDateString('th-TH',{month:'long',year:'numeric'})}\u003c/h3>\n      \u003cbutton class=\"btn sm\" data-cal=\"1\">›\u003c/button>\n    \u003c/div>\n    \u003cdiv class=\"cal-grid\">${dows}${cells}\u003c/div>\n  \u003c/div>`;\n}\n\n// ---------- shell ----------\nconst TITLES = {dash:'แดชบอร์ด', list:'รายการทั้งหมด', cal:'ปฏิทิน'};\nfunction render(){\n  $('#todayText').textContent = 'วันนี้ ' + today().toLocaleDateString('th-TH',{weekday:'long',day:'numeric',month:'long',year:'numeric'});\n  $('#pageTitle').textContent = TITLES[ui.view];\n  document.querySelectorAll('.nav[data-view]').forEach(b => b.classList.toggle('active', b.dataset.view===ui.view));\n  const c = counts(), hot = c.over + c.urgent;\n  $('#navCnt').textContent = hot || ''; $('#navCnt').style.display = hot ? '' : 'none';\n  const live = api.on && hasToken && line.enabled;\n  $('#lineMini').innerHTML = `\u003cdiv class=\"row\">\u003cspan class=\"pulse ${live?'':'off'}\">\u003c/span>\u003cb>LINE ${!api.on||!hasToken?'ยังไม่ได้ตั้งค่า':line.enabled?'เปิดอยู่':'ปิดอยู่'}\u003c/b>\u003c/div>\n    \u003cdiv style=\"margin-top:4px\">${live ? `ส่งทุกวัน ${hourText(line.hour)}` : 'ยังไม่ส่งแจ้งเตือน'}\u003c/div>`;\n  setSync(syncState);\n  if(loading){ $('#main').innerHTML = '\u003cdiv class=\"empty\">⏳ กำลังโหลดข้อมูลจาก Google Sheets…\u003c/div>'; return; }\n  ({dash:renderDash, list:renderList, cal:renderCal})[ui.view]();\n  if(EMBED) try { window.parent.onExpireChanged && window.parent.onExpireChanged(); } catch {}\n}\n\n// ชื่อเจ้าของ (ถ้าไม่ใช่เรา) + จุดสีผู้รับผิดชอบ\nfunction tagBadges(i){\n  const ids = String(i.tags || '').split(',').filter(Boolean);\n  const dots = ids.map(id => users.find(u => u.id === id)).filter(Boolean)\n    .map(u => `\u003cspan title=\"${esc(u.name)}\" style=\"display:inline-block;width:8px;height:8px;border-radius:50%;background:${esc(u.color)};margin-left:2px\">\u003c/span>`).join('');\n  const owner = me && i.owner && i.owner !== me.id ? `\u003cspan class=\"tag\">👤 ${esc(i._ownerName || '')}\u003c/span>` : '';\n  return owner + (ids.length > 1 || owner ? `\u003cspan style=\"margin-left:4px\">${dots}\u003c/span>` : '');\n}\n\n// ให้ Calenda (หน้าแม่) อ่านข้อมูลไปแสดงในปฏิทิน และเปิดฟอร์มแก้ไขได้\nwindow.expireApi = {\n  occurrences, stKey, daysLeft, CATS, openForm,\n  reload(){ loading = true; render(); return loadRemote().catch(err => toast(err.message)); },\n  refilter(){ if(allItems){ items = allItems.filter(parentOwnerOk); render(); } },\n  setTheme(t){ document.documentElement.dataset.theme = t; },\n  get loading(){ return loading; },\n  hotCount(){ const c = counts(); return c.over + c.urgent; },\n};\n\n// ---------- form ----------\nfunction openForm(id=null){\n  const found = id && items.find(i=>i.id===id);\n  if(id && !found){ toast('ไม่พบรายการนี้แล้ว (อาจถูกลบไปแล้ว)'); return render(); }\n  editingId = id;\n  const it = found || {cat:'prb', title:'', asset:'', due:addDays(30), cycle:12, note:''};\n  $('#formTitle').textContent = id ? 'แก้ไขรายการ' : 'เพิ่มรายการ';\n  $('#delBtn').style.display = id ? '' : 'none';\n  $('#catPick').innerHTML = Object.entries(CATS).map(([k,v]) =>\n    `\u003clabel>\u003cinput type=\"radio\" name=\"cat\" value=\"${k}\" ${it.cat===k?'checked':''}>\u003cspan>${v.icon} ${v.name}\u003c/span>\u003c/label>`).join('');\n  $('#fTitle').value = it.title; $('#fAsset').value = it.asset || '';\n  $('#fDue').value = isoToBE(it.due); $('#fCycle').value = String(notifyDaysFor(it.cycle) && NOTIFY_EXTRA[it.cycle] ? it.cycle : 12); $('#fNote').value = it.note || '';\n  $('#fNotifyText').textContent = '🔔 ' + notifyLabel(+$('#fCycle').value);\n  const tagIds = String(it.tags || (me ? me.id : '')).split(',').filter(Boolean);\n  $('#fTags').innerHTML = users.length ? users.map(u =>\n    `\u003clabel>\u003cinput type=\"checkbox\" value=\"${esc(u.id)}\" ${tagIds.includes(u.id)?'checked':''}>\u003cspan style=\"display:inline-block;width:8px;height:8px;border-radius:50%;background:${esc(u.color)};margin-right:4px\">\u003c/span>${esc(u.name)}${me && u.id===me.id?' (คุณ)':''}\u003c/label>`).join('')\n    : '\u003cspan class=\"hint\">โหมดทดลอง: ไม่มีรายชื่อผู้ใช้\u003c/span>';\n  const ro = it._edit === false;\n  document.querySelectorAll('#itemForm input, #itemForm select, #itemForm textarea').forEach(el => { el.disabled = ro; });\n  document.querySelector('#itemForm button[type=submit]').style.display = ro ? 'none' : '';\n  $('#delBtn').style.display = id && !ro ? '' : 'none';\n  $('#fOwnerNote').textContent = it._ownerName && me && it.owner !== me.id\n    ? '👤 เจ้าของ: ' + it._ownerName + (ro ? ' · คุณถูกแท็ก — ดูได้อย่างเดียว (กด ✓ ต่ออายุแล้ว ที่รายการได้)' : ' · (แอดมินแก้ไขได้)') : '';\n  $('#itemModal').classList.add('open');\n  setTimeout(()=>$('#fTitle').focus(), 50);\n}\n\n// วันที่ในฟอร์ม: วว/ดด/ปปปป (พ.ศ.) ↔ YYYY-MM-DD (ค.ศ.) ที่เก็บในชีต\nfunction isoToBE(iso){ if(!iso) return ''; const [y,m,d] = iso.split('-'); return `${d}/${m}/${+y+543}`; }\nfunction beToIso(s){\n  const x = String(s).trim().match(/^(\\d{1,2})\\/(\\d{1,2})\\/(\\d{4})$/); if(!x) return '';\n  let [, d, m, y] = x.map(Number); if(y > 2400) y -= 543;\n  const dt = new Date(y, m-1, d);\n  return dt.getFullYear()===y && dt.getMonth()===m-1 && dt.getDate()===d ? iso(dt) : '';\n}\n$('#fCycle').addEventListener('change', () => { $('#fNotifyText').textContent = '🔔 ' + notifyLabel(+$('#fCycle').value); });\n// ใส่ / ให้อัตโนมัติระหว่างพิมพ์ตัวเลข\n$('#fDue').addEventListener('input', e => {\n  const t = e.target; if(e.inputType && e.inputType.startsWith('delete')) return;\n  const dg = t.value.replace(/\\D/g,'').slice(0,8);\n  t.value = dg.length > 4 ? `${dg.slice(0,2)}/${dg.slice(2,4)}/${dg.slice(4)}` : dg.length > 2 ? `${dg.slice(0,2)}/${dg.slice(2)}` : dg;\n  t.setCustomValidity('');\n});\n\n$('#itemForm').addEventListener('submit', e => {\n  e.preventDefault();\n  if(!beToIso($('#fDue').value)){ const f = $('#fDue'); f.setCustomValidity('วันที่ไม่ถูกต้อง ใช้รูปแบบ วว/ดด/ปปปป (พ.ศ.) เช่น 04/10/2569'); f.reportValidity(); return; }\n  const data = {\n    cat: document.querySelector('input[name=cat]:checked').value,\n    title: $('#fTitle').value.trim(),\n    asset: $('#fAsset').value.trim(),\n    due: beToIso($('#fDue').value),\n    cycle: +$('#fCycle').value,\n    note: $('#fNote').value.trim(),\n  };\n  data.notify = notifyDaysFor(data.cycle);\n  data.tags = [...document.querySelectorAll('#fTags input:checked')].map(x => x.value).join(',');\n  if(!data.tags && me) data.tags = me.id;   // ไม่ติ๊กใคร = เห็นคนเดียว\n  let item;\n  const existing = editingId && items.find(i=>i.id===editingId);\n  if(existing){ item = Object.assign(existing, data); }\n  else { item = {id: editingId || newId(), ...data}; items.push(item); }\n  closeAll(); toast('บันทึกแล้ว');\n  persist('save', {item});\n});\n\n$('#delBtn').onclick = () => {\n  if(!confirm('ลบรายการนี้?')) return;\n  const id = editingId;\n  items = items.filter(i=>i.id!==id); closeAll(); toast('ลบแล้ว');\n  persist('delete', {id});\n};\n\n/** วันครบกำหนดรอบถัดไป (ข้ามรอบที่ผ่านไปแล้ว) — ตรรกะเดียวกับ nextDue_() ใน Code.gs */\nfunction nextDue(it){\n  let k = 1, next = addMonths(it.due, it.cycle);\n  while(daysLeft(next) \u003c 0) next = addMonths(it.due, ++k * it.cycle);\n  return next;\n}\n\nasync function renew(id){\n  const it = items.find(i=>i.id===id);\n  if(!it || !it.cycle) return;\n  const from = it.due, next = nextDue(it);\n  if(!confirm(`ต่ออายุ \"${it.title}\" แล้วใช่ไหม?\\nครบกำหนดครั้งถัดไป: ${thDate(next)}`)) return;\n  it.due = next; save(); render();\n  toast(`ต่ออายุแล้ว · ครบกำหนดครั้งถัดไป ${thDate(next)}`);\n  if(!api.on) return;\n  try{\n    // ให้ server คำนวณเอง + ส่ง from กันต่ออายุซ้ำ (เช่น มีคนกดใน LINE ไปก่อนแล้ว)\n    const j = await api.call('renew', {id, from});\n    Object.assign(it, j.item); render();\n  }catch(err){ toast(err.message); loadRemote().catch(()=>{}); }\n}\n\n// ---------- LINE ----------\n// Trigger ของ Apps Script รันช่วงไหนก็ได้ภายในชั่วโมงที่ตั้ง\nfunction hourText(h){ const p = n => String(n % 24).padStart(2,'0'); return `${p(h)}:00–${p(h+1)}:00 น.`; }\n\n/** ตรรกะเดียวกับ itemsToNotify_() ใน Code.gs: วันนี้ตรงกับวันแจ้งเตือน หรือเลยกำหนดแล้ว */\nfunction notifyToday(s = line){\n  return items.map(i => ({...i, d: daysLeft(i.due)}))\n    .filter(i => i.d \u003c 0 || notifyDaysFor(i.cycle).includes(i.d))\n    .sort((a,b) => a.d - b.d);\n}\n\n/** จำลองหน้าตา Flex Message ที่บอทจะส่ง */\nfunction flexPreview(s = line){\n  const list = notifyToday(s);\n  const head = `\u003cdiv class=\"fx-h\">\u003cb>📅 แจ้งเตือนวันต่ออายุ\u003c/b>\u003cspan>${today().toLocaleDateString('th-TH',{weekday:'long',day:'numeric',month:'short',year:'numeric'})}\u003c/span>\u003c/div>`;\n  if(!list.length) return `\u003cdiv class=\"fx\">${head}\u003cdiv class=\"fx-empty\">${s.skipEmpty ? '— วันนี้ไม่มีรายการ บอทจะไม่ส่งข้อความ —' : '✅ วันนี้ไม่มีรายการที่ต้องแจ้งเตือน'}\u003c/div>\u003c/div>`;\n  const col = {over:'#E5484D', urgent:'#F06B1F', soon:'#C99400', ok:'#1F9D55'};\n  return `\u003cdiv class=\"fx\">${head}${list.slice(0,10).map(i => `\u003cdiv class=\"fx-r\">\n      \u003cspan style=\"font-size:17px\">${CATS[i.cat].icon}\u003c/span>\n      \u003cdiv>\u003cb>${esc(i.title)}\u003c/b>\u003csmall>${thDate(i.due)}${i.asset ? ' · ' + esc(i.asset) : ''}\u003c/small>\u003c/div>\n      \u003cb style=\"color:${col[stKey(i.d)]}\">${dayLabel(i.d)}\u003c/b>\u003c/div>`).join('')}\n    ${list.length > 10 ? `\u003cdiv class=\"fx-empty\" style=\"text-align:center\">และอีก ${list.length-10} รายการ\u003c/div>` : ''}\u003c/div>`;\n}\n\nfunction renderRecipients(){\n  const box = $('#rcptList');\n  if(!api.on){ box.innerHTML = '\u003cdiv class=\"sub\">เชื่อมต่อ Apps Script ก่อน รายชื่อจะดึงมาจากชีต Recipients\u003c/div>'; return; }\n  if(!recipients.length){ box.innerHTML = '\u003cdiv class=\"sub\">ยังไม่มี — แอดบอทเป็นเพื่อนหรือเชิญเข้ากลุ่มก่อน แล้วกด \"เชื่อมต่อ\" อีกครั้ง\u003c/div>'; return; }\n  box.innerHTML = recipients.map(r => `\u003clabel>\n      \u003cinput type=\"checkbox\" value=\"${esc(r.id)}\" ${line.recipients.includes(r.id)?'checked':''}>\n      \u003cspan>${r.type==='group'?'👥':r.type==='room'?'💬':'👤'}\u003c/span>\n      \u003cdiv style=\"min-width:0\">${esc(r.name)}\u003csmall>${esc(r.id)}\u003c/small>\u003c/div>\n    \u003c/label>`).join('');\n}\n\nasync function loadQuota(){\n  const box = $('#quotaBox');\n  if(!api.on){ box.textContent = 'ยังไม่ได้เชื่อมต่อ'; return; }\n  if(!hasToken){ box.textContent = 'ℹ️ ยังไม่ได้ตั้งค่า LINE — ข้อมูลบันทึกลง Google Sheets ได้ตามปกติ ตั้งค่า LINE ทีหลังได้'; return; }\n  box.textContent = 'กำลังโหลดโควตา…';\n  try{\n    const {quota:q} = await api.call('quota');\n    const pct = q.limit ? Math.min(100, q.used / q.limit * 100) : 0;\n    box.innerHTML = `\u003cdiv class=\"quota\">\u003cspan>โควตา Push เดือนนี้\u003c/span>\u003cb class=\"num\">${q.used} / ${q.limit ?? '∞'}\u003c/b>\u003c/div>\n      \u003cdiv class=\"quota-bar\">\u003ci style=\"width:${pct}%;${pct>80?'background:var(--red)':''}\">\u003c/i>\u003c/div>`;\n  }catch(err){ box.textContent = 'ดูโควตาไม่ได้: ' + err.message; }\n}\n\nfunction fillLineForm(){\n  $('#apUrl').value = api.cfg.url; $('#apKey').value = api.cfg.key;\n  $('#lnEnabled').checked = line.enabled;\n  $('#lnHour').innerHTML = Array.from({length:24}, (_,h) => `\u003coption value=\"${h}\">${hourText(h)}\u003c/option>`).join('');\n  $('#lnHour').value = String(line.hour);\n  $('#lnLook').value = String(line.lookahead);\n  $('#lnOverdue').checked = line.overdueDaily; $('#lnSkip').checked = line.skipEmpty;\n  $('#apStatus').textContent = api.on ? '✅ เชื่อมต่อแล้ว — ข้อมูลเก็บใน Google Sheets' : 'ยังไม่ได้เชื่อมต่อ — ข้อมูลเก็บในเบราว์เซอร์นี้เท่านั้น';\n  $('#apBox').style.display = GAS ? 'none' : 'grid';\n  $('#gasNote').style.display = GAS ? '' : 'none';\n  $('#apImport').style.display = api.on ? '' : 'none';\n  $('#apDisconnect').style.display = api.on ? '' : 'none';\n  $('#linePreview').innerHTML = flexPreview();\n  renderRecipients();\n}\nfunction openLine(){\n  // ฝังใน Calenda → ตั้งค่า LINE อยู่ที่แท็บ 💬 LINE ของหน้าแม่\n  if(EMBED) try { if(window.parent.switchApp){ window.parent.switchApp('line'); return; } } catch {}\n  fillLineForm();\n  $('#lineModal').classList.add('open');\n  loadQuota();\n}\n\n$('#apConnect').onclick = async () => {\n  const url = $('#apUrl').value.trim(), key = $('#apKey').value.trim();\n  // รองรับทั้งบัญชีทั่วไป (/macros/s/) และ Google Workspace (/a/macros/\u003cdomain>/s/)\n  if(!/^https:\\/\\/script\\.google\\.com\\/(a\\/macros\\/[^/]+|macros)\\/s\\/[^/]+\\/exec$/.test(url)) return toast('Web App URL ต้องเป็น https://script.google.com/…/exec');\n  if(!key) return toast('กรุณาใส่ API Key');\n  const prev = api.cfg;\n  api.cfg = {url, key};\n  $('#apStatus').textContent = 'กำลังเชื่อมต่อ…';\n  try{\n    const p = await api.call('ping');\n    await loadRemote();\n    store.set('renew.api', api.cfg); // จำไว้เมื่อโหลดข้อมูลสำเร็จแล้วเท่านั้น\n    fillLineForm(); loadQuota();\n    toast(`เชื่อมต่อสำเร็จ · ใน Sheet มี ${p.items} รายการ${p.hasToken ? '' : ' · (ยังไม่ได้ตั้งค่า LINE)'}`);\n  }catch(err){\n    api.cfg = prev;\n    $('#apStatus').textContent = '❌ เชื่อมต่อไม่สำเร็จ: ' + err.message;\n  }\n};\n\n$('#apDisconnect').onclick = () => {\n  if(!confirm('ยกเลิกการเชื่อมต่อ? หน้านี้จะกลับไปใช้ข้อมูลที่เก็บในเบราว์เซอร์')) return;\n  api.cfg = {url:'', key:''}; store.set('renew.api', api.cfg);\n  items = localItems();\n  line = {...LINE_DEFAULT, ...store.get('renew.line2', {})}; recipients = [];\n  fillLineForm(); render();\n};\n\n$('#apImport').onclick = async () => {\n  const local = store.get('renew.items', null);\n  if(!local || !local.length) return toast('ไม่มีข้อมูลในเครื่องให้อัปโหลด');\n  if(!confirm(`อัปโหลด ${local.length} รายการจากเบราว์เซอร์นี้ขึ้น Google Sheets?\\n(รายการที่ id ซ้ำจะถูกเขียนทับ)`)) return;\n  try{\n    const j = await api.call('import', {items: local.map(i => ({...i, id:String(i.id)}))});\n    items = j.items; render(); fillLineForm();\n    toast(`อัปโหลดแล้ว ${j.imported} รายการ · ใน Sheet มี ${j.items.length} รายการ` +\n      (j.errors.length ? ` · ข้าม ${j.errors.length}: ${j.errors[0]}` : ''));\n  }catch(err){ toast('อัปโหลดไม่สำเร็จ: ' + err.message); }\n};\n\nfunction readLineForm(){\n  return {\n    enabled: $('#lnEnabled').checked,\n    hour: +$('#lnHour').value,\n    lookahead: +$('#lnLook').value,\n    overdueDaily: $('#lnOverdue').checked,\n    skipEmpty: $('#lnSkip').checked,\n    recipients: api.on ? [...document.querySelectorAll('#rcptList input:checked')].map(x => x.value) : line.recipients,\n  };\n}\n// พรีวิวตามค่าที่กำลังแก้ แต่ยังไม่เปลี่ยน line จริงจนกว่าจะกดบันทึก\n['lnOverdue','lnSkip'].forEach(id => $('#'+id).addEventListener('change', () => {\n  $('#linePreview').innerHTML = flexPreview({...line, ...readLineForm()});\n}));\n\nasync function saveLineSettings(){\n  const next = {...line, ...readLineForm()};\n  if(!api.on){ line = next; store.set('renew.line2', line); return; }\n  const j = await api.call('saveSettings', {settings: next});\n  line = {...LINE_DEFAULT, ...j.settings};\n}\n\n$('#lnSave').onclick = async () => {\n  try{\n    await saveLineSettings();\n    closeAll(); render();\n    toast(api.on ? 'บันทึกการตั้งค่าแล้ว · ตั้งเวลาส่งใหม่เรียบร้อย' : 'บันทึกในเครื่องแล้ว (ยังไม่ได้เชื่อมต่อ)');\n  }catch(err){ toast('บันทึกไม่สำเร็จ: ' + err.message); }\n};\n\n$('#lnTest').onclick = async () => {\n  if(!api.on) return toast('ต้องเชื่อมต่อ Apps Script ก่อน');\n  const sel = readLineForm().recipients;\n  if(!sel.length) return toast('เลือกผู้รับอย่างน้อย 1 คน');\n  if(!confirm(`บันทึกการตั้งค่า แล้วส่งข้อความทดสอบถึง ${sel.length} ผู้รับ?\\n(ใช้โควตา Push ${sel.length} ข้อความ)`)) return;\n  try{\n    await saveLineSettings(); // test ส่งถึงผู้รับที่บันทึกไว้ใน Sheet จึงต้องบันทึกก่อน\n    render();\n    const {result:r} = await api.call('test');\n    toast(r.errors.length ? `ส่งได้ ${r.sent} · ผิดพลาด: ${r.errors[0]}` : `ส่งแล้ว ${r.sent} ผู้รับ ✅`);\n    loadQuota();\n  }catch(err){ toast('ส่งไม่สำเร็จ: ' + err.message); }\n};\n\n// ---------- events ----------\nfunction closeAll(){ document.querySelectorAll('.overlay').forEach(o=>o.classList.remove('open')); }\nlet tt; function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('show'),2400); }\n\ndocument.addEventListener('click', e => {\n  if(e.target.classList.contains('overlay')) return closeAll();\n  const t = e.target.closest('[data-status],[data-cat],[data-view],[data-edit],[data-renew],[data-cal],[data-close],[data-open-line],[data-add],[data-goto-status],[data-goto-cat]');\n  if(!t) return;\n  const ds = t.dataset;\n  if(ds.renew) renew(ds.renew);\n  else if(ds.edit) openForm(ds.edit);\n  else if(ds.gotoStatus) { ui = {...ui, view:'list', status:ds.gotoStatus, cat:'all'}; render(); }\n  else if(ds.gotoCat) { ui = {...ui, view:'list', cat:ds.gotoCat, status:'all'}; render(); }\n  else if(ds.status) { ui.status = ds.status; render(); }\n  else if(ds.cat) { ui.cat = ds.cat; render(); }\n  else if(ds.view) { ui.view = ds.view; window.scrollTo({top:0}); render(); }\n  else if(ds.cal) { ui.calMonth.setMonth(ui.calMonth.getMonth() + +ds.cal); render(); }\n  else if('openLine' in ds) openLine();\n  else if('add' in ds) openForm();\n  else if('close' in ds) closeAll();\n});\ndocument.addEventListener('keydown', e => { if(e.key==='Escape') closeAll(); });\n\n// tooltip\nconst tip = $('#tip');\ndocument.addEventListener('pointermove', e => {\n  const el = e.target.closest('[data-tip]');\n  if(!el){ tip.classList.remove('show'); return; }\n  tip.innerHTML = el.dataset.tip; tip.classList.add('show');\n  const w = tip.offsetWidth, h = tip.offsetHeight;\n  let x = e.clientX + 14, y = e.clientY - h - 12;\n  if(x + w > innerWidth - 8) x = e.clientX - w - 14;\n  if(y \u003c 8) y = e.clientY + 16;\n  tip.style.left = x + 'px'; tip.style.top = y + 'px';\n});\n\n$('#addBtn').onclick = () => openForm();\n$('#themeBtn').onclick = () => {\n  const r = document.documentElement;\n  r.dataset.theme = r.dataset.theme === 'light' ? 'dark' : 'light';\n  store.set('renew.theme', r.dataset.theme);\n};\n// ฝังในหน้าปฏิทิน: ใช้ธีมเดียวกับหน้าแม่ (ตั้งที่แท็บ 💬 LINE) และซ่อนปุ่มสลับธีมของตัวเอง\nconst savedTheme = EMBED ? ((() => { try { return window.parent.document.documentElement.dataset.theme || 'light'; } catch { return 'light'; } })()) : store.get('renew.theme', null);\nif(EMBED){ const tb = document.getElementById('themeBtn'); if(tb) tb.style.display = 'none'; }\nif(savedTheme) document.documentElement.dataset.theme = savedTheme;\nif(EMBED){ const calNav = document.querySelector('.nav[data-view=\"cal\"]'); if(calNav) calNav.remove(); }\n\nloading = api.on;\nrender();\nloadRemote().catch(err => toast('โหลดข้อมูลจาก Google Sheets ไม่สำเร็จ: ' + err.message));\n\u003c/script>\n\u003c/template>\n\n\u003cscript>\n// ===== CONFIG =====\n// ข้อมูลเก็บใน Google Sheet เดียวกับ Expire (SPREADSHEET_ID ใน Code.gs)\n\n// ===== State =====\nvar events = [];\nvar currentView = 'month';\nvar currentDate = new Date();\nvar selectedDate = toDateStr(new Date());\nvar miniDate = new Date();\nvar editingId = null;\nvar isSaving = false;\nvar listFilter = { type: '', status: '', search: '' };\nvar draggingId = null;\nvar draggingEnd = 'start'; // 'start' or 'end'\nvar team = [];                 // [{name,color}]\nvar assigneeHidden = {};       // name -> true ถ้าถูกซ่อน (filter); ค่าเริ่มต้น = แสดงทุกคน\nvar UNASSIGNED_KEY = '__none__';\nvar settings = {};             // key -> value (เช่น type_project -> #4f6ef7)\nvar TYPES = ['project','daily','meeting','tracking'];\nvar DEFAULT_TYPE_COLORS = { project:'#4f6ef7', daily:'#22c55e', meeting:'#f97316', tracking:'#a855f7' };\n\n// ===== Thai Locale =====\nvar MONTHS_TH = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];\nvar DOWS_TH = ['อา','จ','อ','พ','พฤ','ศ','ส'];\nvar DOWS_FULL = ['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัส','ศุกร์','เสาร์'];\nvar TYPE_TH = { project:'โปรเจกต์', daily:'งานประจำวัน', meeting:'นัดหมาย/ประชุม', tracking:'ติดตามงาน',\n  'rn-over':'ต่ออายุ · เลยกำหนด', 'rn-urgent':'ต่ออายุ · ภายใน 7 วัน', 'rn-soon':'ต่ออายุ · ภายใน 30 วัน', 'rn-ok':'ต่ออายุ' };\nvar STATUS_TH = { todo:'รอดำเนินการ', inprogress:'กำลังดำเนินการ', done:'เสร็จแล้ว' };\n\nfunction toDateStr(d) {\n  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');\n}\nfunction todayStr() { return toDateStr(new Date()); }\nfunction genId() { return Date.now().toString(36)+Math.random().toString(36).slice(2); }\n\n// YYYY-MM-DD → DD/MM/YYYY พ.ศ. (สำหรับแสดงผลใน List view)\nfunction isoToDisplay(iso) {\n  if(!iso) return '';\n  var p = iso.split('-');\n  if(p.length !== 3) return iso;\n  return p[2]+'/'+p[1]+'/'+(parseInt(p[0])+543);\n}\nfunction timeToMins(t) {\n  if(!t) return -1;\n  var p=t.split(':'); return parseInt(p[0])*60+parseInt(p[1]);\n}\n\n// ===== Assignee helpers =====\nfunction parseAssignees(val) {\n  if(!val) return [];\n  return String(val).split(',').map(function(s){return s.trim();}).filter(function(s){return s;});\n}\n// งานที่ไม่ใช่ของเรา (แอดมินดูทุกคน) → ใส่ชื่อเจ้าของนำหน้า\nfunction evTitle(e){ return (e._mine===false && e._ownerName ? '['+escHtml(e._ownerName)+'] ' : '') + escHtml(e.title); }\nfunction escHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/\u003c/g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;').replace(/'/g,'&#39;'); }\nfunction teamColor(name) {\n  var m=team.find(function(t){return t.name===name;});\n  return m?m.color:'#9ca3af';\n}\n// แถบงานมองเห็นไหมตาม filter ผู้รับผิดชอบ\nfunction eventVisibleByAssignee(e) {\n  if(!ownerOk('cal', e.owner)) return false;\n  var a=parseAssignees(e.assignees);\n  if(a.length===0) return !assigneeHidden[UNASSIGNED_KEY];\n  return a.some(function(n){ return !assigneeHidden[n]; });\n}\n// จุดสีเล็กๆ บนแถบงาน\nfunction assigneeDotsHtml(e) {\n  var a=parseAssignees(e.assignees);\n  if(a.length===0) return '';\n  var dots=a.slice(0,4).map(function(n){\n    return '\u003cspan class=\"d\" style=\"background:'+teamColor(n)+'\" title=\"'+escHtml(n)+'\">\u003c/span>';\n  }).join('');\n  return '\u003cspan class=\"ev-dots\">'+dots+'\u003c/span>';\n}\n\n// สร้าง checkbox ผู้รับผิดชอบในฟอร์ม (selected = array ชื่อที่เลือกไว้)\nfunction buildModalAssignees(selected) {\n  selected = selected || [];\n  var box=document.getElementById('f-assignees');\n  if(team.length===0){ box.innerHTML='\u003cdiv style=\"color:var(--text2);font-size:12px\">ยังไม่มีรายชื่อทีม (กด ＋ เพิ่มสมาชิก ที่แถบซ้าย)\u003c/div>'; return; }\n  box.innerHTML=team.map(function(t){\n    var checked=selected.indexOf(t.name)>=0?' checked':'';\n    return '\u003clabel class=\"assignee-item\">\u003cinput type=\"checkbox\" value=\"'+escHtml(t.name)+'\"'+checked+'>'+\n      '\u003cspan class=\"assignee-dot\" style=\"background:'+t.color+'\">\u003c/span>'+\n      '\u003cspan class=\"a-name\">'+escHtml(t.name)+'\u003c/span>\u003c/label>';\n  }).join('');\n}\nfunction getModalAssignees() {\n  var boxes=document.querySelectorAll('#f-assignees input[type=checkbox]');\n  var out=[];\n  boxes.forEach(function(b){ if(b.checked) out.push(b.value); });\n  return out;\n}\n\n// สร้าง filter ผู้รับผิดชอบใน sidebar\nfunction buildAssigneeFilter() {\n  var box=document.getElementById('assignee-filter-box');\n  var list=document.getElementById('assignee-filter');\n  box.style.display='';\n  var html=team.map(function(t,i){\n    var checked=!assigneeHidden[t.name]?' checked':'';\n    return '\u003cdiv class=\"assignee-item\">'+\n      '\u003cinput type=\"checkbox\"'+checked+' onchange=\"toggleAssigneeFilter(team['+i+'].name,this.checked)\">'+\n      (t.id===ME.id||IS_ADMIN ? '\u003cinput type=\"color\" class=\"color-dot\" value=\"'+t.color+'\" title=\"เปลี่ยนสี\" onchange=\"changeMemberColor('+i+',this.value)\">' : '\u003cspan class=\"assignee-dot\" style=\"background:'+t.color+'\">\u003c/span>')+\n      '\u003cspan class=\"a-name\">'+escHtml(t.name)+'\u003c/span>'+\n      (t.id===ME.id ? '\u003cspan style=\"font-size:11px;color:var(--text2)\">(คุณ)\u003c/span>' : '')+'\u003c/div>';\n  }).join('');\n  // แถวงานที่ไม่ระบุผู้รับผิดชอบ\n  html+='\u003clabel class=\"assignee-item\">\u003cinput type=\"checkbox\"'+(!assigneeHidden[UNASSIGNED_KEY]?' checked':'')+' onchange=\"toggleAssigneeFilter(\\''+UNASSIGNED_KEY+'\\',this.checked)\">'+\n    '\u003cspan class=\"assignee-dot\" style=\"background:#9ca3af\">\u003c/span>'+\n    '\u003cspan class=\"a-name\" style=\"color:var(--text2)\">ไม่ระบุ\u003c/span>\u003c/label>';\n  list.innerHTML=html;\n}\nfunction toggleAssigneeFilter(name, show) {\n  if(show) delete assigneeHidden[name]; else assigneeHidden[name]=true;\n  render();\n}\nfunction setAllAssigneeFilter(show) {\n  assigneeHidden={};\n  if(!show){\n    team.forEach(function(t){ assigneeHidden[t.name]=true; });\n    assigneeHidden[UNASSIGNED_KEY]=true;\n  }\n  buildAssigneeFilter(); render();\n}\n\n// ===== ชื่อประเภทงาน (เก็บใน Settings: typename_\u003ctype>) =====\nvar DEFAULT_TYPE_TH = { project:'โปรเจกต์', daily:'งานประจำวัน', meeting:'นัดหมาย/ประชุม', tracking:'ติดตามงาน' };\nfunction applyTypeNames() {\n  TYPES.forEach(function(t){\n    TYPE_TH[t] = settings['typename_'+t] || DEFAULT_TYPE_TH[t];\n    var el = document.getElementById('tname-'+t); if (el) el.textContent = TYPE_TH[t];\n    var opt = document.querySelector('#f-type option[value=\"'+t+'\"]'); if (opt) opt.textContent = TYPE_TH[t];\n  });\n}\nfunction renameType(t) {\n  var name = prompt('ชื่อประเภทใหม่ (ว่าง = กลับเป็นค่าเริ่มต้น \"'+DEFAULT_TYPE_TH[t]+'\")', TYPE_TH[t]);\n  if (name === null) return;\n  name = name.trim().slice(0, 30);\n  settings['typename_'+t] = name;\n  applyTypeNames(); render();\n  api({action:'saveSetting', key:'typename_'+t, value:name})\n    .then(function(res){ if(res&&res.error) throw new Error(res.error); showToast('เปลี่ยนชื่อประเภทแล้ว ✓'); })\n    .catch(function(err){ showToast('บันทึกไม่สำเร็จ: '+err.message); });\n}\n\n// ===== สมาชิกทีม (ชีต Team) — เปลี่ยน/ลบชื่อ จะอัปเดตชื่อในงานเก่าให้ด้วย =====\nfunction refreshAll() {\n  loadEvents();\n  var x = expireApi(); if (x && x.reload) x.reload();\n  showToast('🔄 โหลดข้อมูลใหม่แล้ว');\n}\n\n// ===== แอดมิน: แสดงงานของทุกคน =====\nfunction setViewAll(on) {   // มีผลเฉพาะหน้าปฏิทิน\n  viewAll = !!on;\n  loadEvents();\n  showToast(viewAll ? '👁 แสดงงานของทุกคน' : 'แสดงเฉพาะงานของคุณ');\n}\nfunction setViewAllExp(on) {\n  viewAllExp = !!on;\n  renderOwnerPick('exp');\n  var x = expireApi(); if (x && x.reload) { setLoading('expire', true, 'กำลังโหลดรายการต่ออายุ...'); x.reload(); }\n}\nfunction setViewAllMoney(on) { viewAllMoney = !!on; renderOwnerPick('money'); loadMoney(true); }\n\n// ===== เลือกดูของแต่ละคน (แอดมินเปิด 👁) — จำแยกตามแท็บ · null = ทุกคน =====\nvar viewAllExp = false, viewAllMoney = false;\nvar OWNERS = {cal: null, exp: null, money: null};\ntry { var _o = JSON.parse(localStorage.getItem('calenda.owners') || '{}'); Object.keys(OWNERS).forEach(function(k){ if (Array.isArray(_o[k])) OWNERS[k] = _o[k]; }); } catch(e) {}\nfunction ownerViewOn(key) { return key === 'cal' ? viewAll : key === 'exp' ? viewAllExp : viewAllMoney; }\nfunction ownerOk(key, owner) {\n  if (!ownerViewOn(key) || !OWNERS[key] || !owner) return true;\n  return OWNERS[key].indexOf(owner) !== -1;\n}\nfunction renderOwnerPick(key) {\n  var box = document.getElementById('own-' + key);\n  if (!box) return;\n  if (!IS_ADMIN || !ownerViewOn(key) || !team.length) { box.innerHTML = ''; box.style.display = 'none'; return; }\n  var sel = OWNERS[key];\n  box.style.display = '';\n  box.innerHTML = '\u003cspan style=\"font-size:12px;color:var(--text2)\">👤 แสดงของ:\u003c/span>' + team.filter(function(t){ return t.id; }).map(function(t){\n    var on = !sel || sel.indexOf(t.id) !== -1;\n    return '\u003clabel class=\"' + (on ? 'on' : '') + '\">\u003cinput type=\"checkbox\"' + (on ? ' checked' : '') + ' onchange=\"ownerToggle(\\'' + key + '\\',\\'' + escHtml(t.id) + '\\',this.checked)\">' +\n      '\u003cspan class=\"d\" style=\"background:' + escHtml(t.color || '#9ca3af') + '\">\u003c/span>' + escHtml(t.name) + (t.id === ME.id ? ' (คุณ)' : '') + '\u003c/label>';\n  }).join('') +\n    '\u003cbutton onclick=\"ownerSet(\\'' + key + '\\',null)\">ทั้งหมด\u003c/button>\u003cbutton onclick=\"ownerSet(\\'' + key + '\\',[ME.id])\">ของฉัน\u003c/button>\u003cbutton onclick=\"ownerSet(\\'' + key + '\\',[])\">ล้าง\u003c/button>';\n}\nfunction ownerToggle(key, id, on) {\n  var all = team.filter(function(t){ return t.id; }).map(function(t){ return t.id; });\n  var sel = (OWNERS[key] || all).filter(function(x){ return x !== id; });\n  if (on) sel.push(id);\n  ownerSet(key, sel.length >= all.length ? null : sel);\n}\nfunction ownerSet(key, sel) {\n  OWNERS[key] = sel;\n  try { localStorage.setItem('calenda.owners', JSON.stringify(OWNERS)); } catch(e) {}\n  renderOwnerPick(key);\n  if (key === 'cal') render();\n  else if (key === 'money') renderMoney();\n  else { var x = expireApi(); if (x && x.refilter) x.refilter(); }\n}\nfunction applyRoleUI() {\n  document.getElementById('viewall-row').style.display = IS_ADMIN ? '' : 'none';\n  document.getElementById('exp-bar').style.display = IS_ADMIN ? '' : 'none';\n  document.getElementById('money-bar').style.display = IS_ADMIN ? '' : 'none';\n  document.getElementById('me-text').textContent = '👤 ' + ME.name + (IS_ADMIN ? ' (แอดมิน)' : '');\n  // ชื่อประเภทงานแก้ได้เฉพาะแอดมิน\n  document.querySelectorAll('.side-card .edit-btn').forEach(function(b){ b.style.display = IS_ADMIN ? '' : 'none'; });\n  document.querySelectorAll('.side-card .legend-item input[type=color][id^=color-]').forEach(function(b){ b.disabled = !IS_ADMIN; });\n  // แท็บผู้ใช้: แอดมินเท่านั้น\n  var ut = document.getElementById('users-tab'); if (ut) ut.style.display = IS_ADMIN ? '' : 'none';\n}\n\nfunction memberApi(params, okMsg) {\n  return api(params).then(function(res){\n    if(res&&res.error) throw new Error(res.error);\n    showToast(okMsg + (res.updated ? ' · อัปเดตงาน '+res.updated+' รายการ' : ''));\n    loadEvents();\n  }).catch(function(err){ showToast('ไม่สำเร็จ: '+err.message); });\n}\nfunction addMemberUI() {\n  var name = prompt('ชื่อสมาชิกใหม่'); if (!name || !name.trim()) return;\n  memberApi({action:'addMember', name:name.trim()}, 'เพิ่ม \"'+name.trim()+'\" แล้ว ✓');\n}\nfunction renameMemberUI(i) {\n  var t = team[i]; if (!t) return;\n  var name = prompt('เปลี่ยนชื่อ \"'+t.name+'\" เป็น', t.name);\n  if (!name || !name.trim() || name.trim() === t.name) return;\n  memberApi({action:'renameMember', oldName:t.name, newName:name.trim()}, 'เปลี่ยนชื่อแล้ว ✓');\n}\nfunction deleteMemberUI(i) {\n  var t = team[i]; if (!t) return;\n  if (!confirm('ลบ \"'+t.name+'\" ออกจากทีม?\\n(ชื่อนี้จะถูกเอาออกจากงานที่เคยมอบหมายด้วย)')) return;\n  memberApi({action:'deleteMember', name:t.name}, 'ลบ \"'+t.name+'\" แล้ว ✓');\n}\n\n// ===== Color management =====\n// เปลี่ยนสีประเภทงาน → set CSS variable + บันทึกลง Settings sheet\nfunction changeTypeColor(type, color) {\n  settings['type_'+type]=color;\n  document.documentElement.style.setProperty('--'+type, color);\n  render();\n  api({action:'saveSetting', key:'type_'+type, value:color})\n    .then(function(res){ if(res&&res.error) throw new Error(res.error); })\n    .catch(function(err){ showToast('บันทึกสีไม่สำเร็จ: '+err.message); });\n}\n// ใช้สีประเภทงานจาก settings ตอนโหลด\nfunction applyTypeColors() {\n  TYPES.forEach(function(t){\n    var c=settings['type_'+t]||DEFAULT_TYPE_COLORS[t];\n    document.documentElement.style.setProperty('--'+t, c);\n    var input=document.getElementById('color-'+t);\n    if(input) input.value=c;\n  });\n}\n// เปลี่ยนสีสมาชิก → update local + บันทึกลง Team sheet\nfunction changeMemberColor(idx, color) {\n  if(!team[idx]) return;\n  team[idx].color=color;\n  buildAssigneeFilter(); render();\n  api({action:'saveTeamColor', name:team[idx].name, color:color})\n    .then(function(res){ if(res&&res.error) throw new Error(res.error); })\n    .catch(function(err){ showToast('บันทึกสีไม่สำเร็จ: '+err.message); });\n}\nfunction checkOverlap(newEv) {\n  if(!newEv.timeStart || !newEv.timeEnd) return null;\n  var ns=timeToMins(newEv.timeStart), ne=timeToMins(newEv.timeEnd);\n  if(ne \u003c= ns) return 'เวลาสิ้นสุดต้องมากกว่าเวลาเริ่ม';\n  var conflicts = events.filter(function(e){\n    if(e.id === newEv.id) return false;\n    if(e.date !== newEv.date) return false;\n    if(!e.timeStart || !e.timeEnd) return false;\n    var es=timeToMins(e.timeStart), ee=timeToMins(e.timeEnd);\n    return ns \u003c ee && ne > es;\n  });\n  if(conflicts.length > 0) {\n    var c=conflicts[0];\n    return 'ทับกับงาน \"'+c.title+'\" ('+c.timeStart+'-'+c.timeEnd+')';\n  }\n  return null;\n}\n\n// ===== App Tabs =====\nvar currentApp = 'calenda';\n// ===== หน้าโหลดของแต่ละแท็บ: แสดงจนกว่าข้อมูลของแท็บนั้นมาครบ =====\nvar LOADING = {};   // app → ข้อความ หรือ {err, retry}\nfunction setLoading(app, on, msg) { if (on) LOADING[app] = msg || 'กำลังโหลดข้อมูล...'; else delete LOADING[app]; updateLoader(); }\nfunction loadFailed(app, msg, retry) { LOADING[app] = {err: msg, retry: retry}; updateLoader(); }\nfunction updateLoader() {\n  var o = document.getElementById('loading-overlay'), st = LOADING[currentApp];\n  if (!o) return;\n  if (!st) { o.style.display = 'none'; return; }\n  o.style.top = document.getElementById('app-tabs').offsetHeight + 'px';\n  o.style.display = 'flex';\n  o.innerHTML = typeof st === 'string'\n    ? '\u003cdiv class=\"spinner\">\u003c/div>\u003cdiv class=\"loading-text\">' + escHtml(st) + '\u003c/div>'\n    : '\u003cdiv style=\"font-size:38px\">⚠️\u003c/div>\u003cdiv class=\"err\">โหลดข้อมูลไม่สำเร็จ\u003cbr>\u003cb>' + escHtml(st.err) + '\u003c/b>\u003c/div>' +\n      '\u003cbutton class=\"btn2 primary\" onclick=\"retryLoad()\">🔄 ลองใหม่\u003c/button>';\n}\nfunction retryLoad() { var st = LOADING[currentApp]; if (st && st.retry) st.retry(); }\n\nfunction switchApp(app) {\n  currentApp = app;\n  updateLoader();\n  document.querySelectorAll('.app-tab').forEach(function(t,i){\n    t.classList.toggle('active', ['calenda','expire','money','line','queue','users'][i]===app);\n  });\n  document.getElementById('sidebar').style.display = app==='calenda' ? '' : 'none';\n  document.getElementById('main').style.display = app==='calenda' ? '' : 'none';\n  document.getElementById('page-expire').style.display = app==='expire' ? 'flex' : 'none';\n  document.getElementById('page-line').style.display = app==='line' ? 'block' : 'none';\n  document.getElementById('page-money').style.display = app==='money' ? 'block' : 'none';\n  document.getElementById('page-queue').style.display = app==='queue' ? 'block' : 'none';\n  document.getElementById('page-users').style.display = app==='users' ? 'block' : 'none';\n  if (app==='users') loadUsers();\n  if (app==='line') loadLine();\n  if (app==='money') loadMoney();\n  if (app==='queue') loadQueue();\n  if (app==='calenda') render();\n}\n\n// ===== Expire ↔ Calenda =====\n// รายการต่ออายุ (รวมรอบถัดๆ ไปของรายการที่ต่อซ้ำ) แสดงในปฏิทินแบบอ่านอย่างเดียว\n// คลิกแล้วเปิดฟอร์มในแท็บ Expire · ข้อมูลอ่านจากหน้า Expire โดยตรง (ไม่โหลดซ้ำ)\nvar renewals = [];\nvar showRenewals = true;\nfunction expireApi() {\n  try { var w=document.getElementById('expire-frame').contentWindow; return w && w.expireApi; } catch(e) { return null; }\n}\nfunction rebuildRenewals() {\n  var x = expireApi();\n  renewals = [];\n  if (!x || x.loading) return;\n  var t = new Date(), start = toDateStr(new Date(t.getFullYear()-1, 0, 1)), end = toDateStr(new Date(t.getFullYear()+3, 0, 1));\n  renewals = x.occurrences(start, end).map(function(i){\n    var cat = x.CATS[i.cat] || x.CATS.other;\n    return { id:'rn:'+i.id+':'+i.due, renewalId:i.id, renewal:true, date:i.due, dateEnd:'',\n      title: cat.icon+' '+i.title+(i.asset?' ('+i.asset+')':''), type:'rn-'+x.stKey(x.daysLeft(i.due)),\n      status:'', assignees:'', notes:i.note||'', timeStart:'', timeEnd:'' };\n  });\n  var hot = x.hotCount();\n  var b = document.getElementById('expire-badge');\n  b.textContent = hot; b.style.display = hot ? '' : 'none';\n}\nfunction visibleRenewals() { return showRenewals ? renewals : []; }\n// หน้า Expire เรียกทุกครั้งที่ข้อมูลเปลี่ยน\nwindow.onExpireChanged = function() { rebuildRenewals(); if (currentApp==='calenda') render(); };\nfunction openRenewal(id) {\n  var r = renewals.find(function(x){ return x.id===id; });\n  var x = expireApi();\n  if (!r || !x) return;\n  switchApp('expire');\n  x.openForm(r.renewalId);\n}\n// ===== แท็บ LINE / คิวแจ้งเตือน (เรียก dashboardApi ใน Code.gs) =====\nfunction dapi(action, data) {\n  return new Promise(function(res, rej) {\n    google.script.run.withSuccessHandler(function(j){ j && j.ok ? res(j) : rej(new Error((j && j.error) || 'error')); })\n      .withFailureHandler(rej).dashboardApi(action, data || {}, AUTH);\n  });\n}\nfunction hh(h){ return String(h).padStart(2,'0')+':00 น.'; }\nvar lnInfo = null;\nfunction loadLine() {\n  // สมาชิก: ไม่ต้องโชว์หน้าแอดมินระหว่างรอ server (รู้สิทธิ์จาก ME อยู่แล้ว)\n  if (!IS_ADMIN) {\n    var inner = document.querySelector('#page-line .tab-inner');\n    if (inner && !lnInfo) inner.innerHTML = '\u003cdiv class=\"sub\" style=\"padding:40px;text-align:center\">⏳ กำลังโหลด…\u003c/div>';\n  }\n  var hs = document.getElementById('ln-hour');\n  if (hs && !hs.options.length) for (var h=0; h\u003c24; h++) hs.innerHTML += '\u003coption value=\"'+h+'\">'+hh(h)+'\u003c/option>';\n\n  setLoading('line', true, 'กำลังโหลดการตั้งค่า LINE...');\n  return dapi('lineInfo').then(function(j){\n      lnInfo = j.info;\n      var b = document.getElementById('ln-base');\n      var pg = document.getElementById('ln-page'); if (pg && lnInfo.isAdmin) pg.value = lnInfo.pageUrl || '';\n      if (b && lnInfo.isAdmin && !b.value) { try { b.value = lnInfo.webUrl || localStorage.getItem('calenda.webhookBase') || ''; } catch(e) { b.value = lnInfo.webUrl || ''; } }\n      renderLine(); if (lnInfo.isAdmin) loadQuotaLine(); setLoading('line', false); })\n    .catch(function(err){ loadFailed('line', err.message, loadLine); });\n}\nfunction renderLine() {\n  var i = lnInfo, s = i.settings;\n  var page = document.getElementById('page-line');\n  if (!i.isAdmin) {\n    page.querySelector('.tab-inner').innerHTML =\n      themeCard() +\n      '\u003cdiv>\u003ch2>💬 การแจ้งเตือน LINE ของฉัน\u003c/h2>\u003cdiv class=\"sub\">บอทส่งสรุปงานของคุณ + งานที่ถูกแท็ก ทุกวัน ตามเวลาที่ตั้งด้านล่าง\u003c/div>\u003c/div>' +\n      '\u003cdiv class=\"card\">\u003cdiv class=\"opt-row\">\u003cspan>\u003cb>รับแจ้งเตือนรายวัน\u003c/b>\u003c/span>\u003cinput type=\"checkbox\" id=\"my-notify\" '+(i.myNotify!=='off'?'checked':'')+' onchange=\"saveMyNotify(this.checked)\">\u003c/div>' +\n      myHourRow(i) +\n      '\u003cdiv class=\"opt-row\">\u003cspan>LINE\u003c/span>\u003cspan>'+(i.lineLinked?'✅ ผูกแล้ว':'⚠️ ยังไม่ผูก')+'\u003c/span>\u003c/div>' +\n      '\u003cdiv class=\"opt-row\">\u003cspan>ทดสอบ\u003c/span>\u003cbutton class=\"btn2\" onclick=\"lnTest()\">ส่งสรุปของฉันตอนนี้\u003c/button>\u003c/div>\u003c/div>' +\n      '\u003cdiv class=\"card\">\u003ch3>คำสั่งใน LINE\u003c/h3>\u003col class=\"steps\">' +\n      '\u003cli>\u003cb>เพิ่มงาน\u003c/b> — ชื่อ → วัน → เวลา → ✅ บันทึก\u003c/li>' +\n      '\u003cl document.getElementById('ln-rcpt');\n  box.innerHTML = '\u003cdiv class=\"sub\">ผู้รับ = ผู้ใช้ที่อนุมัติแล้วทุกคน (ผูก LINE แล้ว '+(i.linkedUsers||0)+' คน) · แต่ละคนได้การ์ดของตัวเอง · จัดการที่แท็บ 👥 ผู้ใช้\u003c/div>' +\n    '\u003cdiv class=\"opt-row\" style=\"margin-top:8px\">\u003cspan>รับแจ้งเตือนของฉัน\u003c/span>\u003cinput type=\"checkbox\" '+(i.myNotify!=='off'?'checked':'')+' onchange=\"saveMyNotify(this.checked)\">\u003c/div>' +\n    myHourRow(i);\n  lnRenderWebhook();\n}\nvar webUrlTimer;\nfunction lnRenderWebhook() {\n  var base = document.getElementById('ln-base').value.trim();\n  try { localStorage.setItem('calenda.webhookBase', base); } catch(e) {}\n  // URL เดียวกันใช้สร้างลิงก์เว็บส่วนตัวของผู้ใช้ → บันทึกไว้ที่ server\n  clearTimeout(webUrlTimer);\n  if (lnInfo && lnInfo.isAdmin && base !== (lnInfo.webUrl || '') && (/\\/exec$/.test(base) || !base)) {\n    webUrlTimer = setTimeout(function(){\n      api({action:'userAction', act:'setWebUrl', value: base}).then(function(r){\n        if (r && r.error) return showToast(r.error);\n        lnInfo.webUrl = base; showToast('บันทึก URL แล้ว — ใช้สร้างลิงก์ให้ผู้ใช้');\n      });\n    }, 800);\n  }\n  document.getElementById('ln-webhook').value = base && lnInfo ? base + (base.indexOf('?')>=0?'&':'?') + 'key=' + lnInfo.webhookKey : '';\n}\nfunction lnSavePage() {\n  var v = document.getElementById('ln-page').value.trim();\n  api({action:'userAction', act:'setPageUrl', value: v}).then(function(r){\n    if (r && r.error) return showToast(r.error);\n    if (r && r.pageUrl != null) document.getElementById('ln-page').value = r.pageUrl;\n    if (lnInfo) lnInfo.pageUrl = r.pageUrl || '';\n    showToast(v ? 'บันทึกแล้ว — พิมพ์ \"เว็บ\" หาบอทเพื่อรับลิงก์ใหม่' : 'ยกเลิกลิงก์ GitHub แล้ว (ใช้ลิงก์ Google)');\n  });\n}\nfunction lnCopy() {\n  var el = document.getElementById('ln-webhook'); if (!el.value) return showToast('ใส่ URL ของ deployment ที่ 2 ก่อน');\n  el.select(); try { document.execCommand('copy'); showToast('คัดลอกแล้ว'); } catch(e) {}\n}\n// ===== ธีม: สว่าง / มืด / ตามเครื่อง (จำในเครื่องนี้) =====\nvar THEME_MEM = null;   // สำรองเมื่อเบราว์เซอร์ปิด localStorage (เช่นโหมดส่วนตัว)\nfunction themePref() { try { return localStorage.getItem('calenda.theme') || THEME_MEM || 'light'; } catch(e) { return THEME_MEM || 'light'; } }\nfunction cssVar(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }\nfunction applyTheme() {\n  var p = themePref();\n  var t = p === 'auto' ? (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : p;\n  document.documentElement.dataset.theme = t;\n  var x = expireApi(); if (x && x.setTheme) x.setTheme(t);\n  if (mData && currentApp === 'money') renderMoney();   // สีกราฟตามธีม\n}\nfunction setTheme(p) {\n  THEME_MEM = p;\n  try { localStorage.setItem('calenda.theme', p); } catch(e) {}\n  applyTheme();\n  document.querySelectorAll('.theme-seg button').forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-t') === p); });\n}\nfunction themeCard() {\n  var p = themePref();\n  var b = function(v, l){ return '\u003cbutton data-t=\"' + v + '\" class=\"' + (p === v ? 'on' : '') + '\" onclick=\"setTheme(\\'' + v + '\\')\">' + l + '\u003c/button>'; };\n  return '\u003cdiv class=\"card\">\u003cdiv class=\"opt-row\">\u003cspan>\u003cb>🎨 ธีม\u003c/b>\u003cbr>\u003csmall style=\"color:var(--text2)\">จำไว้ในเครื่องนี้\u003c/small>\u003c/span>' +\n    '\u003cdiv class=\"theme-seg\">' + b('light', '☀️ สว่าง') + b('dark', '🌙 มืด') + b('auto', '🖥️ ตามเครื่อง') + '\u003c/div>\u003c/div>\u003c/div>';\n}\napplyTheme();\ntry { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(){ if (themePref() === 'auto') applyTheme(); }); } catch(e) {}\n\n// เวลารับแจ้งเตือนของตัวเอง ('' = ใช้เวลาเริ่มต้นที่แอดมินตั้ง)\nfunction myHourRow(i) {\n  var def = i.defaultHour != null ? i.defaultHour : (i.settings || {}).hour;\n  var opts = '\u003coption value=\"\">ค่าเริ่ม ad: +document.getElementById('ln-look').value,\n    recipients: [].map.call(document.querySelectorAll('#ln-rcpt input:checked'), function(x){ return x.value; }),\n  };\n}\nfunction lnSaveSettings() {\n  return dapi('saveSettings', {settings: lnReadSettings()}).then(function(j){\n    lnInfo.settings = j.settings; renderLine(); showToast('บันทึกแล้ว · ส่งทุกวัน '+hh(j.settings.hour)+' ✓');\n  }).catch(function(err){ showToast('บันทึกไม่สำเร็จ: '+err.message); throw err; });\n}\nfunction lnTest() {\n  if (!lnInfo || !lnInfo.hasToken) return showToast('ยังไม่ได้ตั้งค่าบอท');\n  if (!lnInfo.lineLinked) return showToast('บัญชีนี้ยังไม่ได้ผูก LINE');\n  if (!confirm('ส่งสรุปงานของคุณไปที่ LINE ของคุณตอนนี้? (ใช้โควตา 1 ข้อความ)')) return;\n  (lnInfo.isAdmin ? lnSaveSettings() : Promise.resolve()).then(function(){ return dapi('test'); }).then(function(j){\n    var r = j.result; showToast(r.errors.length ? 'ส่งได้ '+r.sent+' · ผิดพลาด: '+r.errors[0] : 'ส่งแล้ว '+r.sent+' ผู้รับ ✅'); loadQuotaLine();\n  }).catch(function(err){ showToast('ส่งไม่สำเร็จ: '+err.message); });\n}\nfunction loadQuotaLine() {\n  var el = document.getElementById('ln-quota');\n  if (!lnInfo || !lnInfo.hasToken) { el.textContent = ''; return; }\n  dapi('quota').then(function(j){ var q=j.quota; el.textContent = 'โควตา Push เดือนนี้: '+q.used+' / '+(q.limit==null?'ไม่จำกัด':q.limit); })\n    .catch(function(err){ el.textContent = 'ดูโควตาไม่ได้: '+err.message; });\n}\n\nfunction loadQueue() {\n  var body = document.getElementById('q-body');\n  setLoading('queue', true, 'กำลังคำนวณคิวแจ้งเตือน...');\n  dapi('schedule', {days: +document.getElementById('q-days').value}).then(function(j){ body.innerHTML = renderQueue(j.schedule); setLoading('queue', false); })\n    .catch(function(err){ loadFailed('queue', err.message, loadQueue); });\n}\nfunction renderQueue(q) {\n  var warn = [];\n  if (!q.hasToken) warn.push('ยังไม่ได้ตั้ง LINE Token');\n  if (!q.enabled) warn.push('ปิดการแจ้งเตือนอยู่');\n  if (!q.recipie
