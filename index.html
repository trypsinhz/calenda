 align-items: center; font-size: 13px; font-weight: 600; cursor: pointer; }\n  #exp-bar { margin: 10px 16px 0; }\n  .theme-seg { display: inline-flex; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 3px; }\n  .theme-seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; color: var(--text2); }\n  .theme-seg button.on { background: var(--surface); color: var(--primary); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.12); }\n  * { box-sizing: border-box; margin: 0; padding: 0; }\n  body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100vh; overflow: hidden; font-size: 14px; }\n\n  /* Top app tabs */\n  #app-tabs { display: flex; background: #1a1d2e; flex-shrink: 0; padding: 0 16px; gap: 4px; align-items: flex-end; }\n  .app-tab { padding: 10px 24px; font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.55); cursor: pointer; border-radius: 8px 8px 0 0; border: none; background: transparent; transition: all 0.15s; }\n  .app-tab:hover { color: rgba(255,255,255,0.85); background: rgba(255,255,255,0.08); }\n  .app-tab.active { background: var(--bg); color: var(--primary); }\n  #app-content { flex: 1; display: flex; overflow: hidden; }\n\n  /* Coming soon pages */\n  .coming-soon { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: var(--text2); }\n  .coming-soon h2 { font-size: 28px; color: var(--text); }\n  .coming-soon p { font-size: 15px; }\n\n  /* Loading overlay */\n  #loading-overlay { position: fixed; inset: 0; background: rgba(255,255,255,0.85); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 2000; gap: 16px; }\n  .spinner { width: 40px; height: 40px; border: 4px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }\n  @keyframes spin { to { transform: rotate(360deg); } }\n  .loading-text { color: var(--text2); font-size: 14px; }\n\n  /* Sidebar */\n  /* แผงควบคุมใต้ตาราง: การ์ด 4 ใบ */\n  #main-scroll { flex: 1; overflow-y: auto; }\n  #sidebar { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 16px; padding: 0 20px 24px; }\n  /* การ์ดรายการงานของวัน: เต็มแถว อยู่บนสุด */\n  .day-card { grid-column: 1 / -1; }\n  .day-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }\n  .day-add { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 13px; color: var(--primary); font-weight: 600; }\n  .day-row { display: grid; grid-template-columns: 4px 92px 1fr; gap: 12px; align-items: center; padding: 10px 6px; border-top: 1px solid var(--border); cursor: pointer; border-radius: 8px; }\n  .day-row:first-child { border-top: 0; }\n  .day-row:hover { background: var(--surface2); }\n  .day-bar { width: 4px; align-self: stretch; border-radius: 2px; background: var(--primary); }\n  .day-time { font-size: 13px; color: var(--text2); font-weight: 600; }\n  .day-name { font-size: 14px; font-weight: 600; color: var(--text); word-break: break-word; }\n  .day-meta { font-size: 12px; color: var(--text2); margin-top: 2px; }\n  .day-row.done .day-name { text-decoration: line-through; opacity: .6; }\n  .day-empty { color: var(--text2); font-size: 13px; padding: 14px 4px; text-align: center; }\n  .side-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px; box-shadow: 0 1px 2px rgba(16,24,40,.04), 0 4px 14px rgba(16,24,40,.05); min-width: 0; }\n  .card-title { font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 12px; }\n  .side-card .legend-item { padding: 3px 0; font-size: 13px; }\n  .hint-text { font-size: 11px; color: var(--text2); margin-top: 8px; }\n  .toggle-row { cursor: pointer; margin-bottom: 12px !important; }\n  .side-card .btn-excel { width: 100%; }\n  .add-btn { margin-left: auto; background: var(--primary); color: #fff; border: none; border-radius: 8px; padding: 7px 14px; cursor: pointer; font-size: 13px; font-weight: 600; box-shadow: 0 2px 8px rgba(79,110,247,.3); }\n  .add-btn:hover { filter: brightness(1.08); }\n  @media (max-width: 1100px) { #sidebar { grid-template-columns: repeat(2, minmax(0,1fr)); } }\n  @media (max-width: 640px) { .day-row { grid-template-columns: 4px 64px 1fr; gap: 10px; } .day-time { font-size: 12px; } }\n  @media (max-width: 640px) { #sidebar { grid-template-columns: 1fr; padding: 0 10px 16px; } }\n  .btn-add { background: var(--primary); color: #fff; border: none; border-radius: var(--radius); padding: 10px; cursor: pointer; font-size: 14px; font-weight: 600; width: 100%; }\n  .btn-add:hover { filter: brightness(1.1); }\n  .mini-cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }\n  .mini-cal-header span { font-weight: 600; font-size: 13px; }\n  .mini-nav { background: none; border: none; cursor: pointer; color: var(--text2); font-size: 16px; padding: 2px 6px; border-radius: 4px; }\n  .mini-nav:hover { background: var(--surface2); }\n  .mini-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 2px; text-align: center; }\n  .mini-dow { font-size: 11px; color: var(--text2); padding: 2px 0; }\n  .mini-day { font-size: 12px; padding: 4px 2px; border-radius: 50%; cursor: pointer; line-height: 1.4; }\n  .mini-day:hover { background: var(--surface2); }\n  .mini-day.today { background: var(--primary); color: #fff; }\n  .mini-day.selected { outline: 2px solid var(--primary); }\n  .mini-day.other-month { color: #ccc; }\n  .mini-day.has-event::after { content: '•'; display: block; font-size: 8px; color: var(--primary); margin-top: -4px; }\n  .legend-title { font-size: 12px; color: var(--text2); margin-bottom: 6px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }\n  .edit-btn { background: none; border: none; cursor: pointer; font-size: 12px; color: var(--primary); padding: 0 2px; }\n  .edit-btn:hover { text-decoration: underline; }\n  .legend.editing .row-edit { display: inline; }\n  .row-edit { display: none; margin-left: auto; }\n  .row-edit button { background: none; border: none; cursor: pointer; font-size: 12px; padding: 0 3px; opacity: .7; }\n  .row-edit button:hover { opacity: 1; }\n  .legend-item { display: flex; align-items: center; gap: 8px; font-size: 12px; margin-bottom: 4px; }\n  .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }\n  /* Assignee filter (sidebar) + checkbox list (modal) — scoped under .assignee-list\n     to override .form-row label/input rules inside the modal */\n  .assignee-list { display: flex; flex-direction: column; gap: 2px; }\n  .assignee-list .assignee-item { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 400; color: var(--text); margin: 0; padding: 3px 4px; border-radius: 4px; cursor: pointer; }\n  .assignee-list .assignee-item:hover { background: var(--surface2); }\n  .assignee-list .assignee-item input[type=checkbox] { width: auto; cursor: pointer; margin: 0; flex-shrink: 0; }\n  .assignee-list .assignee-item .assignee-dot { width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0; border: 1px solid var(--border); padding: 0; cursor: pointer; }\n  .assignee-list .assignee-item .a-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }\n  /* color swatch input styled as a round dot */\n  input.color-dot { -webkit-appearance: none; appearance: none; width: 14px; height: 14px; border-radius: 50%; border: 1px solid var(--border); padding: 0; cursor: pointer; flex-shrink: 0; background: none; }\n  input.color-dot::-webkit-color-swatch-wrapper { padding: 0; }\n  input.color-dot::-webkit-color-swatch { border: none; border-radius: 50%; }\n  input.color-dot::-moz-color-swatch { border: none; border-radius: 50%; }\n  .legend-item input.color-dot { width: 12px; height: 12px; }\n  .filter-actions { display: flex; gap: 8px; margin-top: 4px; }\n  .filter-actions button { font-size: 11px; color: var(--primary); background: none; border: none; cursor: pointer; padding: 2px 0; }\n  /* Small assignee dots shown on event chips/bars */\n  .ev-dots { display: inline-flex; gap: 2px; margin-left: 4px; vertical-align: middle; flex-shrink: 0; }\n  .ev-dots .d { width: 7px; height: 7px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.7); }\n  .assignee-tag { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; background: var(--surface2); border-radius: 10px; padding: 1px 7px 1px 5px; margin: 1px; white-space: nowrap; }\n  .assignee-tag .d { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }\n  .excel-btns { display: flex; flex-direction: column; gap: 6px; }\n  .btn-excel { border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: var(--radius); padding: 8px; cursor: pointer; font-size: 12px; text-align: left; }\n  .btn-excel:hover { background: var(--surface2); }\n\n  /* Main */\n  #main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }\n  #toolbar { display: flex; align-items: center; gap: 10px; padding: 12px 20px; background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0; flex-wrap: wrap; }\n  #toolbar .title { font-size: 18px; font-weight: 700; min-width: 180px; }\n  .nav-btn { background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 6px 12px; cursor: pointer; font-size: 13px; }\n  .nav-btn:hover { background: var(--border); }\n  .today-btn { background: var(--primary); color: #fff; border: none; border-radius: 6px; padding: 6px 12px; cursor: pointer; font-size: 13px; }\n  .view-btns { margin-left: 8px; display: flex; background: var(--surface2); border-radius: 8px; overflow: hidden; border: 1px solid var(--border); }\n  .view-btn { border: none; background: none; padding: 6px 14px; cursor: pointer; font-size: 13px; color: var(--text2); }\n  .view-btn.active { background: var(--primary); color: #fff; }\n  #view-area { padding: 20px; }\n\n  /* Month */\n  .month-grid { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }\n  .month-dow-row { display: grid; grid-template-columns: repeat(7,minmax(0,1fr)); gap: 1px; background: var(--border); }\n  .month-dow { background: var(--surface2); text-align: center; padding: 8px; font-size: 12px; font-weight: 600; color: var(--text2); }\n  .month-weeks { display: flex; flex-direction: column; gap: 1px; background: var(--border); }\n  .month-week { position: relative; }\n  .month-week-cells { display: grid; grid-template-columns: repeat(7,minmax(0,1fr)); gap: 1px; background: var(--border); }\n  .month-cell { background: var(--surface); height: 118px; padding: 6px; cursor: pointer; overflow: hidden; min-width: 0; }\n  .month-week-bars { position: absolute; left: 0; right: 0; pointer-events: none; }\n  .multiday-bar { position: absolute; height: 20px; border-radius: 4px; color: #fff; font-size: 11px; padding: 0 4px 0 6px; display: flex; align-items: center; overflow: hidden; pointer-events: all; cursor: grab; user-select: none; }\n  .multiday-bar:active { cursor: grabbing; }\n  .multiday-bar.project { background: var(--project); }\n  .multiday-bar.daily { background: var(--daily); }\n  .multiday-bar.meeting { background: var(--meeting); }\n  .multiday-bar.tracking { background: var(--tracking); }\n  .multiday-bar.done-ev { text-decoration: line-through; opacity: 0.65; }\n  .bar-label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }\n  .bar-handle { cursor: ew-resize; padding: 0 3px; opacity: 0.8; flex-shrink: 0; }\n  .bar-arrow { opacity: 0.7; flex-shrink: 0; font-size: 10px; }\n  .month-cell:hover { background: #fafbff; }\n  .month-cell.other-month { background: var(--surface2); opacity: 0.6; }\n  .month-cell.today .cell-day { background: var(--primary); color: #fff; border-radius: 50%; }\n  .month-cell.selected { outline: 2px solid var(--primary); outline-offset: -2px; }\n  .cell-day { display: inline-block; width: 24px; height: 24px; text-align: center; line-height: 24px; font-size: 13px; font-weight: 600; margin-bottom: 4px; }\n  .cell-event { font-size: 11px; padding: 2px 5px; border-radius: 4px; margin-bottom: 2px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; }\n  .cell-event.project { background: var(--project); }\n  .cell-event.daily { background: var(--daily); }\n  .cell-event.meeting { background: var(--meeting); }\n  .cell-event.tracking { background: var(--tracking); }\n  .cell-more { font-size: 11px; color: var(--text2); padding: 2px 5px; }\n\n  /* Week */\n  .week-container { display: grid; grid-template-columns: 60px repeat(7,1fr); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; background: var(--border); gap: 1px; }\n  .week-header { background: var(--surface2); text-align: center; padding: 8px 4px; font-size: 12px; }\n  .week-header.today-col { color: var(--primary); font-weight: 700; }\n  .week-time-col { background: var(--surface); display: flex; align-items: center; justify-content: flex-end; padding-right: 8px; font-size: 11px; color: var(--text2); height: 48px; }\n  .week-cell { background: var(--surface); height: 48px; cursor: pointer; position: relative; padding: 2px; }\n  .week-cell:hover { background: #fafbff; }\n  .week-event { font-size: 11px; padding: 2px 4px; border-radius: 4px; color: #fff; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }\n  .week-event.project { background: var(--project); }\n  .week-event.daily { background: var(--daily); }\n  .week-event.meeting { background: var(--meeting); }\n  .week-event.tracking { background: var(--tracking); }\n\n  /* Day */\n  .day-container { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }\n  .day-hour-row { display: grid; grid-template-columns: 60px 1fr; min-height: 48px; border-bottom: 1px solid var(--border); }\n  .day-hour-label { font-size: 11px; color: var(--text2); padding: 4px 8px; text-align: right; }\n  .day-hour-events { padding: 2px 8px; cursor: pointer; }\n  .day-hour-events:hover { background: #fafbff; }\n  .day-event { padding: 4px 8px; border-radius: 6px; margin-bottom: 4px; cursor: pointer; color: #fff; }\n  .day-event.project { background: var(--project); }\n  .day-event.daily { background: var(--daily); }\n  .day-event.meeting { background: var(--meeting); }\n  .day-event.tracking { background: var(--tracking); }\n  .day-event-title { font-weight: 600; font-size: 13px; }\n  .day-event-meta { font-size: 11px; opacity: 0.85; }\n\n  /* List */\n  .list-filters { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }\n  .filter-select { border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; background: var(--surface); font-size: 13px; color: var(--text); }\n  .list-table { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: var(--radius); overflow: hidden; border: 1px solid var(--border); }\n  .list-table th { background: var(--surface2); padding: 10px 12px; text-align: left; font-size: 12px; font-weight: 600; color: var(--text2); border-bottom: 1px solid var(--border); }\n  .list-table td { padding: 10px 12px; border-bottom: 1px solid var(--border); font-size: 13px; vertical-align: middle; }\n  .list-table tr:hover td { background: #fafbff; }\n  .type-badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; color: #fff; }\n  .type-badge.project { background: var(--project); }\n  .type-badge.daily { background: var(--daily); }\n  .type-badge.meeting { background: var(--meeting); }\n  .type-badge.tracking { background: var(--tracking); }\n  .status-badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; }\n  .status-badge.todo { background: var(--todo-bg); color: var(--todo-text); }\n  .status-badge.inprogress { background: var(--inprogress-bg); color: var(--inprogress-text); }\n  .status-badge.done { background: var(--done-bg); color: var(--done-text); }\n  .action-btn { background: none; border: none; cursor: pointer; color: var(--text2); font-size: 14px; padding: 2px 5px; border-radius: 4px; }\n  .action-btn:hover { background: var(--surface2); }\n\n  /* Modal */\n  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.35); display: flex; align-items: center; justify-content: center; z-index: 1000; }\n  .modal { background: var(--surface); border-radius: 14px; padding: 28px; width: 480px; max-width: 95vw; box-shadow: 0 8px 40px rgba(0,0,0,0.18); max-height: 90vh; overflow-y: auto; }\n  .modal h2 { font-size: 18px; font-weight: 700; margin-bottom: 20px; }\n  .form-row { margin-bottom: 14px; }\n  .form-row label { display: block; font-size: 12px; font-weight: 600; color: var(--text2); margin-bottom: 4px; }\n  .form-row input, .form-row select, .form-row textarea { width: 100%; border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 14px; color: var(--text); background: var(--bg); font-family: inherit; }\n  .form-row input:focus, .form-row select:focus, .form-row textarea:focus { outline: 2px solid var(--primary); border-color: var(--primary); }\n  .form-row textarea { resize: vertical; min-height: 80px; }\n  .form-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }\n  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }\n  .btn-cancel { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 8px 20px; cursor: pointer; font-size: 14px; }\n  .btn-save { background: var(--primary); color: #fff; border: none; border-radius: 8px; padding: 8px 20px; cursor: pointer; font-size: 14px; font-weight: 600; }\n  .btn-delete { background: #fee2e2; color: #991b1b; border: none; border-radius: 8px; padding: 8px 20px; cursor: pointer; font-size: 14px; margin-right: auto; }\n\n  /* Done strikethrough */\n  .cell-event.done-ev { text-decoration: line-through; opacity: 0.65; }\n  .week-event.done-ev { text-decoration: line-through; opacity: 0.65; }\n  .day-event.done-ev .day-event-title { text-decoration: line-through; opacity: 0.65; }\n\n  /* Custom time picker */\n  .time-picker { display: flex; align-items: center; gap: 4px; }\n  .time-picker select { border: 1px solid var(--border); border-radius: 8px; padding: 8px 6px; font-size: 14px; color: var(--text); background: var(--bg); cursor: pointer; flex: 1; }\n  .time-picker span { font-weight: 700; color: var(--text2); font-size: 16px; }\n  .disabled-row { opacity: 0.4; }\n  .disabled-row select { cursor: not-allowed; background: var(--surface2); }\n\n  /* Drag & Drop */\n  .dragging { opacity: 0.4; }\n  .drop-target { background: #eef2ff !important; outline: 2px dashed var(--primary); outline-offset: -2px; }\n  .cell-event[draggable], .week-event[draggable], .day-event[draggable] { cursor: grab; }\n  .cell-event[draggable]:active, .week-event[draggable]:active, .day-event[draggable]:active { cursor: grabbing; }\n\n  /* Mobile responsive */\n  @media (max-width: 640px) {\n    #toolbar .title { font-size: 14px; min-width: 100px; }\n    .view-btn { padding: 6px 8px; font-size: 12px; }\n    #view-area { padding: 10px; }\n    .month-cell { height: 64px; padding: 3px; }\n    /* มือถือ: งานเป็นแถบสีบาง ไม่มีตัวหนังสือ · แตะวัน → มุมมองวัน */\n    .cell-event { font-size: 0; line-height: 0; height: 6px; padding: 0; margin-bottom: 3px; border-radius: 3px; }\n    .cell-event .ev-dots { display: none; }\n    .cell-more { font-size: 10px; padding: 0 2px; }\n    .month-cell .cell-day { width: 20px; height: 20px; line-height: 20px; font-size: 12px; margin-bottom: 2px; }\n    .add-btn { margin-left: 0; }\n    .refresh-btn { padding: 6px 9px; }\n  }\n\n  #file-input { display: none; }\n\n  /* ===== แท็บ LINE / คิวแจ้งเตือน ===== */\n  .tab-page { flex: 1; display: none; overflow-y: auto; padding: 24px; }\n  .tab-inner { max-width: 1000px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }\n  .tab-inner h2 { font-size: 20px; }\n  .tab-inner .sub { color: var(--text2); font-size: 13px; }\n  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px; }\n  .card h3 { font-size: 15px; margin-bottom: 12px; }\n  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }\n  .stat-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }\n  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px; }\n  .stat .k { font-size: 12px; color: var(--text2); }\n  .stat .v { font-size: 18px; font-weight: 700; margin-top: 4px; }\n  .ok-text { color: #16a34a; } .bad-text { color: #dc2626; } .warn-text { color: #d97706; }\n  .fld { margin-bottom: 12px; }\n  .fld label { display: block; font-size: 12px; font-weight: 600; color: var(--text2); margin-bottom: 4px; }\n  .fld input[type=text], .fld input[type=password], .fld select { width: 100%; border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 14px; background: var(--bg); color: var(--text); font-family: inherit; }\n  .row-btns { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }\n  .btn2 { border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 7px 14px; cursor: pointer; font-size: 13px; }\n  .btn2:hover { background: var(--surface2); }\n  .btn2.primary { background: #06c755; border-color: #06c755; color: #fff; font-weight: 600; }\n  .btn2.danger { color: #dc2626; }\n  .opt-row { displ flex-wrap: wrap; justify-content: center; }\n  .m-donut-c { position: relative; width: 190px; height: 190px; }\n  .m-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; text-align: center; }\n  .m-center b { font-size: 17px; } .m-center small { color: var(--text2); font-size: 11px; }\n  .m-legend { display: flex; flex-direction: column; gap: 8px; min-width: 170px; flex: 1; }\n  .m-leg { display: grid; grid-template-columns: 10px 1fr auto; gap: 8px; align-items: center; font-size: 13px; }\n  .m-leg i { width: 10px; height: 10px; border-radius: 3px; }\n  .m-leg span:last-child { font-weight: 600; } .m-leg small { color: var(--text2); margin-left: 4px; font-weight: 400; }\n  .m-bar-c { position: relative; height: 230px; }\n  .m-row { display: grid; grid-template-columns: 36px 1fr auto; gap: 12px; align-items: center; padding: 10px 4px; border-top: 1px solid var(--border); cursor: pointer; border-radius: 8px; }\n  .m-row:hover { background: var(--surface2); }\n  .m-ic { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; }\n  .m-row .t { font-weight: 600; font-size: 14px; word-break: break-word; } .m-row small { display: block; color: var(--text2); font-size: 12px; }\n  .m-row .amt { font-weight: 700; font-size: 15px; white-space: nowrap; }\n  .m-day { font-size: 12px; color: var(--text2); font-weight: 600; padding: 12px 4px 4px; display: flex; justify-content: space-between; }\n  .m-empty { color: var(--text2); text-align: center; padding: 28px 8px; font-size: 13px; }\n  .m-form .grid { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 10px; }\n  .m-form input, .m-form select { width: 100%; border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 14px; background: var(--bg); color: var(--text); font-family: inherit; }\n  .m-form .cats { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }\n  .m-form .cats button { border: 1px solid var(--border); background: var(--surface); border-radius: 20px; padding: 6px 12px; cursor: pointer; font-size: 13px; }\n  .m-form .cats button.on { border-color: var(--primary); background: #eef2ff; color: var(--primary); font-weight: 600; }\n  .stat .v.up { color: #dc2626; } .stat .v.down { color: #16a34a; }\n  @media (max-width: 860px) { .m-charts { grid-template-columns: 1fr; } .m-form .grid { grid-template-columns: 1fr 1fr; } }\n  @media (max-width: 640px) { .m-nav b { min-width: 0; font-size: 14px; } .m-bar { flex-direction: column; align-items: stretch; } .m-nav { justify-content: space-between; } .m-seg { justify-content: center; } .m-seg button { flex: 1; } }\n\n  /* ===== Expire (รายการต่ออายุ) ===== */\n  #page-expire { flex: 1; display: none; flex-direction: column; min-height: 0; }\n  #expire-frame { flex: 1; width: 100%; height: 100%; border: 0; background: var(--bg); }\n  .app-tab .tab-badge { display: inline-block; min-width: 18px; padding: 0 6px; margin-left: 6px; border-radius: 9px; background: #ef4444; color: #fff; font-size: 11px; line-height: 18px; text-align: center; }\n  :root { --rn-over: #e5484d; --rn-urgent: #f06b1f; --rn-soon: #c99400; --rn-ok: #1f9d55; }\n  .cell-event.rn-over, .week-event.rn-over, .day-event.rn-over, .type-badge.rn-over { background: var(--rn-over); }\n  .cell-event.rn-urgent, .week-event.rn-urgent, .day-event.rn-urgent, .type-badge.rn-urgent { background: var(--rn-urgent); }\n  .cell-event.rn-soon, .week-event.rn-soon, .day-event.rn-soon, .type-badge.rn-soon { background: var(--rn-soon); }\n  .cell-event.rn-ok, .week-event.rn-ok, .day-event.rn-ok, .type-badge.rn-ok { background: var(--rn-ok); }\n  .cell-event[class*=\"rn-\"], .week-event[class*=\"rn-\"], .day-event[class*=\"rn-\"] { border-left: 3px solid rgba(0,0,0,0.25); }\n  .legend-dot.rn { background: linear-gradient(90deg, var(--rn-over), var(--rn-urgent), var(--rn-soon), var(--rn-ok)); }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\n\u003c!-- Loading -->\n\u003cdiv id=\"loading-overlay\" class=\"page-loader\">\n  \u003cdiv class=\"spinner\">\u003c/div>\n  \u003cdiv class=\"loading-text\">กำลังโหลดข้อมูล...\u003c/div>\n\u003c/div>\n\n\u003c!-- Top App Tabs -->\n\u003cdiv id=\"app-tabs\">\n  \u003cbutton class=\"app-tab active\" onclick=\"switchApp('calenda')\">📅 Calenda\u003c/button>\n  \u003cbutton class=\"app-tab\" onclick=\"switchApp('expire')\">⏳ Expire\u003cspan class=\"tab-badge\" id=\"expire-badge\" style=\"display:none\">\u003c/span>\u003c/button>\n  \u003cbutton class=\"app-tab\" onclick=\"switchApp('money')\">💰 รายจ่าย\u003c/button>\n  \u003cbutton class=\"app-tab\" onclick=\"switchApp('line')\">💬 LINE\u003c/button>\n  \u003cbutton class=\"app-tab\" onclick=\"switchApp('queue')\">🔔 คิวแจ้งเตือน\u003c/button>\n  \u003cbutton class=\"app-tab\" id=\"users-tab\" onclick=\"switchApp('users')\" style=\"display:none\">👥 ผู้ใช้\u003cspan class=\"tab-badge\" id=\"users-badge\" style=\"display:none\">\u003c/span>\u003c/button>\n\u003c/div>\n\n\u003c!-- App Content -->\n\u003cdiv id=\"app-content\">\n\n\u003c!-- Main -->\n\u003cdiv id=\"main\">\n  \u003cdiv id=\"toolbar\">\n    \u003cbutton class=\"nav-btn\" onclick=\"navigate(-1)\">‹\u003c/button>\n    \u003cbutton class=\"nav-btn\" onclick=\"navigate(1)\">›\u003c/button>\n    \u003cbutton class=\"today-btn\" onclick=\"goToday()\">วันนี้\u003c/button>\n    \u003cspan class=\"title\" id=\"toolbar-title\">\u003c/span>\n    \u003cbutton class=\"add-btn\" onclick=\"openModal()\">＋ เพิ่มงาน\u003c/button>\n    \u003cbutton class=\"nav-btn refresh-btn\" onclick=\"refreshAll()\" title=\"โหลดข้อมูลใหม่ (เช่น หลังเพิ่มงานจาก LINE)\">🔄\u003c/button>\n    \u003cdiv class=\"view-btns\">\n      \u003cbutton class=\"view-btn\" onclick=\"setView('month')\" id=\"btn-month\">เดือน\u003c/button>\n      \u003cbutton class=\"view-btn\" onclick=\"setView('week')\" id=\"btn-week\">สัปดาห์\u003c/button>\n      \u003cbutton class=\"view-btn\" onclick=\"setView('day')\" id=\"btn-day\">วัน\u003c/button>\n      \u003cbutton class=\"view-btn\" onclick=\"setView('list')\" id=\"btn-list\">รายการ\u003c/button>\n    \u003c/div>\n  \u003c/div>\n  \u003cdiv id=\"main-scroll\">\n  \u003cdiv id=\"view-area\">\u003c/div>\n\n  \u003c!-- แผงควบคุม (เดิมอยู่แถบซ้าย) → การ์ดใต้ตาราง -->\n  \u003cdiv id=\"sidebar\">\n    \u003c!-- รายการงานของวันที่เลือก (มุมมองเดือน) — อ่านชื่องานเต็มบนมือถือได้ -->\n    \u003cdiv class=\"side-card day-card\" id=\"day-card\">\n      \u003cdiv class=\"day-head\">\n        \u003cdiv class=\"card-title\" id=\"day-title\" style=\"margin:0\">📋 รายการงาน\u003c/div>\n        \u003cbutton class=\"day-add\" id=\"day-add\">＋ เพิ่มงานวันนี้\u003c/button>\n      \u003c/div>\n      \u003cdiv id=\"day-list\">\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"side-card legend\">\n      \u003cdiv class=\"legend-title card-title\">🏷️ ประเภทงาน \u003cbutton class=\"edit-btn\" onclick=\"this.closest('.legend').classList.toggle('editing')\" title=\"แก้ชื่อประเภท\">✏️ แก้\u003c/button>\u003c/div>\n      \u003cdiv class=\"legend-item\">\u003cinput type=\"color\" class=\"color-dot\" id=\"color-project\" value=\"#4f6ef7\" onchange=\"changeTypeColor('project',this.value)\" title=\"เปลี่ยนสี\">\u003cspan id=\"tname-project\">โปรเจกต์\u003c/span>\u003cspan class=\"row-edit\">\u003cbutton onclick=\"renameType('project')\" title=\"เปลี่ยนชื่อ\">✏️\u003c/button>\u003c/span>\u003c/div>\n      \u003cdiv class=\"legend-item\">\u003cinput type=\"color\" class=\"color-dot\" id=\"color-daily\" value=\"#22c55e\" onchange=\"changeTypeColor('daily',this.value)\" title=\"เปลี่ยนสี\">\u003cspan id=\"tname-daily\">งานประจำวัน\u003c/span>\u003cspan class=\"row-edit\">\u003cbutton onclick=\"renameType('daily')\" title=\"เปลี่ยนชื่อ\">✏️\u003c/button>\u003c/span>\u003c/div>\n      \u003cdiv class=\"legend-item\">\u003cinput type=\"color\" class=\"color-dot\" id=\"color-meeting\" value=\"#f97316\" onchange=\"changeTypeColor('meeting',this.value)\" title=\"เปลี่ยนสี\">\u003cspan id=\"tname-meeting\">นัดหมาย/ประชุม\u003c/span>\u003cspan class=\"row-edit\">\u003cbutton onclick=\"renameType('meeting')\" title=\"เปลี่ยนชื่อ\">✏️\u003c/button>\u003c/span>\u003c/div>\n      \u003cdiv class=\"legend-item\">\u003cinput type=\"color\" class=\"color-dot\" id=\"color-tracking\" value=\"#a855f7\" onchange=\"changeTypeColor('tracking',this.value)\" title=\"เปลี่ยนสี\">\u003cspan id=\"tname-tracking\">ติดตามงาน\u003c/span>\u003cspan class=\"row-edit\">\u003cbutton onclick=\"renameType('tracking')\" title=\"เปลี่ยนชื่อ\">✏️\u003c/button>\u003c/span>\u003c/div>\n      \u003cdiv class=\"hint-text\">คลิกจุดสีเพื่อเปลี่ยนสี\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"side-card legend\" id=\"assignee-filter-box\">\n      \u003cdiv class=\"legend-title card-title\">👤 ผู้รับผิดชอบ\u003c/div>\n      \u003cdiv class=\"assignee-list\" id=\"assignee-filter\">\u003c/div>\n      \u003cdiv class=\"filter-actions\">\n        \u003cbutton onclick=\"setAllAssigneeFilter(true)\">เลือกทั้งหมด\u003c/button>\n        \u003cbutton onclick=\"setAllAssigneeFilter(false)\">ล้าง\u003c/button>\n\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"side-card\">\n      \u003cdiv class=\"card-title\">⚙️ อื่นๆ\u003c/div>\n      \u003clabel class=\"legend-item toggle-row\" id=\"viewall-row\" style=\"display:none\">\u003cinput type=\"checkbox\" id=\"view-all\" onchange=\"setViewAll(this.checked)\" style=\"margin:0\">👁 แสดงงานของทุกคน (แอดมิน)\u003c/label>\n      \u003cdiv class=\"own-pick\" id=\"own-cal\" style=\"margin:2px 0 8px\">\u003c/div>\n      \u003clabel class=\"legend-item toggle-row\">\u003cinput type=\"checkbox\" id=\"show-renewals\" checked onchange=\"showRenewals=this.checked;render()\" style=\"margin:0\">\u003cspan class=\"legend-dot rn\">\u003c/span>แสดงรายการต่ออายุ (จาก Expire)\u003c/label>\n      \u003cdiv class=\"hint-text\" id=\"me-text\">\u003c/div>\n    \u003c/div>\n  \u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003c!-- Expire Page: ไฟล์ Expire.html ฝังใน iframe แบบ srcdoc\n     origin เดียวกัน → ใช้ google.script.run ของหน้านี้ได้ และแชร์ข้อมูลกับปฏิทิน -->\n\u003cdiv id=\"page-expire\">\n  \u003cdiv class=\"va-bar\" id=\"exp-bar\" style=\"display:none\">\n    \u003clabel>\u003cinput type=\"checkbox\" id=\"va-exp\" onchange=\"setViewAllExp(this.checked)\">👁 แสดงรายการต่ออายุของทุกคน\u003c/label>\n    \u003cdiv class=\"own-pick\" id=\"own-exp\">\u003c/div>\n  \u003c/div>\n  \u003ciframe id=\"expire-frame\" title=\"Expire\">\u003c/iframe>\n\u003c/div>\n\n\u003c!-- รายจ่ายรายวัน: จดจาก LINE (\"รายจ่าย\") · สรุป วัน/เดือน/ปี พร้อมกราฟ -->\n\u003cdiv id=\"page-money\" class=\"tab-page\">\u003cdiv class=\"tab-inner\">\n  \u003cdiv style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap\">\n    \u003cdiv>\u003ch2>💰 รายจ่าย\u003c/h2>\u003cdiv class=\"sub\">จดใน LINE: พิมพ์ \u003cb>รายจ่าย\u003c/b> หรือพิมพ์ลัด \u003cb>รายจ่าย อาหาร 120 ข้าวมันไก่\u003c/b> · สรุป: \u003cb>เช็ครายจ่าย\u003c/b>\u003c/div>\u003c/div>\n    \u003cdiv class=\"row-btns\">\n      \u003cbutton class=\"btn2 primary\" onclick=\"mEdit()\">＋ เพิ่มรายจ่าย\u003c/button>\n      \u003cbutton class=\"btn2\" onclick=\"loadMoney(true)\">🔄\u003c/button>\n    \u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"m-bar\">\n    \u003cdiv class=\"m-seg\" id=\"m-seg\">\n      \u003cbutton data-v=\"day\" onclick=\"mSetView('day')\">วัน\u003c/button>\u003cbutton data-v=\"month\" onclick=\"mSetView('month')\">เดือน\u003c/button>\u003cbutton data-v=\"year\" onclick=\"mSetView('year')\">ปี\u003c/button>\n    \u003c/div>\n    \u003cdiv class=\"m-nav\">\n      \u003cbutton class=\"btn2\" onclick=\"mNav(-1)\">‹\u003c/button>\n      \u003cb id=\"m-label\">\u003c/b>\n      \u003cbutton class=\"btn2\" onclick=\"mNav(1)\">›\u003c/button>\n      \u003cbutton class=\"btn2\" onclick=\"mToday()\">ปัจจุบัน\u003c/button>\n    \u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"va-bar\" id=\"money-bar\" style=\"display:none\">\n    \u003clabel>\u003cinput type=\"checkbox\" id=\"va-money\" onchange=\"setViewAllMoney(this.checked)\">👁 แสดงรายจ่ายของทุกคน\u003c/label>\n    \u003cdiv class=\"own-pick\" id=\"own-money\">\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"card m-form\" id=\"m-form\" style=\"display:none\">\u003c/div>\n  \u003cdiv class=\"stat-row\" id=\"m-stats\">\u003c/div>\n  \u003cdiv class=\"m-charts\">\n    \u003cdiv class=\"card\">\u003ch3 class=\"m-h\">สัดส่วนตามหมวด\u003c/h3>\u003cdiv class=\"m-donut\">\u003cdiv class=\"m-donut-c\">\u003ccanvas id=\"m-pie\">\u003c/canvas>\u003cdiv class=\"m-center\" id=\"m-center\">\u003c/div>\u003c/div>\u003cdiv id=\"m-legend\" class=\"m-legend\">\u003c/div>\u003c/div>\u003c/div>\n    \u003cdiv class=\"card\">\u003ch3 class=\"m-h\" id=\"m-bar-title\">รายจ่ายรายวัน\u003c/h3>\u003cdiv class=\"m-bar-c\">\u003ccanvas id=\"m-barc\">\u003c/canvas>\u003c/div>\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"card\">\n    \u003cdiv style=\"display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px\">\n      \u003ch3 class=\"m-h\" style=\"margin:0\">รายการ\u003c/h3>\n      \u003cselect id=\"m-filter\" class=\"filter-select\" onchange=\"renderMoney()\">\u003coption value=\"\">ทุกหมวด\u003c/option>\u003c/select>\n    \u003c/div>\n    \u003cdiv id=\"m-list\">\u003c/div>\n  \u003c/div>\n\u003c/div>\u003c/div>\n\n\u003c!-- LINE: ตั้งค่าการเชื่อมต่อ LINE Bot -->\n\u003cdiv id=\"page-line\" class=\"tab-page\">\u003cdiv class=\"tab-inner\">\n  \u003cdiv>\u003ch2>💬 เชื่อมต่อ LINE\u003c/h2>\u003cdiv class=\"sub\">ตั้งค่า LINE Bot (Messaging API) สำหรับแจ้งเตือนรายการต่ออายุ + งานในปฏิทิน\u003c/div>\u003c/div>\n  \u003cdiv id=\"theme-card-admin\">\u003c/div>\n  \u003cdiv class=\"stat-row\" id=\"ln-stats\">\u003c/div>\n  \u003cdiv class=\"grid-2\">\n    \u003cdiv class=\"card\">\n      \u003ch3>① Channel Access Token\u003c/h3>\n      \u003cdiv class=\"fld\">\u003clabel>Token (long-lived) จาก LINE Developers → Messaging API\u003c/label>\n        \u003cinput type=\"password\" id=\"ln-token\" placeholder=\"วาง token ที่นี่\" autocomplete=\"off\">\u003c/div>\n      \u003cdiv class=\"row-btns\">\n        \u003cbutton class=\"btn2 primary\" onclick=\"lnSaveToken()\">บันทึก Token\u003c/button>\n        \u003cbutton class=\"btn2 danger\" onclick=\"lnClearToken()\">ลบ Token\u003c/button>\n        \u003cspan class=\"sub\" id=\"ln-token-hint\">\u003c/span>\n      \u003c/div>\n      \u003ch3 style=\"margin-top:20px\">② Webhook URL\u003c/h3>\n      \u003cdiv class=\"fld\">\u003clabel>URL ของ deployment ที่ 2 (Who has access: Anyone)\u003c/label>\n        \u003cinput type=\"text\" id=\"ln-base\" placeholder=\"https://script.google.com/macros/s/…/exec\" oninput=\"lnRenderWebhook()\">\u003c/div>\n      \u003cdiv class=\"fld\">\u003clabel>🌐 ลิงก์หน้าเว็บ (GitHub Pages) — ไม่บังคับ แต่แนะนำ\u003c/label>\n        \u003cdiv class=\"code-box\">\u003cinput type=\"text\" id=\"ln-page\" placeholder=\"https://ชื่อคุณ.github.io/calenda/\">\u003cbutton class=\"btn2\" onclick=\"lnSavePage()\">บันทึก\u003c/button>\u003c/div>\n        \u003cdiv class=\"sub\" style=\"margin-top:4px\">ใส่แล้ว บอทจะส่งลิงก์นี้ให้ผู้ใช้ (เปิดได้ทุกเบราว์เซอร์ ไม่ติดปัญหา Chrome หลายบัญชี) · วิธีตั้งค่า: docs/GITHUB-PAGES.md\u003c/div>\u003c/div>\n      \u003cdiv class=\"fld\">\u003clabel>นำไปวางใน LINE Developers → Messaging API → Webhook URL\u003c/label>\n        \u003cdiv class=\"code-box\">\u003cinput type=\"text\" id=\"ln-webhook\" readonly>\u003cbutton class=\"btn2\" onclick=\"lnCopy()\">คัดลอก\u003c/button>\u003c/div>\u003c/div>\n      \u003col class=\"steps\">\n        \u003cli>สร้าง LINE OA + เปิด Messaging API → คัดลอก Token มาใส่ข้อ ①\u003c/li>\n        \u003cli>Apps Script → Deploy → New deployment → Web app · Execute as: Me · \u003cb>Who has access: Anyone\u003c/b>\u003c/li>\n        \u003cli>วาง URL ที่ได้ในช่องข้อ ② → คัดลอก Webhook URL ไปใส่ใน LINE → เปิด Use webhook\u003c/li>\n        \u003cli>แอดบอทเป็นเพื่อน / เชิญเข้ากลุ่ม → กด \"รีเฟรช\" ด้านล่าง → ติ๊กผู้รับ → บันทึก\u003c/li>\n      \u003c/ol>\n    \u003c/div>\n    \u003cdiv class=\"card\">\n      \u003ch3>③ การแจ้งเตือน\u003c/h3>\n      \u003cdiv class=\"opt-row\">\u003cspan>\u003cb>เปิดการแจ้งเตือนรายวัน\u003c/b>\u003c/span>\u003cinput type=\"checkbox\" id=\"ln-enabled\">\u003c/div>\n      \u003cdiv class=\"opt-row\">\u003cspan>เวลาส่งเริ่มต้น \u003csmall style=\"color:var(--text2)\">(คนที่ไม่ได้ตั้งเวลาเอง)\u003c/small>\u003c/span>\u003cselect id=\"ln-hour\" class=\"filter-select\">\u003c/select>\u003c/div>\n      \u003cdiv class=\"opt-row\">\u003cspan>เตือนงานปฏิทินที่ค้างซ้ำทุกวัน \u003csmall style=\"color:var(--text2)\">(ต่ออายุที่เลยกำหนดเตือนทุกวันเสมอ)\u003c/small>\u003c/span>\u003cinput type=\"checkbox\" id=\"ln-overdue\">\u003c/div>\n      \u003cdiv class=\"opt-row\">\u003cspan>วันที่ไม่มีรายการ ไม่ต้องส่ง (ประหยัดโควตา)\u003c/span>\u003cinput type=\"checkbox\" id=\"ln-skip\">\u003c/div>\n      \u003cdiv class=\"opt-row\">\u003cspan>คำสั่ง \"เช็ค\" แสดงต่ออายุล่วงหน้า\u003c/span>\n        \u003cselect id=\"ln-look\" class=\"filter-select\">\u003coption value=\"7\">7 วัน\u003c/option>\u003coption value=\"14\">14 วัน\u003c/option>\u003coption value=\"30\">30 วัน\u003c/option>\u003coption value=\"60\">60 วัน\u003c/option>\u003coption value=\"90\">90 วัน\u003c/option>\u003c/select>\u003c/div>\n      \u003ch3 style=\"margin-top:16px\">④ ผู้รับข้อความ\u003c/h3>\n      \u003cdiv id=\"ln-rcpt\">\u003c/div>\n      \u003cdiv class=\"sub\" style=\"margin:6px 0 12px\">ส่งเข้ากลุ่มนับโควตาตามจำนวนสมาชิก\u003c/div>\n      \u003cdiv class=\"row-btns\">\n        \u003cbutton class=\"btn2 primary\" onclick=\"lnSaveSettings()\">บันทึกการตั้งค่า\u003c/button>\n        \u003cbutton class=\"btn2\" onclick=\"lnTest()\">ส่งข้อความทดสอบ\u003c/button>\n        \u003cbutton class=\"btn2\" onclick=\"loadLine()\">รีเฟรช\u003c/button>\n      \u003c/div>\n      \u003cdiv class=\"sub\" id=\"ln-quota\" style=\"margin-top:12px\">\u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\u003c/div>\n\n\u003c!-- ผู้ใช้ (แอดมิน): อนุมัติ / เปลี่ยนชื่อ / ลิงก์ / ลบ -->\n\u003cdiv id=\"page-users\" class=\"tab-page\">\u003cdiv class=\"tab-inner\">\n  \u003cdiv style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap\">\n    \u003cdiv>\u003ch2>👥 ผู้ใช้\u003c/h2>\u003cdiv class=\"sub\">คนใหม่: แอดบอท LINE → พิมพ์ \"สมัคร\" → ตั้งชื่อ → อนุมัติที่นี่ หรือกดปุ่มใน LINE\u003c/div>\u003c/div>\n    \u003cbutton class=\"btn2\" onclick=\"loadUsers()\">รีเฟรช\u003c/button>\n  \u003c/div>\n  \u003cdiv class=\"card\" id=\"u-invite\">\u003c/div>\n  \u003cdiv id=\"u-body\">\u003cdiv class=\"sub\">กำลังโหลด…\u003c/div>\u003c/div>\n\u003c/div>\u003c/div>\n\n\u003c!-- คิวแจ้งเตือน: ข้อความที่จะส่งในแต่ละวัน -->\n\u003cdiv id=\"page-queue\" class=\"tab-page\">\u003cdiv class=\"tab-inner\">\n  \u003cdiv style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap\">\n    \u003cdiv>\u003ch2>🔔 ข้อความรอแจ้งเตือน\u003c/h2>\u003cdiv class=\"sub\">คำนวณจากรายการต่ออายุ + งานในปฏิทิน ตามการตั้งค่าในแท็บ LINE\u003c/div>\u003c/div>\n    \u003cdiv class=\"row-btns\">\n      \u003cselect id=\"q-days\" class=\"filter-select\" onchange=\"loadQueue()\">\u003coption value=\"7\">7 วัน\u003c/option>\u003coption value=\"30\" selected>30 วัน\u003c/option>\u003coption value=\"90\">90 วัน\u003c/option>\u003c/select>\n      \u003cbutton class=\"btn2\" onclick=\"loadQueue()\">รีเฟรช\u003c/button>\n    \u003c/div>\n  \u003c/div>\n  \u003cdiv id=\"q-body\">\u003cdiv class=\"sub\">กำลังโหลด…\u003c/div>\u003c/div>\n\u003c/div>\u003c/div>\n\n\u003c/div>\u003c!-- end app-content -->\n\n\u003c!-- Modal -->\n\u003cdiv id=\"modal\" class=\"modal-overlay\" style=\"display:none\" onclick=\"closeModalOverlay(event)\">\n  \u003cdiv class=\"modal\">\n    \u003ch2 id=\"modal-title\">เพิ่มงาน\u003c/h2>\n    \u003cdiv class=\"form-row\">\n      \u003clabel>ชื่องาน *\u003c/label>\n      \u003cinput type=\"text\" id=\"f-title\" placeholder=\"ระบุชื่องาน...\">\n    \u003c/div>\n    \u003cdiv class=\"form-row form-row-2\">\n      \u003cdiv>\n        \u003clabel>วันที่เริ่ม *\u003c/label>\n        \u003cinput type=\"text\" id=\"f-date\" placeholder=\"DD/MM/YYYY\" readonly style=\"cursor:pointer\">\n      \u003c/div>\n      \u003cdiv id=\"f-enddate-row\">\n        \u003clabel>วันที่จบ \u003cspan style=\"font-weight:400\">(ว่าง = วันเดียว)\u003c/span>\u003c/label>\n        \u003cinput type=\"text\" id=\"f-dateend\" placeholder=\"DD/MM/YYYY\" readonly style=\"cursor:pointer\">\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"form-row form-row-2\" id=\"f-time-row\">\n      \u003cdiv>\n        \u003clabel>เวลาเริ่ม *\u003c/label>\n        \u003cdiv class=\"time-picker\">\n          \u003cselect id=\"f-start-h\">\u003coption value=\"\">--\u003c/option>\u003c/select>\n          \u003cspan>:\u003c/span>\n          \u003cselect id=\"f-start-m\">\u003coption value=\"\">--\u003c/option>\u003c/select>\n        \u003c/div>\n      \u003c/div>\n      \u003cdiv>\n        \u003clabel>ระยะเวลา\u003c/label>\n        \u003cdiv class=\"time-picker\">\n          \u003cselect id=\"f-duration\">\u003c/select>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"form-row\" style=\"margin-top:-6px\">\n      \u003clabel style=\"display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-weight:400;font-size:13px;white-space:nowrap\">\n        \u003cinput type=\"checkbox\" id=\"f-allday\" checked onchange=\"toggleAllDay()\">\n        ทั้งวัน (All day)\n      \u003c/label>\n    \u003c/div>\n    \u003cdiv class=\"form-row\">\n      \u003clabel>ประเภท\u003c/label>\n      \u003cselect id=\"f-type\">\n        \u003coption value=\"project\">โปรเจกต์\u003c/option>\n        \u003coption value=\"daily\">งานประจำวัน\u003c/option>\n        \u003coption value=\"meeting\">นัดหมาย/ประชุม\u003c/option>\n        \u003coption value=\"tracking\">ติดตามงาน\u003c/option>\n      \u003c/select>\n    \u003c/div>\n    \u003cdiv class=\"form-row\">\n      \u003clabel>สถานะ\u003c/label>\n      \u003cselect id=\"f-status\">\n        \u003coption value=\"todo\">รอดำเนินการ\u003c/option>\n        \u003coption value=\"inprogress\">กำลังดำเนินการ\u003c/option>\n        \u003coption value=\"done\">เสร็จแล้ว\u003c/option>\n      \u003c/select>\n    \u003c/div>\n    \u003cdiv class=\"form-row\">\n      \u003clabel>ผู้รับผิดชอบ\u003c/label>\n      \u003cdiv class=\"assignee-list\" id=\"f-assignees\" style=\"max-height:140px;overflow-y:auto;border:1px solid var(--border);border-radius:6px;padding:6px\">\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"form-row\">\n      \u003clabel>หมายเหตุ\u003c/label>\n      \u003ctextarea id=\"f-notes\" placeholder=\"รายละเอียดเพิ่มเติม...\">\u003c/textarea>\n    \u003c/div>\n    \u003cdiv class=\"modal-actions\">\n      \u003cbutton class=\"btn-delete\" id=\"btn-delete\" style=\"display:none\" onclick=\"deleteEvent()\">ลบงาน\u003c/button>\n      \u003cbutton class=\"btn-cancel\" onclick=\"closeModal()\">ยกเลิก\u003c/button>\n      \u003cbutton class=\"btn-save\" id=\"btn-save\" onclick=\"saveEvent()\">บันทึก\u003c/button>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003cinput type=\"file\" id=\"file-input\" style=\"display:none\">\n\n\u003c!-- ===================================================================\n     หน้า Expire (รายการต่ออายุ) — แสดงในแท็บ ⏳ Expire ผ่าน iframe srcdoc\n     \u003ctemplate> ไม่ถูกแสดง/รันจนกว่าจะถูกนำไปใส่ iframe\n     =================================================================== -->\n\u003ctemplate id=\"expire-tpl\">\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>ตารางวันต่ออายุ\u003c/title>\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003clink href=\"https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap\" rel=\"stylesheet\">\n\u003cstyle>\n/* ---------- tokens: dark เป็นค่าเริ่มต้น ---------- */\n:root{\n  --bg:#0a0c11; --surface:#12151d; --surface-2:#1a1e28; --border:#242a37; --border-2:#2f3646;\n  --text:#eef1f6; --text-2:#b7bfcd; --muted:#7d879a;\n  --accent:#06c755; --accent-2:#3ee08a; --chart:#6d8cff; --chart-dim:#2b3553;\n  --red:#ff5f5f; --orange:#ff9f43; --yellow:#f3c73f; --green:#34d27f;\n  --glow1:rgba(6,199,85,.16); --glow2:rgba(109,140,255,.14);\n  --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 10px 30px rgba(0,0,0,.35);\n  --radius:18px;\n}\n:root[data-theme=\"light\"]{\n  --bg:#f3f5f9; --surface:#ffffff; --surface-2:#f1f3f7; --border:#e2e6ee; --border-2:#d3d9e4;\n  --text:#141821; --text-2:#3e4655; --muted:#6b7385;\n  --chart:#3f63e0; --chart-dim:#dfe5f7;\n  --red:#dc3d43; --orange:#dd6b0e; --yellow:#b88a00; --green:#1c9a52;\n  --glow1:rgba(6,199,85,.10); --glow2:rgba(63,99,224,.08);\n  --shadow:0 1px 2px rgba(16,24,40,.04),0 8px 24px rgba(16,24,40,.06);\n}\n*{box-sizing:border-box}\nhtml,body{margin:0}\nbody{\n  background:\n    radial-gradient(900px 500px at 85% -10%,var(--glow2),transparent 60%),\n    radial-gradient(700px 420px at 10% 0%,var(--glow1),transparent 60%),\n    var(--bg);\n  background-attachment:fixed;\n  color:var(--text);font-family:\"IBM Plex Sans Thai\",system-ui,sans-serif;font-size:15px;line-height:1.5;min-height:100vh\n}\nbutton,input,select,textarea{font:inherit;color:inherit}\n.num{font-family:\"Space Grotesk\",\"IBM Plex Sans Thai\",sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.02em}\n\n/* ---------- shell ---------- */\n.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}\naside.side{position:sticky;top:0;height:100vh;padding:22px 16px;border-right:1px solid var(--border);display:flex;flex-direction:column;gap:6px;background:color-mix(in srgb,var(--surface) 60%,transparent);backdrop-filter:blur(12px)}\n.logo{display:flex;align-items:center;gap:10px;padding:4px 8px 20px}\n.logo .mark{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--accent),#00a5a0);display:grid;place-items:center;box-shadow:0 6px 20px rgba(6,199,85,.35)}\n.logo b{font-size:16px;display:block;line-height:1.2}\n.logo small{color:var(--muted);font-size:12px}\n.nav{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;border:0;background:transparent;cursor:pointer;color:var(--text-2);font-weight:500;text-align:left;width:100%}\n.nav:hover{background:var(--surface-2);color:var(--text)}\n.nav.active{background:var(--surface-2);color:var(--text);box-shadow:inset 3px 0 0 var(--accent)}\n.nav svg{flex:none}\n.nav .cnt{margin-left:auto;font-size:12px;background:var(--red);color:#fff;border-radius:99px;padding:0 7px;font-weight:700}\n.side .spacer{flex:1}\n.line-mini{border:1px solid var(--border);border-radius:14px;padding:12px;font-size:13px;color:var(--text-2);background:var(--surface)}\n.line-mini .row{display:flex;align-items:center;gap:8px}\n.pulse{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 0 rgba(6,199,85,.6);animation:pulse 2s infinite}\n.pulse.off{background:var(--muted);animation:none}\n@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(6,199,85,0)}100%{box-shadow:0 0 0 0 rgba(6,199,85,0)}}\n\nmain.content{padding:24px 28px 90px;min-width:0;max-width:1320px;width:100%}\n.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:22px}\n.topbar h1{font-size:26px;margin:0;font-weight:700;letter-spacing:-.01em}\n.topbar p{margin:0;color:var(--muted);font-size:13px}\n.actions{display:flex;gap:8px;flex-wrap:wrap}\n.btn{border:1px solid var(--border);background:var(--surface);padding:9px 14px;border-radius:12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-weight:500;transition:.15s}\n.btn:hover{border-color:var(--border-2);background:var(--surface-2)}\n.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 6px 18px rgba(6,199,85,.3)}\n.btn.primary:hover{filter:brightness(1.07)}\n.btn.sm{padding:5px 10px;font-size:13px;border-radius:9px}\n.btn.ghost{background:transparent;border-color:transparent}\n.btn.danger{color:var(--red)}\n.icon-btn{width:40px;justify-content:center;padding:9px 0}\n\n/* ---------- cards ---------- */\n.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);min-width:0}\n.card h3{margin:0;font-size:15px;font-weight:600}\n.card .sub{color:var(--muted);font-size:12.5px}\n.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}\n.grid{display:grid;gap:16px}\n.g-top{grid-template-columns:1.7fr 1fr 1fr;grid-template-rows:auto auto}\n.g-mid{grid-template-columns:1.7fr 1fr;margin-top:16px}\n.g-bot{grid-template-columns:1.2fr 1fr 1fr;margin-top:16px}\n\n/* hero */\n.hero{grid-row:span 2;position:relative;overflow:hidden;display:flex;flex-direction:column;\n  background:linear-gradient(160deg,color-mix(in srgb,var(--st) 16%,var(--surface)) 0%,var(--surface) 60%)}\n.hero::after{content:\"\";position:absolute;right:-80px;top:-80px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--st) 30%,transparent),transparent 70%);pointer-events:none}\n.hero .eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}\n.hero-body{display:flex;align-items:center;gap:22px;margin-top:14px;flex:1}\n.ring{position:relative;width:150px;height:150px;flex:none}\n.ring svg{transform:rotate(-90deg);overflow:visible}\n.ring .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}\n.ring .c b{font-size:44px;line-height:1;display:block}\n.ring .c span{font-size:12px;color:var(--muted)}\n.hero h2{margin:0 0 4px;font-size:21px;line-height:1.3}\n.hero .meta{color:var(--text-2);font-size:13.5px;display:grid;gap:3px}\n.hero-foot{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}\n\n/* kpi */\n.kpi{cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;gap:10px;text-align:left;transition:.15s;color:var(--text)}\n.kpi:hover{transform:translateY(-2px);border-color:var(--border-2)}\n.kpi .top{display:flex;justify-content:space-between;align-items:center}\n.kpi .ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:color-mix(in srgb,var(--st) 16%,transparent);color:var(--st)}\n.kpi .v{font-size:40px;font-weight:700;line-height:1}\n.kpi .l{color:var(--text-2);font-size:13.5px}\n.kpi .spark{height:4px;border-radius:99px;background:var(--surface-2);overflow:hidden}\n.kpi .spark i{display:block;height:100%;background:var(--st);border-radius:99px}\n\n/* charts */\n.chart svg{display:block;width:100%;height:auto;overflow:visible}\n.chart .grid-l{stroke:var(--border);stroke-width:1}\n.chart .ax{fill:var(--muted);font-size:11px}\n.chart .bar{fill:var(--chart);transition:opacity .15s}\n.chart .bar.now{fill:var(--accent)}\n.chart .hit{fill:transparent;cursor:pointer}\n.chart g.col:hover .bar{opacity:.8}\n.chart .val{fill:var(--text-2);font-size:11px;font-weight:600}\n.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--text-2)}\n.legend span{display:inline-flex;align-items:center;gap:6px}\n.sw{width:10px;height:10px;border-radius:3px;display:inline-block}\n\n.donut-wrap{display:flex;align-items:center;gap:18px}\n.donut{position:relative;width:150px;flex:none}\n.donut .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center;pointer-events:none}\n.donut .c b{font-size:32px;display:block;line-height:1}\n.donut .c span{font-size:12px;color:var(--muted)}\n.donut circle.seg{cursor:pointer;transition:stroke-width .15s}\n.donut circle.seg:hover{stroke-width:26}\n.dl{display:grid;gap:8px;flex:1;min-width:0}\n.dl .r{display:grid;grid-template-columns:auto 1fr
