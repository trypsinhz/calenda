003c/span>\u003c/div>')+'\u003c/div>';\n  }).join('');\n  return html;\n}\n\n// ===== แท็บผู้ใช้ (แอดมิน) =====\nfunction uAct(act, id, value, okMsg) {\n  return api({action:'userAction', act:act, id:id, value:value}).then(function(r){\n    if (r && r.error) throw new Error(r.error);\n    if (okMsg) showToast(okMsg);\n    loadUsers(); return r;\n  }).catch(function(err){ showToast('ไม่สำเร็จ: ' + err.message); });\n}\nfunction copyText(t) {\n  var ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select();\n  try { document.execCommand('copy'); showToast('คัดลอกแล้ว'); } catch(e) {}\n  ta.remove();\n}\nvar usersData = null;\nfunction loadUsers() {\n  if (!IS_ADMIN) return;\n  setLoading('users', true, 'กำลังโหลดรายชื่อผู้ใช้...');\n  api({action:'users'}).then(function(r){\n    if (r.error) throw new Error(r.error);\n    usersData = r; renderUsers(); setLoading('users', false);\n  }).catch(function(err){ loadFailed('users', err.message, loadUsers); });\n}\nfunction renderUsers() {\n  var r = usersData, pend = r.users.filter(function(u){ return u.status==='pending'; });\n  var b = document.getElementById('users-badge'); b.textContent = pend.length; b.style.display = pend.length ? '' : 'none';\n  document.getElementById('u-invite').innerHTML =\n    '\u003ch3>📨 ชวนคนใหม่\u003c/h3>' +\n    (r.addFriend ? '\u003cdiv class=\"code-box\" style=\"margin-bottom:10px\">\u003cinput type=\"text\" readonly value=\"'+escHtml(r.addFriend)+'\">\u003cbutton class=\"btn2\" onclick=\"copyText(\\''+escHtml(r.addFriend)+'\\')\">คัดลอก\u003c/button>\u003c/div>' : '\u003cdiv class=\"sub\" style=\"margin-bottom:10px\">ลิงก์เพิ่มเพื่อน: ดูใน LINE OA Manager → หน้าแรก → เพิ่มเพื่อน\u003c/div>') +\n    '\u003cdiv class=\"sub\">ส่งลิงก์นี้ให้เขาแอดบอท แล้วพิมพ์ \u003cb>สมัคร\u003c/b> ในแชท\u003c/div>' +\n    (r.webUrl ? '' : '\u003cdiv class=\"banner warn\" style=\"margin-top:10px\">⚠️ ยังไม่ได้ตั้ง URL ของ Web App (แท็บ 💬 LINE ข้อ ②) — ผู้ใช้จะยังไม่ได้ลิงก์หน้าเว็บ\u003c/div>');\n  var row = function(u){\n    var badge = u.role==='admin' ? '\u003cspan class=\"u-badge admin\">แอดมิน\u003c/span>' : u.status==='pending' ? '\u003cspan class=\"u-badge pending\">รออนุมัติ\u003c/span>' : '\u003cspan class=\"u-badge active\">ใช้งาน\u003c/span>';\n    var acts = [];\n    if (u.status==='pending') {\n      acts.push('\u003cbutton class=\"btn2 primary\" onclick=\"uAct(\\'approve\\',\\''+u.id+'\\',\\'\\',\\'อนุมัติแล้ว ✓\\')\">✅ อนุมัติ\u003c/button>');\n      acts.push('\u003cbutton class=\"btn2 danger\" onclick=\"if(confirm(\\'ปฏิเสธคำขอนี้?\\'))uAct(\\'reject\\',\\''+u.id+'\\',\\'\\',\\'ปฏิเสธแล้ว\\')\">❌ ปฏิเสธ\u003c/button>');\n    } else {\n      if (u.link) acts.push('\u003cbutton class=\"btn2\" onclick=\"copyText(\\''+escHtml(u.link)+'\\')\">🔗 คัดลอกลิงก์\u003c/button>');\n      acts.push('\u003cbutton class=\"btn2\" onclick=\"if(confirm(\\'ออกลิงก์ใหม่ให้ '+escHtml(u.name)+'? ลิงก์เก่าจะใช้ไม่ได้\\'))uAct(\\'rotate\\',\\''+u.id+'\\',\\'\\',\\'ออกลิงก์ใหม่แล้ว\\')\">🔄\u003c/button>');\n      acts.push('\u003cbutton class=\"btn2\" onclick=\"var n=prompt(\\'ชื่อใหม่\\',\\''+escHtml(u.name)+'\\');if(n)uAct(\\'rename\\',\\''+u.id+'\\',n,\\'เปลี่ยนชื่อแล้ว\\')\">✏️\u003c/button>');\n      if (u.role!=='admin') acts.push('\u003cbutton class=\"btn2 danger\" onclick=\"if(confirm(\\'ลบ '+escHtml(u.name)+' ออกจากระบบ? (งานของเขายังอยู่)\\'))uAct(\\'remove\\',\\''+u.id+'\\',\\'\\',\\'ลบแล้ว\\')\">🗑\u003c/button>');\n    }\n    var line = u.lineLinked ? '💬 ผูก LINE แล้ว' + (u.notify==='off' ? ' · ปิดแจ้งเตือน' : ' · 🕘 ' + (u.hour != null ? hh(u.hour) : 'เวลาเริ่มต้น')) : '⚠️ ยังไม่ผูก LINE';\n    if (!u.lineLinked && u.role==='admin' && r.unlinked.length) {\n      line += ' · \u003cselect class=\"filter-select\" onchange=\"if(this.value)uAct(\\'linkLine\\',\\''+u.id+'\\',this.value,\\'ผูก LINE แล้ว ✓\\')\">\u003coption value=\"\">เลือก LINE ของคุณ…\u003c/option>' +\n        r.unlinked.map(function(x){ return '\u003coption value=\"'+escHtml(x.id)+'\">'+escHtml(x.name)+'\u003c/option>'; }).join('') + '\u003c/select>';\n    }\n    return '\u003cdiv class=\"u-row\">\u003cdiv class=\"u-av\" style=\"background:'+escHtml(u.color||'#9ca3af')+'\">'+escHtml((u.name||'?').slice(0,1))+'\u003c/div>'+\n      '\u003cdiv>\u003cb>'+escHtml(u.name)+'\u003c/b>'+badge+'\u003cdiv class=\"u-meta\">'+line+'\u003c/div>\u003c/div>'+\n      '\u003cdiv class=\"u-actions\">'+acts.join('')+'\u003c/div>\u003c/div>';\n  };\n  var groups = [['⏳ รออนุมัติ', pend], ['✅ ผู้ใช้', r.users.filter(function(u){ return u.status==='active'; })]];\n  document.getElementById('u-body').innerHTML = groups.filter(function(g){ return g[1].length; }).map(function(g){\n    return '\u003cdiv class=\"sub\" style=\"margin:8px 0 6px;font-weight:700\">'+g[0]+' · '+g[1].length+'\u003c/div>\u003cdiv class=\"card\" style=\"padding:0\">'+g[1].map(row).join('')+'\u003c/div>';\n  }).join('');\n}\n\n// Expire โหลดเสร็จ (หรือพลาด) → ปิดหน้าโหลดของแท็บ\nfunction onExpireLoaded(err) {\n  if (err) loadFailed('expire', err, function(){ var x = expireApi(); setLoading('expire', true, 'กำลังโหลดรายการต่ออายุ...'); if (x) x.reload(); });\n  else setLoading('expire', false);\n  try { rebuildRenewals(); } catch(e) {}\n}\nfunction initExpireFrame() {\n  setLoading('expire', true, 'กำลังโหลดรายการต่ออายุ...');\n  // หน้า Expire อยู่ใน \u003ctemplate id=\"expire-tpl\"> ท้ายไฟล์นี้ (ไฟล์เดียวจบ)\n  document.getElementById('expire-frame').srcdoc = '\u003c!doctype html>\u003chtml lang=\"th\">' + document.getElementById('expire-tpl').innerHTML + '\u003c/html>';\n}\n\n// ===== Time Picker helpers =====\nfunction buildTimePicker() {\n  var dur=document.getElementById('f-duration');\n  if(dur){ dur.innerHTML=''; for(var k=1;k\u003c=12;k++) dur.innerHTML+='\u003coption value=\"'+k+'\">'+k+' ชม.\u003c/option>'; }\n  ['f-start-h'].forEach(function(id){\n    var s=document.getElementById(id); if(!s) return;\n    s.innerHTML='\u003coption value=\"\">--\u003c/option>';\n    for(var h=0;h\u003c24;h++) s.innerHTML+='\u003coption value=\"'+String(h).padStart(2,'0')+'\">'+String(h).padStart(2,'0')+'\u003c/option>';\n  });\n  ['f-start-m'].forEach(function(id){\n    var s=document.getElementById(id); if(!s) return;\n    s.innerHTML='\u003coption value=\"\">--\u003c/option>';\n    for(var m=0;m\u003c60;m++) s.innerHTML+='\u003coption value=\"'+String(m).padStart(2,'0')+'\">'+String(m).padStart(2,'0')+'\u003c/option>';\n  });\n}\nfunction getTimePicker(prefix) {\n  var h=document.getElementById(prefix+'-h').value;\n  var m=document.getElementById(prefix+'-m').value;\n  return (h&&m) ? h+':'+m : '';\n}\nfunction setTimePicker(prefix, val) {\n  var h='', m='';\n  if(val && val.includes(':')) { h=val.split(':')[0]; m=val.split(':')[1]; }\n  document.getElementById(prefix+'-h').value=h;\n  document.getElementById(prefix+'-m').value=m;\n}\n// ทั้งวัน = ไม่มีเวลา · ไม่ติ๊ก = เลือกเวลาเริ่ม + ระยะเวลา (1–12 ชม.)\nfunction toggleAllDay() {\n  // ทั้งวัน → ช่องเวลาเป็นสีเทา กดไม่ได้ (ค่าที่เลือกไว้ยังอยู่)\n  var allDay = document.getElementById('f-allday').checked;\n  document.getElementById('f-time-row').classList.toggle('disabled-row', allDay);\n  ['f-start-h','f-start-m','f-duration'].forEach(function(id){ document.getElementById(id).disabled = allDay; });\n}\nfunction addDaysStr(ds, n) { var d=new Date(ds+'T12:00:00'); d.setDate(d.getDate()+n); return toDateStr(d); }\n// ใส่ค่าเวลา/วันที่จบของงานลงฟอร์ม (งานข้ามเที่ยงคืนเก็บวันที่จบ +1 ไว้ → แสดงกลับเป็นวันจริงที่ผู้ใช้เลือก)\nfunction fillTimeFields(e, defaultTime) {\n  var start = e ? e.timeStart : (defaultTime||'');\n  var allDay = !start;\n  var dur = 1, end = e && e.dateEnd && e.dateEnd!==e.date ? e.dateEnd : '';\n  if (e && e.timeStart && e.timeEnd) {\n    var mins = timeToMins(e.timeEnd) - timeToMins(e.timeStart);\n    if (mins \u003c= 0) { mins += 1440; if (end) end = addDaysStr(end, -1); }   // ข้ามเที่ยงคืน\n    dur = Math.min(12, Math.max(1, Math.round(mins/60)));\n  }\n  if (e && end === e.date) end = '';\n  document.getElementById('f-allday').checked = allDay;\n  setTimePicker('f-start', start);\n  document.getElementById('f-duration').value = String(dur);\n  setFpDate(fpDateEnd, end);\n  toggleAllDay();\n}\n\n// ===== API (google.script.run) =====\nfunction api(params) {\n  return new Promise(function(resolve, reject) {\n    var action = params.action;\n    var runner = google.script.run\n      .withSuccessHandler(function(res) {\n        try { resolve(typeof res === 'string' ? JSON.parse(res) : res); }\n        catch(e) { reject(new Error('Parse error: ' + res)); }\n      })\n      .withFailureHandler(function(err) { reject(err); });\n\n    if (action === 'getAll') {\n      runner.apiGetAll(AUTH, viewAll);\n    } else if (action === 'save') {\n      runner.apiSave(JSON.stringify(params.event), AUTH);\n    } else if (action === 'delete') {\n      runner.apiDelete(params.id, AUTH);\n    } else if (action === 'saveTeamColor') {\n      runner.apiSaveTeamColor(params.name, params.color, AUTH);\n    } else if (action === 'saveSetting') {\n      runner.apiSaveSetting(params.key, params.value, AUTH);\n    } else if (action === 'users') {\n      runner.apiUsers(AUTH);\n    } else if (action === 'userAction') {\n      runner.apiUserAction(AUTH, params.act, params.id || '', params.value == null ? '' : params.value);\n    } else {\n      reject(new Error('Unknown action'));\n    }\n  });\n}\n\nfunction loadEvents(retryCount) {\n  retryCount = retryCount || 0;\n  setLoading('calenda', true, retryCount > 0 ? 'กำลังโหลดซ้ำ... (' + retryCount + ')' : 'กำลังโหลดปฏิทิน...');\n\n  // wait for google.script.run to be ready\n  if (typeof google === 'undefined' || typeof google.script === 'undefined') {\n    if (retryCount \u003c 5) {\n      setTimeout(function() { loadEvents(retryCount + 1); }, 800);\n    } else {\n      loadFailed('calenda', 'ไม่พบ google.script — กรุณาเปิดผ่านลิงก์จากบอท', function(){ loadEvents(); });\n    }\n    return;\n  }\n\n  google.script.run\n    .withSuccessHandler(function(res) {\n      try {\n        var data = typeof res === 'string' ? JSON.parse(res) : res;\n        if (data && data.error) return loadFailed('calenda', data.error, function(){ loadEvents(); });\n        events = (data && data.events) ? data.events : [];\n        team = (data && data.team) ? data.team : [];\n        // คุณอยู่บนสุด ตามด้วยคนอื่นเรียงตามชื่อ\n        team.sort(function(a, b){ return (b.id === ME.id) - (a.id === ME.id) || String(a.name).localeCompare(String(b.name), 'th'); });\n        settings = (data && data.settings) ? data.settings : {};\n        applyTypeColors();\n        applyTypeNames();\n        buildAssigneeFilter();\n        renderOwnerPick('cal');\n        render();\n        setLoading('calenda', false);\n      } catch(e) {\n        loadFailed('calenda', 'แปลงข้อมูลไม่สำเร็จ: ' + e.message, function(){ loadEvents(); });\n      }\n    })\n    .withFailureHandler(function(err) {\n      if (retryCount \u003c 2) {\n        setTimeout(function() { loadEvents(retryCount + 1); }, 1000);\n      } else {\n        loadFailed('calenda', String(err.message || err), function(){ loadEvents(); });\n      }\n    })\n    .apiGetAll(AUTH, viewAll);\n}\n\n// ===== Views =====\nfunction setView(v) {\n  currentView = v;\n  ['month','week','day','list'].forEach(function(x) {\n    document.getElementById('btn-'+x).classList.toggle('active', x===v);\n  });\n  render();\n}\n\nfunction navigate(dir) {\n  if (currentView==='month'||currentView==='list') currentDate.setMonth(currentDate.getMonth()+dir);\n  else if (currentView==='week') currentDate.setDate(currentDate.getDate()+dir*7);\n  else if (currentView==='day') { currentDate.setDate(currentDate.getDate()+dir); selectedDate=toDateStr(currentDate); }\n  render();\n}\n\nfunction goToday() { currentDate=new Date(); selectedDate=todayStr(); render(); }\n\nfunction render() {\n  renderToolbar();\n  renderDayList();\n  var area = document.getElementById('view-area');\n  if (currentView==='month') area.innerHTML = renderMonth();\n  else if (currentView==='week') area.innerHTML = renderWeek();\n  else if (currentView==='day') area.innerHTML = renderDay();\n  else area.innerHTML = renderList();\n}\n\nfunction renderToolbar() {\n  var title = '';\n  if (currentView==='month'||currentView==='list') title = MONTHS_TH[currentDate.getMonth()]+' '+(currentDate.getFullYear()+543);\n  else if (currentView==='week') {\n    var mon=getWeekStart(currentDate), sun=new Date(mon); sun.setDate(sun.getDate()+6);\n    title = mon.getDate()+' - '+sun.getDate()+' '+MONTHS_TH[sun.getMonth()]+' '+(sun.getFullYear()+543);\n  } else title = currentDate.getDate()+' '+MONTHS_TH[currentDate.getMonth()]+' '+(currentDate.getFullYear()+543);\n  document.getElementById('toolbar-title').textContent = title;\n}\n\nfunction getEventsForDate(ds) {\n  return events.concat(visibleRenewals()).filter(function(e){\n    if(!eventVisibleByAssignee(e)) return false;\n    var start = e.date || e.dateStart || '';\n    var end = e.dateEnd || start;\n    return ds >= start && ds \u003c= end;\n  }).sort(function(a,b){\n    var ta=a.timeStart||'99:99', tb=b.timeStart||'99:99';\n    return ta.localeCompare(tb);\n  });\n}\n\n// ===== Drag & Drop =====\nfunction onDragStart(ev, id, end) {\n  if(String(id).indexOf('rn:')===0){ ev.preventDefault(); showToast('แก้วันต่ออายุได้ที่แท็บ Expire'); return; }\n  draggingId = id;\n  draggingEnd = end || 'start';\n  ev.dataTransfer.effectAllowed = 'move';\n  setTimeout(function(){\n    var el = document.getElementById('drag-'+id+'-'+(end||'start'));\n    if(!el) el = document.getElementById('drag-'+id);\n    if(el) el.classList.add('dragging');\n  }, 0);\n}\nfunction onDragEnd(id, end) {\n  ['drag-'+id+'-start','drag-'+id+'-end','drag-'+id].forEach(function(eid){\n    var el=document.getElementById(eid); if(el) el.classList.remove('dragging');\n  });\n}\nfunction onDragOver(ev) { ev.preventDefault(); ev.currentTarget.classList.add('drop-target'); }\nfunction onDragLeave(ev) { ev.currentTarget.classList.remove('drop-target'); }\nfunction onDropMonth(ev, ds) {\n  ev.preventDefault(); ev.currentTarget.classList.remove('drop-target');\n  if(!draggingId) return;\n  var ev2 = events.find(function(e){return e.id===draggingId;});\n  if(!ev2) return;\n  if(draggingEnd === 'end') {\n    if(ds \u003c ev2.date) return; // ห้ามลาก end ไปก่อน start\n    if(ev2.dateEnd === ds) return;\n    ev2.dateEnd = ds;\n  } else {\n    var endDate = ev2.dateEnd || ev2.date;\n    if(ds > endDate) return; // ห้ามลาก start ไปหลัง end\n    if(ev2.date === ds) return;\n    ev2.date = ds;\n  }\n  dropSave(ev2);\n}\nfunction onDropWeek(ev, ds, h) {\n  ev.preventDefault(); ev.currentTarget.classList.remove('drop-target');\n  if(!draggingId) return;\n  var ev2 = events.find(function(e){return e.id===draggingId;});\n  if(!ev2) return;\n  var newTime = String(h).padStart(2,'0')+':00';\n  if(draggingEnd === 'end') {\n    if(ds \u003c ev2.date) return;\n    if(ev2.dateEnd === ds) return;\n    ev2.dateEnd = ds;\n  } else {\n    var endDate = ev2.dateEnd || ev2.date;\n    if(ds > endDate) return;\n    if(ev2.date===ds && ev2.timeStart===newTime) return;\n    ev2.date = ds; ev2.timeStart = newTime;\n  }\n  dropSave(ev2);\n}\nfunction onDropDay(ev, h) {\n  ev.preventDefault(); ev.currentTarget.classList.remove('drop-target');\n  if(!draggingId) return;\n  var ev2 = events.find(function(e){return e.id===draggingId;});\n  if(!ev2) return;\n  var newTime = String(h).padStart(2,'0')+':00';\n  if(ev2.timeStart===newTime) return;\n  ev2.timeStart = newTime;\n  dropSave(ev2);\n}\nfunction dropSave(ev2) {\n  draggingId = null;\n  // Optimistic UI: ev2 ถูกแก้ใน events array แล้ว → render ทันที\n  render();\n  api({action:'save', event:ev2}).then(function(res){\n    if(res && res.error) throw new Error(res.error);\n  })\n    .catch(function(err){ loadEvents(); showToast('ย้ายไม่สำเร็จ: '+err.message); });\n}\n\n// Month\nfunction renderMonth() {\n  var y=currentDate.getFullYear(), m=currentDate.getMonth();\n  var first=new Date(y,m,1), last=new Date(y,m+1,0);\n  var startDow=first.getDay();\n  var allDays=[];\n  for(var i=0;i\u003cstartDow;i++) allDays.push({d:new Date(y,m,-(startDow-i-1)),other:true});\n  for(var d=1;d\u003c=last.getDate();d++) allDays.push({d:new Date(y,m,d),other:false});\n  var rem=allDays.length%7===0?0:7-(allDays.length%7);\n  for(var i=1;i\u003c=rem;i++) allDays.push({d:new Date(y,m+1,i),other:true});\n  var html='\u003cdiv class=\"month-grid\">\u003cdiv class=\"month-dow-row\">';\n  DOWS_TH.forEach(function(d){html+='\u003cdiv class=\"month-dow\">'+d+'\u003c/div>';});\n  html+='\u003c/div>\u003cdiv class=\"month-weeks\">';\n  for(var wi=0;wi\u003callDays.length;wi+=7) html+=renderMonthWeek(allDays.slice(wi,wi+7));\n  return html+'\u003c/div>\u003c/div>';\n}\n\nfunction renderMonthWeek(week) {\n  var weekStart=toDateStr(week[0].d), weekEnd=toDateStr(week[6].d);\n  // multi-day events intersecting this week\n  var multiEvs=events.filter(function(e){\n    return eventVisibleByAssignee(e) && e.dateEnd && e.dateEnd!==e.date && e.date\u003c=weekEnd && e.dateEnd>=weekStart;\n  }).sort(function(a,b){return a.date.localeCompare(b.date);});\n  // slot assignment (greedy, no vertical overlap)\n  var slots=[];\n  var placed=multiEvs.map(function(e){\n    var sc=week.findIndex(function(x){return toDateStr(x.d)===(e.date\u003cweekStart?weekStart:e.date);});\n    var ec=week.findIndex(function(x){return toDateStr(x.d)===(e.dateEnd>weekEnd?weekEnd:e.dateEnd);});\n    if(sc\u003c0)sc=0; if(ec\u003c0)ec=6;\n    var slot=0;\n    while(slots[slot]!==undefined && slots[slot]>=sc) slot++;\n    slots[slot]=ec;\n    return {e:e,sc:sc,ec:ec,slot:slot};\n  });\n  // barsTop = 6px cell-padding + 28px (.cell-day height+margin) = bottom of the day number\n  var barH=22, barsTop=34;\n  var barsSpace=slots.length>0 ? slots.length*barH+4 : 0;\n  // day cells — number stays at top; a spacer reserves room for the multi-day bars\n  var html='\u003cdiv class=\"month-week\">\u003cdiv class=\"month-week-cells\">';\n  week.forEach(function(day){\n    var ds=toDateStr(day.d);\n    var isToday=ds===todayStr(), isSel=ds===selectedDate;\n    var cls='month-cell'+(day.other?' other-month':'')+(isToday?' today':'')+(isSel?' selected':'');\n    var inner='\u003cdiv class=\"cell-day\">'+day.d.getDate()+'\u003c/div>';\n    if(barsSpace>0) inner+='\u003cdiv style=\"height:'+barsSpace+'px\">\u003c/div>';\n    var evs=getEventsForDate(ds).filter(function(e){return !e.dateEnd||e.dateEnd===e.date;});\n    var maxShow=Math.max(1, 3-slots.length);\n    var shown=evs.length>maxShow ? maxShow-1 : maxShow;   // เหลือที่ 1 บรรทัดให้ \"+N งาน\"\n    if(shown\u003c1) shown=0;\n    evs.slice(0,shown).forEach(function(e){\n      var doneCls=e.status==='done'?' done-ev':'';\n      inner+='\u003cdiv id=\"drag-'+e.id+'-start\" class=\"cell-event '+e.type+doneCls+'\" draggable=\"true\"'+\n        ' ondragstart=\"onDragStart(event,\\''+e.id+'\\',\\'start\\')\" ondragend=\"onDragEnd(\\''+e.id+'\\',\\'start\\')\"'+\n        ' title=\"'+escHtml((e.timeStart?e.timeStart+' ':'')+e.title)+'\"'+\n        ' onclick=\"event.stopPropagation();openModal(\\''+e.id+'\\')\">'+(e.timeStart?e.timeStart+' ':'')+evTitle(e)+assigneeDotsHtml(e)+'\u003c/div>';\n    });\n    if(evs.length>shown) inner+='\u003cdiv class=\"cell-more\" onclick=\"event.stopPropagation();selectDay(\\''+ds+'\\');setView(\\'day\\')\" style=\"cursor:pointer;color:var(--primary)\">+'+(evs.length-shown)+' งาน\u003c/div>';\n    html+='\u003cdiv class=\"'+cls+'\" onclick=\"selectDay(\\''+ds+'\\')\"'+\n      ' ondragover=\"onDragOver(event)\" ondragleave=\"onDragLeave(event)\" ondrop=\"onDropMonth(event,\\''+ds+'\\')\">'+inner+'\u003c/div>';\n  });\n  html+='\u003c/div>';\n  // bars overlay: absolute, top=34px (below day numbers), inside same .month-week\n  if(placed.length>0){\n    html+='\u003cdiv class=\"month-week-bars\" style=\"top:'+barsTop+'px\">';\n    placed.forEach(function(item){\n      var e=item.e, sc=item.sc, ec=item.ec, slot=item.slot;\n      var startsHere=e.date>=weekStart, endsHere=e.dateEnd\u003c=weekEnd;\n      var doneCls=e.status==='done'?' done-ev':'';\n      var left='calc('+(sc/7*100)+'% + '+(startsHere?'1':'0')+'px)';\n      var wCols=(ec-sc+1)/7*100;\n      var width='calc('+wCols+'% - '+(startsHere?2:0)+'px - '+(endsHere?3:0)+'px)';\n      var top=(slot*barH+2)+'px';\n      var label=(!startsHere?'◀ ':'')+evTitle(e);\n      html+='\u003cdiv class=\"multiday-bar '+e.type+doneCls+'\" style=\"left:'+left+';width:'+width+';top:'+top+'\"'+\n        ' draggable=\"true\"'+\n        ' ondragstart=\"onDragStart(event,\\''+e.id+'\\',\\'start\\')\"'+\n        ' ondragend=\"onDragEnd(\\''+e.id+'\\',\\'start\\')\"'+\n        ' onclick=\"event.stopPropagation();openModal(\\''+e.id+'\\')\">';\n      html+='\u003cspan class=\"bar-label\">'+label+'\u003c/span>'+(startsHere?assigneeDotsHtml(e):'');\n      if(endsHere){\n        html+='\u003cspan class=\"bar-handle\" draggable=\"true\"'+\n          ' ondragstart=\"event.stopPropagation();onDragStart(event,\\''+e.id+'\\',\\'end\\')\"'+\n          ' ondragend=\"onDragEnd(\\''+e.id+'\\',\\'end\\')\">⠿\u003c/span>';\n      } else {\n        html+='\u003cspan class=\"bar-arrow\">▶\u003c/span>';\n      }\n      html+='\u003c/div>';\n    });\n    html+='\u003c/div>';\n  }\n  html+='\u003c/div>';\n  return html;\n}\n\nfunction selectDay(ds) {\n  selectedDate=ds; currentDate=new Date(ds+'T12:00:00');\n  render();\n  // มือถือ: เลื่อนไปที่การ์ดรายการงานให้เห็นทันที\n  if (window.innerWidth \u003c 640 && currentView === 'month') {\n    var c = document.getElementById('day-card'); if (c && c.scrollIntoView) c.scrollIntoView({behavior:'smooth', block:'start'});\n  }\n}\n\n// Week\nfunction getWeekStart(d) { var r=new Date(d); r.setDate(r.getDate()-r.getDay()); return r; }\n\nfunction renderWeek() {\n  var mon=getWeekStart(currentDate), days=[];\n  for(var i=0;i\u003c7;i++){var d=new Date(mon);d.setDa ay() {\n  var ds=toDateStr(currentDate);\n  var html='\u003cdiv class=\"day-container\">';\n  for(var h=0;h\u003c24;h++){\n    var evs=getEventsForDate(ds).filter(function(e){return !e.timeStart?h===8:parseInt(e.timeStart.split(':')[0])===h;});\n    var inner=evs.map(function(e){\n      var doneCls=e.status==='done'?' done-ev':'';\n      return '\u003cdiv id=\"drag-'+e.id+'\" class=\"day-event '+e.type+doneCls+'\" draggable=\"true\"'+\n        ' ondragstart=\"onDragStart(event,\\''+e.id+'\\')\" ondragend=\"onDragEnd(\\''+e.id+'\\')\"'+\n        ' onclick=\"event.stopPropagation();openModal(\\''+e.id+'\\')\">'+\n        '\u003cdiv class=\"day-event-title\">'+evTitle(e)+assigneeDotsHtml(e)+'\u003c/div>'+\n        '\u003cdiv class=\"day-event-meta\">'+(e.timeStart||'')+(e.timeEnd?' - '+e.timeEnd:'')+' · '+escHtml(TYPE_TH[e.type]||'')+' · '+(STATUS_TH[e.status]||'')+(parseAssignees(e.assignees).length?' · '+parseAssignees(e.assignees).join(', '):'')+'\u003c/div>\u003c/div>';\n    }).join('');\n    html+='\u003cdiv class=\"day-hour-row\">\u003cdiv class=\"day-hour-label\">'+h+':00\u003c/div>'+\n      '\u003cdiv class=\"day-hour-events\" onclick=\"openModalDate(\\''+ds+'\\',\\''+String(h).padStart(2,'0')+':00\\')\"'+\n      ' ondragover=\"onDragOver(event)\" ondragleave=\"onDragLeave(event)\" ondrop=\"onDropDay(event,'+h+')\">'+inner+'\u003c/div>\u003c/div>';\n  }\n  return html+'\u003c/div>';\n}\n\n// List\nfunction renderList() {\n  var filtered=events.concat(visibleRenewals()).sort(function(a,b){return a.date.localeCompare(b.date)||(a.timeStart||'').localeCompare(b.timeStart||'');});\n  filtered=filtered.filter(eventVisibleByAssignee);\n  if(listFilter.type) filtered=filtered.filter(function(e){return listFilter.type==='rn' ? e.renewal : e.type===listFilter.type;});\n  if(listFilter.status) filtered=filtered.filter(function(e){return e.status===listFilter.status;});\n  if(listFilter.search) {\n    var s=listFilter.search.toLowerCase();\n    filtered=filtered.filter(function(e){return String(e.title).toLowerCase().includes(s)||String(e.notes||'').toLowerCase().includes(s);});\n  }\n  var html='\u003cdiv class=\"list-filters\">'+\n    '\u003cinput type=\"text\" class=\"filter-select\" placeholder=\"ค้นหา...\" oninput=\"listFilter.search=this.value;reRenderList()\" value=\"'+escHtml(listFilter.search)+'\" id=\"list-search\" style=\"width:180px\">'+\n    '\u003cselect class=\"filter-select\" onchange=\"listFilter.type=this.value;reRenderList()\">'+\n      '\u003coption value=\"\">ทุกประเภท\u003c/option>'+\n      '\u003coption value=\"project\"'+(listFilter.type==='project'?' selected':'')+'>'+escHtml(TYPE_TH.project)+'\u003c/option>'+\n      '\u003coption value=\"daily\"'+(listFilter.type==='daily'?' selected':'')+'>'+escHtml(TYPE_TH.daily)+'\u003c/option>'+\n      '\u003coption value=\"meeting\"'+(listFilter.type==='meeting'?' selected':'')+'>'+escHtml(TYPE_TH.meeting)+'\u003c/option>'+\n      '\u003coption value=\"tracking\"'+(listFilter.type==='tracking'?' selected':'')+'>'+escHtml(TYPE_TH.tracking)+'\u003c/option>'+\n      '\u003coption value=\"rn\"'+(listFilter.type==='rn'?' selected':'')+'>ต่ออายุ\u003c/option>'+\n    '\u003c/select>'+\n    '\u003cselect class=\"filter-select\" onchange=\"listFilter.status=this.value;reRenderList()\">'+\n      '\u003coption value=\"\">ทุกสถานะ\u003c/option>'+\n      '\u003coption value=\"todo\"'+(listFilter.status==='todo'?' selected':'')+'>รอดำเนินการ\u003c/option>'+\n      '\u003coption value=\"inprogress\"'+(listFilter.status==='inprogress'?' selected':'')+'>กำลังดำเนินการ\u003c/option>'+\n      '\u003coption value=\"done\"'+(listFilter.status==='done'?' selected':'')+'>เสร็จแล้ว\u003c/option>'+\n    '\u003c/select>'+\n    '\u003cspan style=\"color:var(--text2);font-size:12px\">'+filtered.length+' รายการ\u003c/span>\u003c/div>';\n  if(!filtered.length) return html+'\u003cdiv style=\"text-align:center;color:var(--text2);padding:60px\">ไม่มีงาน\u003c/div>';\n  html+='\u003ctable class=\"list-table\">\u003cthead>\u003ctr>\u003cth>วันที่\u003c/th>\u003cth>เวลา\u003c/th>\u003cth>ชื่องาน\u003c/th>\u003cth>ประเภท\u003c/th>\u003cth>สถานะ\u003c/th>\u003cth>ผู้รับผิดชอบ\u003c/th>\u003cth>หมายเหตุ\u003c/th>\u003cth>\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>';\n  filtered.forEach(function(e){\n    var dObj=new Date(e.date+'T12:00:00');\n    var dateDisplay=String(dObj.getDate()).padStart(2,'0')+'/'+String(dObj.getMonth()+1).padStart(2,'0')+'/'+(dObj.getFullYear()+543);\n    var assignHtml=parseAssignees(e.assignees).map(function(n){\n      return '\u003cspan class=\"assignee-tag\">\u003cspan class=\"d\" style=\"background:'+teamColor(n)+'\">\u003c/span>'+escHtml(n)+'\u003c/span>';\n    }).join('') || '\u003cspan style=\"color:var(--text2)\">-\u003c/span>';\n    html+='\u003ctr>\u003ctd>'+dateDisplay+'\u003c/td>\u003ctd>'+(e.timeStart||'-')+(e.timeEnd?' - '+e.timeEnd:'')+'\u003c/td>'+\n      '\u003ctd>\u003cstrong>'+evTitle(e)+'\u003c/strong>\u003c/td>'+\n      '\u003ctd>\u003cspan class=\"type-badge '+e.type+'\">'+escHtml(TYPE_TH[e.type]||e.type)+'\u003c/span>\u003c/td>'+\n      '\u003ctd>'+(e.renewal?'\u003cspan style=\"color:var(--text2)\">-\u003c/span>':'\u003cspan class=\"status-badge '+e.status+'\">'+(STATUS_TH[e.status]||e.status)+'\u003c/span>')+'\u003c/td>'+\n      '\u003ctd>'+assignHtml+'\u003c/td>'+\n      '\u003ctd style=\"max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">'+escHtml(e.notes||'')+'\u003c/td>'+\n      '\u003ctd>\u003cbutton class=\"action-btn\" onclick=\"openModal(\\''+e.id+'\\')\">✏️\u003c/button>\u003c/td>\u003c/tr>';\n  });\n  return html+'\u003c/tbody>\u003c/table>';\n}\n\nfunction reRenderList() {\n  // คงโฟกัสช่องค้นหาไว้ (เดิมพิมพ์ได้ทีละตัวแล้วหลุด เพราะ re-render ทั้งตาราง)\n  var a = document.activeElement, focused = a && a.id === 'list-search', pos = focused ? a.selectionStart : 0;\n  document.getElementById('view-area').innerHTML = renderList();\n  if (focused) { var el = document.getElementById('list-search'); el.focus(); el.setSelectionRange(pos, pos); }\n}\n\n// Mini calendar\n// การ์ด \"รายการงาน\" ของวันที่เลือก (แสดงเฉพาะมุมมองเดือน)\nvar TYPE_BAR = { project:'var(--project)', daily:'var(--daily)', meeting:'var(--meeting)', tracking:'var(--tracking)',\n  'rn-over':'var(--rn-over)', 'rn-urgent':'var(--rn-urgent)', 'rn-soon':'var(--rn-soon)', 'rn-ok':'var(--rn-ok)' };\nfunction renderDayList() {\n  var card = document.getElementById('day-card');\n  if (!card) return;\n  card.style.display = currentView === 'month' ? '' : 'none';\n  if (currentView !== 'month') return;\n  var ds = selectedDate || todayStr();\n  var d = new Date(ds + 'T12:00:00');\n  var evs = getEventsForDate(ds);\n  document.getElementById('day-title').textContent = '📋 รายการงาน · ' + DOWS_FULL[d.getDay()] + ' ' + d.getDate() + ' ' +\n    MONTHS_TH[d.getMonth()] + ' ' + (d.getFullYear() + 543) + (evs.length ? ' · ' + evs.length + ' งาน' : '');\n  document.getElementById('day-add').onclick = function(){ openModalDate(ds, ''); };\n  if (!evs.length) { document.getElementById('day-list').innerHTML = '\u003cdiv class=\"day-empty\">ไม่มีงานในวันนี้\u003c/div>'; return; }\n  document.getElementById('day-list').innerHTML = evs.map(function(e){\n    var multi = e.dateEnd && e.dateEnd !== e.date;\n    var time = e.renewal ? 'ต่ออายุ' : e.timeStart ? e.timeStart + (e.timeEnd ? '–' + e.timeEnd : '') : 'ทั้งวัน';\n    if (multi && !e.renewal) time = isoToDisplay(e.date).slice(0,5) + '–' + isoToDisplay(e.dateEnd).slice(0,5);\n    var meta = [TYPE_TH[e.type] || ''];\n    var who = parseAssignees(e.assignees); if (who.length) meta.push(who.join(', '));\n    if (!e.renewal && e.status) meta.push(STATUS_TH[e.status] || e.status);\n    if (e._mine === false && e._ownerName) meta.push('👤 ' + e._ownerName);\n    return '\u003cdiv class=\"day-row' + (e.status === 'done' ? ' done' : '') + '\" onclick=\"openModal(\\'' + String(e.id).replace(/'/g, '') + '\\')\">' +\n      '\u003cspan class=\"day-bar\" style=\"background:' + (TYPE_BAR[e.type] || 'var(--primary)') + '\">\u003c/span>' +\n      '\u003cspan class=\"day-time\">' + escHtml(time) + '\u003c/span>' +\n      '\u003cdiv>\u003cdiv class=\"day-name\">' + evTitle(e) + '\u003c/div>\u003cdiv class=\"day-meta\">' + escHtml(meta.filter(Boolean).join(' · ')) + '\u003c/div>\u003c/div>\u003c/div>';\n  }).join('');\n}\n\nfunction renderMiniCal() {\n  if (!document.getElementById('mini-title')) return;   // ปฏิทินย่อเอาออกแล้ว\n  var y=miniDate.getFullYear(), m=miniDate.getMonth();\n  document.getElementById('mini-title').textContent=MONTHS_TH[m].slice(0,3)+' '+(y+543);\n  var first=new Date(y,m,1), last=new Date(y,m+1,0);\n  var html=DOWS_TH.map(function(d){return '\u003cdiv class=\"mini-dow\">'+d+'\u003c/div>';}).join('');\n  var startDow=first.getDay();\n  for(var i=0;i\u003cstartDow;i++){\n    var d=new Date(y,m,-(startDow-i-1));\n    html+='\u003cdiv class=\"mini-day other-month\" onclick=\"selectMiniDay(\\''+toDateStr(d)+'\\')\">'+d.getDate()+'\u003c/div>';\n  }\n  for(var d=1;d\u003c=last.getDate();d++){\n    var ds=toDateStr(new Date(y,m,d));\n    var isToday=ds===todayStr(), isSel=ds===selectedDate, hasEv=events.some(function(e){return e.date===ds;})||visibleRenewals().some(function(e){return e.date===ds;});\n    var cls='mini-day'+(isToday?' today':'')+(isSel&&!isToday?' selected':'')+(hasEv?' has-event':'');\n    html+='\u003cdiv class=\"'+cls+'\" onclick=\"selectMiniDay(\\''+ds+'\\')\">'+d+'\u003c/div>';\n  }\n  document.getElementById('mini-grid').innerHTML=html;\n}\n\nfunction selectMiniDay(ds) { selectedDate=ds; currentDate=new Date(ds+'T12:00:00'); miniDate=new Date(ds+'T12:00:00'); setView('day'); }\nfunction miniNav(dir) { miniDate.setMonth(miniDate.getMonth()+dir); renderMiniCal(); }\n\n// ===== Modal =====\nfunction openModal(id) {\n  if(id && String(id).indexOf('rn:')===0) return openRenewal(id);\n  editingId=id||null;\n  var e=id?events.find(function(x){return x.id===id;}):null;\n  document.getElementById('mo var sc = document.createElement('script');\n    sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js';\n    sc.onload = res; sc.onerror = function(){ rej(new Error('โหลดกราฟไม่สำเร็จ')); };\n    document.head.appendChild(sc);\n  });\n}\nfunction loadMoney(force) {\n  if (mLoading) return;\n  if (mData && !force && mLoadedViewAll === viewAllMoney) return renderMoney();\n  mLoading = true;\n  setLoading('money', true, 'กำลังโหลดรายจ่าย...');\n  var chartReady = loadChartJs().catch(function(){});\n  dapi('expList', {viewAll: viewAllMoney}).then(function(j){\n    mData = j.expenses || []; if (j.cats) M_CATS = j.cats; mLoadedViewAll = viewAllMoney;\n    var f = document.getElementById('m-filter');\n    if (f.options.length \u003c= 1) Object.keys(M_CATS).forEach(function(k){ f.innerHTML += '\u003coption value=\"'+k+'\">'+M_CATS[k].icon+' '+M_CATS[k].name+'\u003c/option>'; });\n    return chartReady;\n  }).then(function(){ mLoading = false; renderOwnerPick('money'); renderMoney(); setLoading('money', false); })\n    .catch(function(err){ mLoading = false; loadFailed('money', err.message, function(){ loadMoney(true); }); });\n}\nfunction mSetView(v) { mView = v; renderMoney(); }\nfunction mToday() { mDate = new Date(); renderMoney(); }\nfunction mNav(n) {\n  var d = new Date(mDate);\n  if (mView === 'day') d.setDate(d.getDate() + n);\n  else if (mView === 'month') { d.setDate(1); d.setMonth(d.getMonth() + n); }\n  else d.setFullYear(d.getFullYear() + n);\n  mDate = d; renderMoney();\n}\n// ช่วงวันที่ของมุมมอง (off = เลื่อนไปช่วงก่อนหน้า/ถัดไป)\nfunction mRange(off) {\n  var d = new Date(mDate.getFullYear(), mDate.getMonth(), mDate.getDate());\n  if (mView === 'day') { d.setDate(d.getDate() + (off||0)); var s = toDateStr(d); return {from:s, to:s, days:1}; }\n  if (mView === 'month') { var a = new Date(d.getFullYear(), d.getMonth() + (off||0), 1), b = new Date(a.getFullYear(), a.getMonth()+1, 0);\n    return {from: toDateStr(a), to: toDateStr(b), days: b.getDate(), y: a.getFullYear(), m: a.getMonth()}; }\n  var y = d.getFullYear() + (off||0);\n  return {from: y+'-01-01', to: y+'-12-31', days: (y%4===0 && (y%100!==0 || y%400===0)) ? 366 : 365, y: y};\n}\nfunction mLabel() {\n  var d = mDate;\n  if (mView === 'day') return DOWS_FULL[d.getDay()] + ' ' + d.getDate() + ' ' + M_MONTHS[d.getMonth()].slice(0,3) + '. ' + (d.getFullYear()+543);\n  if (mView === 'month') return M_MONTHS[d.getMonth()] + ' ' + (d.getFullYear()+543);\n  return 'ปี ' + (d.getFullYear()+543);\n}\nfunction mIn(r) { return (mData||[]).filter(function(e){ return e.date >= r.from && e.date \u003c= r.to && ownerOk('money', e.owner); }); }\nfunction mSum(list) { return list.reduce(function(a, e){ return a + Number(e.amount||0); }, 0); }\nfunction renderMoney() {\n  if (!mData) return;\n  document.querySelectorAll('#m-seg button').forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-v') === mView); });\n  document.getElementById('m-label').textContent = mLabel();\n  var r = mRange(0), list = mIn(r), total = mSum(list), prev = mSum(mIn(mRange(-1)));\n  // วันที่ผ่านไปแล้วในช่วงนี้ (ใช้คิดค่าเฉลี่ย)\n  var today = todayStr(), days = r.days;\n  if (today >= r.from && today \u003c= r.to) days = Math.round((new Date(today+'T12:00:00') - new Date(r.from+'T12:00:00')) / 864e5) + 1;\n  var byCat = Object.keys(M_CATS).map(function(k){ return {k:k, sum: mSum(list.filter(function(e){ return e.cat === k; }))}; })\n    .filter(function(c){ return c.sum > 0; }).sort(function(a,b){ return b.sum - a.sum; });\n  var diff = prev ? Math.round((total - prev) / prev * 100) : null;\n  var prevName = mView === 'day' ? 'เมื่อวาน' : mView === 'month' ? 'เดือนก่อน' : 'ปีก่อน';\n  var st = function(k, v, cls, sub){ return '\u003cdiv class=\"stat\">\u003cdiv class=\"k\">'+k+'\u003c/div>\u003cdiv class=\"v '+(cls||'')+'\">'+v+'\u003c/div>'+(sub?'\u003cdiv class=\"sub\" style=\"font-size:11px;margin-top:2px\">'+sub+'\u003c/div>':'')+'\u003c/div>'; };\n  document.getElementById('m-stats').innerHTML =\n    st('💰 ยอดรวม', baht(total), '', list.length + ' รายการ') +\n    st('เทียบ'+prevName, diff === null ? '–' : (diff > 0 ? '▲ ' : diff \u003c 0 ? '▼ ' : '') + Math.abs(diff) + '%', diff > 0 ? 'up' : diff \u003c 0 ? 'down' : '', prevName + ' ' + baht(prev)) +\n    (mView === 'day' ? st('🧾 จ่ายครั้งใหญ่สุด', list.length ? baht(Math.max.apply(null, list.map(function(e){ return e.amount; }))) : '–')\n      : st('📅 เฉลี่ยต่อวัน', baht(total / Math.max(days,1)), '', 'คิดจาก ' + days + ' วัน')) +\n    st('🏆 หมวดที่จ่ายมากสุด', byCat.length ? mCat(byCat[0].k).icon + ' ' + mCat(byCat[0].k).name : '–', '', byCat.length ? baht(byCat[0].sum) : '');\n  // กราฟโดนัท + คำอธิบาย\n  document.getElementById('m-center').innerHTML = '\u003csmall>รวม\u003c/small>\u003cb>' + baht(total) + '\u003c/b>';\n  document.getElementById('m-legend').innerHTML = byCat.length ? byCat.map(function(c){\n    var x = mCat(c.k); return '\u003cdiv class=\"m-leg\">\u003ci style=\"background:'+x.color+'\">\u003c/i>\u003cspan>'+x.icon+' '+x.name+'\u003csmall>'+Math.round(c.sum/total*100)+'%\u003c/small>\u003c/span>\u003cspan>'+baht(c.sum)+'\u003c/span>\u003c/div>';\n  }).join('') : '\u003cdiv class=\"sub\">ยังไม่มีรายจ่ายในช่วงนี้\u003c/div>';\n  // กราฟแท่ง: วัน → 7 วันล่าสุด · เดือน → รายวัน · ปี → รายเดือน (ซ้อนตามหมวด)\n  var labels = [], keys = [], bucket;\n  if (mView === 'day') {\n    for (var i = 6; i >= 0; i--) { var d = new Date(mDate); d.setDate(d.getDate() - i); keys.push(toDateStr(d)); labels.push(d.getDate() + '/' + (d.getMonth()+1)); }\n    bucket = function(e){ return e.date; };\n    document.getElementById('m-bar-title').textContent = '7 วันล่าสุด';\n  } else if (mView === 'month') {\n    for (var k = 1; k \u003c= r.days; k++) { keys.push(r.from.slice(0,8) + String(k).padStart(2,'0')); labels.push(String(k)); }\n    bucket = function(e){ return e.date; };\n    document.getElementById('m-bar-title').textContent = 'รายจ่ายรายวัน';\n  } else {\n    for (var
